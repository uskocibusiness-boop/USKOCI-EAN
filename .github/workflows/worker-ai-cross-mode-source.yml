name: Worker AI cross-mode source proof

on:
  push:
    branches: [feature/unified-qa-master-20261017]
    paths:
      - '.github/workflows/worker-ai-cross-mode-source.yml'
      - 'supabase/functions/_shared/classificationGeminiShadow.mjs'
      - 'supabase/functions/_shared/workerServiceModeContext.mjs'
      - 'supabase/functions/uskoci-worker-interview/**'
      - 'supabase/proofs/ai/owned_intake_edge_runtime.mjs'
      - 'supabase/proofs/ai/v5_worker_edge.test.mjs'
      - 'supabase/proofs/ai/ai_edge_context.test.mjs'
      - 'supabase/proofs/ai/classification-full-catalog-edge.test.mjs'
      - 'supabase/proofs/dynamic_taxonomy/classification-gemini-shadow.test.mjs'
      - 'supabase/proofs/dynamic_taxonomy/service-handoff.test.mjs'
      - 'supabase/proofs/dynamic_taxonomy/worker-existing-identity-recovery.test.mjs'
      - 'supabase/proofs/dynamic_taxonomy/classification-direct-reply.test.mjs'
      - 'supabase/proofs/dynamic_taxonomy/classification-verified-alias.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-ai-cross-mode-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.5.6
      - run: npm ci --no-audit --no-fund
      - name: Source contracts
        run: |
          python3 supabase/migrations/check_migration_integrity.py
          npx tsc --noEmit --pretty false
          deno check supabase/functions/uskoci-worker-interview/index.ts
      - name: Worker and adjacent task AI behavior
        run: |
          node --test \
            supabase/proofs/ai/v5_worker_edge.test.mjs \
            supabase/proofs/ai/ai_edge_context.test.mjs \
            supabase/proofs/ai/classification-full-catalog-edge.test.mjs \
            supabase/proofs/dynamic_taxonomy/classification-gemini-shadow.test.mjs \
            supabase/proofs/dynamic_taxonomy/service-handoff.test.mjs \
            supabase/proofs/dynamic_taxonomy/worker-existing-identity-recovery.test.mjs \
            supabase/proofs/dynamic_taxonomy/classification-direct-reply.test.mjs \
            supabase/proofs/dynamic_taxonomy/classification-verified-alias.test.mjs
