name: Taxonomy owner review exact projection (disposable PostgreSQL)
on:
  pull_request:
    paths:
      - 'supabase/candidates/dynamic-taxonomy-20261011/owner-review-exact-projection-v1.sql'
      - 'supabase/candidates/dynamic-taxonomy-20261011/disposable-owner-review-exact-*.sql'
      - '.github/workflows/taxonomy-owner-review-exact-pg-proof.yml'
      - 'supabase/candidates/dynamic-taxonomy-20261011/need-review-signed-classification-v1.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-review-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16','17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Install disposable exact catalog with aliases and modes
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-owner-review-exact-fixture.sql
      - name: Install private projection (NO DEV/PROD change)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/owner-review-exact-projection-v1.sql
      - name: Assert identities, modes, alias, version fence and denial
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-owner-review-exact-assert.sql
      - name: Parse original owner-bound Need review with signed classification (source-only)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/need-review-signed-classification-v1.sql
