name: Scoped existing Gemini AI and worker taxonomy preview proof
on:
  pull_request:
    paths:
      - '.github/workflows/taxonomy-scoped-existing-ai-worker-bridge-proof.yml'
      - 'supabase/candidates/dynamic-taxonomy-20261011/dev-scoped-ai-worker-readonly-bridge.sql'
      - 'supabase/candidates/dynamic-taxonomy-20261011/disposable-scoped-ai-worker-assert.sql'
  push:
    branches: [fix/match-ai-category-fallback-20261010]
    paths:
      - '.github/workflows/taxonomy-scoped-existing-ai-worker-bridge-proof.yml'
      - 'supabase/candidates/dynamic-taxonomy-20261011/dev-scoped-ai-worker-readonly-bridge.sql'
      - 'supabase/candidates/dynamic-taxonomy-20261011/disposable-scoped-ai-worker-assert.sql'
permissions:
  contents: read
jobs:
  scoped-ai-worker-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: ['16','17']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Recreate exact latest DEV private taxonomy migrations (no user data)
        run: |
          set -euo pipefail
          dir=supabase/candidates/dynamic-taxonomy-20261011
          psql -X -v ON_ERROR_STOP=1 -f "$dir/disposable-fixture.sql"
          psql -X -v ON_ERROR_STOP=1 -1 -f "$dir/dev-dark-launch-locked.sql"
          psql -X -v ON_ERROR_STOP=1 -1 -f "$dir/dev-seed-legacy-families.sql"
          psql -X -v ON_ERROR_STOP=1 -1 -f "$dir/dev-execution-scopes-two-root.sql"
          psql -X -v ON_ERROR_STOP=1 -1 -f "$dir/dev-scoped-ai-worker-readonly-bridge.sql"
      - name: Test specific remote work, legacy family and novel service proposal
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-scoped-ai-worker-assert.sql
      - name: Reject duplicate install and preserve exact authority boundaries
        run: |
          set -euo pipefail
          dir=supabase/candidates/dynamic-taxonomy-20261011
          if psql -X -v ON_ERROR_STOP=1 -1 -f "$dir/dev-scoped-ai-worker-readonly-bridge.sql" >/tmp/repeat.log 2>&1; then
            echo 'DUPLICATE_INSTALL_UNSAFE'; exit 1
          fi
          grep -q 'USKOCI_SCOPED_PREVIEWS_ALREADY_INSTALLED' /tmp/repeat.log
          psql -X -v ON_ERROR_STOP=1 -Atc "SELECT CASE WHEN
            NOT has_function_privilege('authenticated',
            'private.taxonomy_existing_ai_scoped_preview_v1(text,text,text,text[])','EXECUTE')
            AND NOT has_function_privilege('anon',
            'private.taxonomy_worker_scoped_capability_preview_v1(text,text)','EXECUTE')
            AND (SELECT auto_registration_enabled FROM private.work_taxonomy_control WHERE singleton)=false
            THEN 'AI_WORKER_SCOPED_BRIDGE_PASS' ELSE 'FAIL' END" | grep '^AI_WORKER_SCOPED_BRIDGE_PASS$'
