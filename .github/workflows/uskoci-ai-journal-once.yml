name: USKOCI verified shared AI turn journal

on:
  push:
    branches: [work/r11-ai-journal-dedup-20261104]
    paths: [.github/workflows/uskoci-ai-journal-once.yml]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/r11-ai-journal-dedup-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      BASE_SHA: d3fba6e5a52508469daa54f0f5da05f6a8307e5c
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Guard exact R04/R11 scope and preserve storage key ownership
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/r11-ai-journal-dedup-20261104
          test -z "$(git status --porcelain)"
          mkdir -p /tmp/uskoci-ai-journal
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,os
          actual=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA'],'HEAD'],text=True).splitlines())
          expected={'.github/workflows/uskoci-ai-journal-once.yml',
            'src/features/ai/intake/turnIntentJournal.ts',
            'src/data/aiTurnIntentJournal.ts','src/data/workerAiTurnIntentJournal.ts',
            'src/data/__tests__/ai-turn-intent-journal.test.ts'}
          if actual!=expected:raise SystemExit('UNAPPROVED_SOURCE_CHANGED '+repr(sorted(actual^expected)))
          shared=Path('src/features/ai/intake/turnIntentJournal.ts').read_text()
          if 'uskoci.ai.turn.intent.v1.' not in shared or 'uskoci.worker.ai.turn.intent.v1.' not in shared:raise SystemExit('STORAGE_KEYS_CHANGED')
          for code in ('AI_LOCAL_INTENT_INVALID','AI_UNRESOLVED_INTENT',
              'WORKER_AI_LOCAL_INTENT_INVALID','WORKER_AI_UNRESOLVED_INTENT'):
              if code not in shared:raise SystemExit('EXISTING_RECOVERY_ERROR_CHANGED '+code)
          for p in ('src/data/aiTurnIntentJournal.ts','src/data/workerAiTurnIntentJournal.ts'):
              s=Path(p).read_text()
              if len(s)>800 or 'AsyncStorage' in s:raise SystemExit('DUPLICATE_LOGIC_REMAINS '+p)
          PY
      - name: Locked dependencies, TypeScript, focused NEED and WORKER journal tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci > /tmp/uskoci-ai-journal/npm-ci.log 2>&1
          ./node_modules/.bin/tsc --noEmit > /tmp/uskoci-ai-journal/typescript.log 2>&1
          npm test -- --runInBand --silent --runTestsByPath \
            src/data/__tests__/ai-turn-intent-journal.test.ts \
            src/data/__tests__/worker-ai-turn-intent-journal.test.ts \
            > /tmp/uskoci-ai-journal/journal-focused.log 2>&1
      - name: Full mobile regression plus existing AI/unknown-outcome guards
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --maxWorkers=2 --silent --json \
            --outputFile /tmp/uskoci-ai-journal/jest.json \
            > /tmp/uskoci-ai-journal/jest-full.log 2>&1
          node --test --test-reporter=spec \
            supabase/proofs/ai/worker_mode_short_replies.test.mjs \
            supabase/proofs/ai/worker_mode_declarations.test.mjs \
            supabase/proofs/ai/single_pass_edge.test.mjs \
            > /tmp/uskoci-ai-journal/server-ai.log 2>&1
          node - <<'JS'
          const fs=require('node:fs');
          const j=JSON.parse(fs.readFileSync('/tmp/uskoci-ai-journal/jest.json','utf8'));
          if(!j.success||j.numFailedTests||j.numFailedTestSuites)throw Error('MOBILE_TESTS_FAILED');
          for(const name of ['ai-turn-intent-journal.test.ts','worker-ai-turn-intent-journal.test.ts'])
            if(!j.testResults.some(x=>x.name.endsWith('/src/data/__tests__/'+name)&&x.status==='passed'))
              throw Error('JOURNAL_TEST_MISSING '+name);
          console.log(JSON.stringify({suites:j.numTotalTestSuites,passed:j.numPassedTests,total:j.numTotalTests}));
          JS
      - name: Android preview Metro and Hermes export
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS' > /tmp/uskoci-ai-journal/android-export.log 2>&1
          const {spawnSync}=require('node:child_process');
          const env={...process.env,...require('./eas.json').build.preview.env,
            EAS_BUILD_PROFILE:'preview',USKOCI_OTA_TARGET:'preview',
            EXPO_NO_TELEMETRY:'1',EXPO_OFFLINE:'1'};
          const r=spawnSync(process.execPath,['node_modules/expo/bin/cli','export',
            '--platform','android','--output-dir','/tmp/uskoci-ai-journal/android-export'],
            {env,stdio:'inherit'});
          if(r.error)throw r.error;process.exit(r.status??1);
          JS
      - name: Add evidence in existing executive master; publish isolated PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/uskoci-ai-journal-once.yml
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          j=json.loads(Path('/tmp/uskoci-ai-journal/jest.json').read_text())
          receipt={
            'date':'2026-11-04','sourceCommit':os.environ['BASE_SHA'],
            'workflowSource':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],
            'scope':'R04/R11 shared local AI unknown-outcome journal implementation',
            'functionality':{
              'oneSharedImplementationForTwoIndependentJournals':True,
              'needStorageKey':'uskoci.ai.turn.intent.v1.',
              'workerStorageKey':'uskoci.worker.ai.turn.intent.v1.',
              'differentErrorCodesPreserved':True,
              'separatePerAccountQueues':True,
              'doesNotEraseUnresolvedIntents':True,
              'backendOrProtocolChanged':False,
              'noNewAIModelCall':True
            },
            'verification':{
              'lockedInstall':True,'TypeScript':True,'fullMobileSuites':j['numTotalTestSuites'],
              'fullMobileTests':j['numTotalTests'],'mobilePassed':j['numPassedTests'],
              'mobileFailed':j['numFailedTests'],'newCrossModeTests':2,
              'serverAIRuntimeSourceUnchanged':True,'androidHermesExport':True
            },
            'limitations':['No DEV Edge deploy','No real Gemini acceptance or physical Android test',
                           'R01/R10 and end-to-end collaboration still open']
          }
          file=Path('docs/continuation/R04_AI_DNEVNIK_DEDUP_20261104.json')
          file.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          master=Path('docs/plan/CODEX_PLAN_RADA.md')
          source=master.read_text(encoding='utf-8')
          header='# USKOČI — jedinstveni plan dovršavanja proizvoda i objavljivanja\n'
          if not source.startswith(header):raise SystemExit('CODEX_MASTER_HEADER_CHANGED')
          note=(
            '\n> **R04/R11, 04.11.2026 — objedinjena lokalna zastita nepoznatog AI ishoda:**'
            ' Need i Worker vise nemaju dva kopirana dnevnika u src/data/.'
            ' Jedna implementacija je src/features/ai/intake/turnIntentJournal.ts;'
            ' dva kratka, kompatibilna klijentska ulaza zadrzavaju razlicite storage'
            ' kljuceve, error kodove i odvojene serijske redove. Potvrdu daju'
            ' postojeci i novi negativni testovi i ceo mobilni CI, ne realan Gemini poziv.'
            ' [Receipt](../continuation/R04_AI_DNEVNIK_DEDUP_20261104.json).'
            ' Nema promene servera, AI prompta, Save/Publish ili naloga.\n')
          master.write_text(source.replace(header,header+note,1),encoding='utf-8')
          PY
          git add -- docs/plan/CODEX_PLAN_RADA.md \
            docs/continuation/R04_AI_DNEVNIK_DEDUP_20261104.json
          git diff --cached --check
          python3 - <<'PY'
          import os,subprocess
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only',os.environ['BASE_SHA']],text=True).splitlines())
          expected={'src/features/ai/intake/turnIntentJournal.ts',
            'src/data/aiTurnIntentJournal.ts','src/data/workerAiTurnIntentJournal.ts',
            'src/data/__tests__/ai-turn-intent-journal.test.ts',
            'docs/plan/CODEX_PLAN_RADA.md','docs/continuation/R04_AI_DNEVNIK_DEDUP_20261104.json'}
          if actual!=expected:raise SystemExit('UNEXPECTED_FINAL_SCOPE '+str(actual^expected))
          PY
          test "$(git ls-remote origin refs/heads/work/r11-ai-journal-dedup-20261104 | cut -f1)" = "$GITHUB_SHA"
          git config user.name "USKOCI verified AI cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(r04): deduplicate Need and Worker turn journal, preserve recovery guards"
          token=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $token" push origin HEAD:refs/heads/work/r11-ai-journal-dedup-20261104
          git rev-parse HEAD > /tmp/uskoci-ai-journal/published-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uskoci-ai-journal-verification
          path: |
            /tmp/uskoci-ai-journal/*.log
            /tmp/uskoci-ai-journal/*.json
            /tmp/uskoci-ai-journal/*.txt
          retention-days: 14
          if-no-files-found: warn
