name: Gemini provider stream safety

on:
  push:
    branches:
      - work/uskoci-ui-unification-20260924
      - fix/gemini-v70-source-sync-20261012
    paths:
      - 'supabase/functions/_shared/geminiTaskStream.ts'
      - 'src/data/__tests__/gemini-http-stream-regression.test.ts'
      - 'src/data/__tests__/gemini-v70-safety-stream.test.ts'
      - '.github/workflows/gemini-stream-safety.yml'
  pull_request:
    paths:
      - 'supabase/functions/_shared/geminiTaskStream.ts'
      - 'src/data/__tests__/gemini-http-stream-regression.test.ts'
      - 'src/data/__tests__/gemini-v70-safety-stream.test.ts'
      - '.github/workflows/gemini-stream-safety.yml'

permissions:
  contents: read

concurrency:
  group: gemini-stream-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stream-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Provider HTTP / safety / stream regression (no live calls)
        run: npx jest src/data/__tests__/gemini-http-stream-regression.test.ts src/data/__tests__/gemini-v70-safety-stream.test.ts --runInBand
      - name: TypeScript contracts
        run: npx tsc --noEmit
