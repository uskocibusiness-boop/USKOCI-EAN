name: Gemini taxonomy scoped shadow inputs pure test
on:
  push:
    branches: [fix/match-ai-category-fallback-20261010]
    paths:
      - '.github/workflows/gemini-taxonomy-shadow-proof.yml'
      - 'supabase/functions/_shared/taxonomyScopedShadow.mjs'
      - 'supabase/proofs/dynamic_taxonomy/taxonomy-scoped-shadow.test.mjs'
      - 'supabase/functions/uskoci-ai-interview/index.ts'
  pull_request:
    paths:
      - '.github/workflows/gemini-taxonomy-shadow-proof.yml'
      - 'supabase/functions/_shared/taxonomyScopedShadow.mjs'
      - 'supabase/proofs/dynamic_taxonomy/taxonomy-scoped-shadow.test.mjs'
      - 'supabase/functions/uskoci-ai-interview/index.ts'
permissions:
  contents: read
jobs:
  shadow-pure-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run pure bridge and source-boundary tests
        run: |
          node --version
          node --test supabase/proofs/dynamic_taxonomy/taxonomy-scoped-shadow.test.mjs
          node --test supabase/proofs/dynamic_taxonomy/interview-existing-ai-source.test.mjs
          echo 'SCOPED_GEMINI_SHADOW_PURE_PASS'
