name: N10 notification push-copy proof

on:
  push:
    branches:
      - work/uskoci-ui-unification-20260924
      - feature/unified-qa-master-20261017
    paths:
      - 'supabase/functions/uskoci-push-transport/index.ts'
      - 'supabase/functions/_shared/pushNotificationCopy.mjs'
      - 'supabase/proofs/notifications/n09_push_transport_edge.test.mjs'
      - 'supabase/proofs/notifications/n09_push_transport_runtime.mjs'
      - 'supabase/proofs/notifications/push-live-begin-contract.test.mjs'
      - 'supabase/proofs/notifications/n10_push_copy.test.mjs'
      - 'docs/implementation/product-v1-closure-20260926/NOTIFICATION_MATRIX.md'
      - '.github/workflows/notifications-n10-push-copy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Exact copy contract
        run: |
          node --check supabase/functions/_shared/pushNotificationCopy.mjs
          node --test supabase/proofs/notifications/n10_push_copy.test.mjs
      - name: Existing push transport regressions
        run: node --test supabase/proofs/notifications/n09_push_transport_edge.test.mjs supabase/proofs/notifications/push-live-begin-contract.test.mjs
