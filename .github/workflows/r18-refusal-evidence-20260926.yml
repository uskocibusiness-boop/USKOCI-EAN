name: Record R18 refusal evidence once
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r18-refusal-evidence-20260926
  cancel-in-progress: false
jobs:
  record:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      PROOF_RUN: '36240045849'
      PROOF_SOURCE: '348c2ec6ac0d3afe2e51e5a15e7620b023646ca5'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Test recorder without server or provider access
        run: node --test scripts/control/record-r18-refusal-20260926.test.mjs
      - name: Read the exact completed proof and its artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r18-refusal-evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN" > /tmp/r18-refusal-evidence/run.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const r = JSON.parse(readFileSync('/tmp/r18-refusal-evidence/run.json', 'utf8'));
          assert.equal(r.id, Number(process.env.PROOF_RUN));
          assert.equal(r.head_sha, process.env.PROOF_SOURCE);
          assert.equal(r.head_branch, 'work/uskoci-ui-unification-20260924');
          assert.equal(r.run_attempt, 1);
          assert.equal(r.status, 'completed');
          assert.equal(r.conclusion, 'success');
          NODE
          gh run download "$PROOF_RUN" --repo "$GITHUB_REPOSITORY" --name "pkg006-proof-$PROOF_RUN-1" --dir /tmp/r18-refusal-evidence
      - name: Record single-row evidence and regenerate existing control table
        run: |
          node scripts/control/record-r18-refusal-20260926.mjs /tmp/r18-refusal-evidence
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const base = 'docs/implementation/release-hardening-20260926/';
          const correctionPath = base + 'PUSH_ROLE_RECHECK.json';
          const correction = JSON.parse(readFileSync(correctionPath, 'utf8'));
          const fact = correction.result[0];
          assert.equal(correction.mode, 'READ_ONLY');
          assert.equal(correction.liveMutations, false);
          assert.equal(fact.recipient_role, 'REQUESTER');
          assert.equal(fact.has_matching_role_preferences, false);
          assert.equal(fact.matching_role_push_enabled, false);
          assert.equal(fact.pending_deliveries, 10);
          assert.equal(fact.with_active_device, 0);
          const rowsPath = 'docs/control/redovi.json';
          const rows = JSON.parse(readFileSync(rowsPath, 'utf8'));
          const p04 = rows.redovi.find(row => row.id === 'P04');
          const b10 = rows.blokade.find(row => row.id === 'B10');
          assert.ok(p04 && b10);
          p04.problem = '26.09 11:55 UTC: svih 10 čekajućih PUSH poruka cilja REQUESTER, bez preference reda za tu ulogu i bez aktivnog uređaja. Prethodni account-wide push_enabled=true nije dokaz saglasnosti za REQUESTER. Efektivno isključen transport ostaje zaključak iz koda/efekata, ne direktno pročitana env vrednost. Stvarna dostava nije dokazana.';
          p04.sledece = 'Pratiti CODEX_HANDOFF.md i PUSH_ROLE_RECHECK.json. Najpre read-only dokazati tačan task/profile/event/recipient-role put. Za stvarnu probu pripremiti dokazivo ograničenje account/device/event i max jedan send, bez globalnog prozora i čišćenja tuđeg reda. Svaka primena, registracija i realan test čekaju posebno primeni. Dokumenti: ' + base;
          b10.sada = 'OTVORENO, ispravljen nalaz 26.09: 10 REQUESTER delivery redova nema odgovarajuću saglasnost po ulozi; 0 aktivnih uređaja. Nema dokaza isporuke. Flag transporta nije direktno očitan. Stari globalni tick/prozor nije bezbedan scenario jednog push-a; povučen u novoj predaji.';
          b10.dokaz = correctionPath;
          writeFileSync(rowsPath, JSON.stringify(rows, null, 2) + '\n');
          const preflightPath = base + 'PREFLIGHT.json';
          const preflight = JSON.parse(readFileSync(preflightPath, 'utf8'));
          preflight.pushInterpretationCorrection = { checkedAt: correction.checkedAt, source: correctionPath,
            supersededFields: ['push.requesterPushEnabled', 'push.transportEffectiveState'],
            matchingRequesterRolePushEnabled: false, transportFlag: 'NOT_DIRECTLY_VERIFIED',
            oldGlobalWindowPlan: 'WITHDRAWN_DO_NOT_EXECUTE' };
          writeFileSync(preflightPath, JSON.stringify(preflight, null, 2) + '\n');
          const mediaPath = base + 'MEDIA_PUSH_PREFLIGHT.md';
          const media = readFileSync(mediaPath, 'utf8');
          const nl = media.indexOf('\n');
          writeFileSync(mediaPath, media.slice(0, nl + 1) + '\n> ISPRAVKA 26.09 11:55 UTC: push tvrdnja o saglasnosti ispod bila je account-wide, ne za odgovarajuću ulogu. Svih 10 REQUESTER poruka nema matching-role preference red. Kill-switch nije neposredno očitan. Prethodni globalni backlog/tick/prozor za test je POVUČEN; ne izvršavati ga. Merodavni su PUSH_ROLE_RECHECK.json i ažurirani CODEX_HANDOFF.md. Ostatak je istorijski zapis tog preflight-a.\n' + media.slice(nl + 1));
          const nextPath = 'docs/implementation/design-system/r19-task-agreement-20260925/NEXT.md';
          let next = readFileSync(nextPath, 'utf8');
          const start = next.indexOf('## Release-hardening preflight');
          const end = next.indexOf('## First: improve deep-return speed', start);
          assert.ok(start >= 0 && end > start);
          next = next.slice(0, start) + '## Release-hardening preflight — corrected 26 September 2026\n\nRead the current CODEX_HANDOFF.md and PUSH_ROLE_RECHECK.json under docs/implementation/release-hardening-20260926/. Media safe-code drift was identified historically; application still requires explicit primeni and fresh file comparison.\n\nThe 11:55 UTC role-correct DEV join found 10 REQUESTER deliveries without a matching role preference and without an active device. Account-wide push preference was not consent for this role. The transport kill-switch remains an inference, not a directly read env value.\n\nDo not execute the old global zero-device backlog tick or short enable window. Prepare enforceable one-account/device/event admission and a hard dispatch limit in isolation; no real registration, event, server/config change or send without named approval. The existing client/refusal proof does not close push or store acceptance.\n\n' + next.slice(end);
          writeFileSync(nextPath, next);
          const reportPath = base + 'E01_E02_RECOVERY.md';
          writeFileSync(reportPath, readFileSync(reportPath, 'utf8').replace('ažuriran samo relevantan B09', 'ažurirani B09 i ispravka push nalaza P04/B10'));
          NODE
          node scripts/control/osvezi.mjs
      - name: Commit only evidence and the existing tracker without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- docs/control/redovi.json docs/control/stanje.json \
            docs/implementation/design-system/r19-task-agreement-20260925/NEXT.md \
            docs/implementation/release-hardening-20260926/E01_E02_RECOVERY.md \
            docs/implementation/release-hardening-20260926/E01_E02_CHECKS.json \
            docs/implementation/release-hardening-20260926/PREFLIGHT.json \
            docs/implementation/release-hardening-20260926/MEDIA_PUSH_PREFLIGHT.md
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const allowed = new Set(['docs/control/redovi.json', 'docs/control/stanje.json',
            'docs/implementation/design-system/r19-task-agreement-20260925/NEXT.md',
            'docs/implementation/release-hardening-20260926/E01_E02_RECOVERY.md',
            'docs/implementation/release-hardening-20260926/E01_E02_CHECKS.json',
            'docs/implementation/release-hardening-20260926/PREFLIGHT.json',
            'docs/implementation/release-hardening-20260926/MEDIA_PUSH_PREFLIGHT.md']);
          const files = execFileSync('git', ['diff', '--cached', '--name-only'], { encoding: 'utf8' }).trim().split('\n');
          assert.equal(files.length, allowed.size);
          assert.ok(files.every(file => allowed.has(file)), 'Unexpected staged path');
          NODE
          remote_head=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA" || { echo 'Branch moved; keep artifacts and reconcile, never force-push.'; exit 1; }
          git config user.name 'USKOCI evidence bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record verified R18 refusal recovery and regenerate the control table'
          git push origin "HEAD:$GITHUB_REF"
      - name: Retain the actual generated table, not a claim of external publication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r18-refusal-control-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            docs/control/redovi.json
            docs/control/stanje.json
            docs/control/out/tabla.html
            docs/implementation/release-hardening-20260926/E01_E02_RECOVERY.md
            docs/implementation/release-hardening-20260926/E01_E02_CHECKS.json
            docs/implementation/release-hardening-20260926/PUSH_ROLE_RECHECK.json
            docs/implementation/release-hardening-20260926/CODEX_HANDOFF.md
