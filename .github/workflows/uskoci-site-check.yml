name: USKOCI site legal/static QA
on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/uskoci-site-check.yml'
  push:
    branches:
      - 'site/**'
    paths:
      - 'website/**'
      - '.github/workflows/uskoci-site-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify legal pages and internal routes
        run: node website/check-site.cjs
