name: Worker execution mode mobile and TS proof
on:
  push:
    branches: [fix/match-ai-category-fallback-20261010]
    paths:
      - '.github/workflows/worker-mode-mobile-proof.yml'
      - 'src/app/(app)/profil/nacin-rada.tsx'
      - 'src/data/workerExecutionModeClientService.ts'
      - 'src/data/__tests__/worker-execution-mode-client.test.ts'
      - 'src/ui/workerProfile/WorkerProfilePresentation.tsx'
  pull_request:
    paths:
      - '.github/workflows/worker-mode-mobile-proof.yml'
      - 'src/app/(app)/profil/nacin-rada.tsx'
      - 'src/data/workerExecutionModeClientService.ts'
      - 'src/data/__tests__/worker-execution-mode-client.test.ts'
      - 'src/ui/workerProfile/WorkerProfilePresentation.tsx'
permissions:
  contents: read
jobs:
  worker-mode-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies and apply native patches
        run: npm ci --no-audit --no-fund
      - name: Validate production TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Test owned worker mode settings & no optimistic success
        run: npm test -- --runInBand --runTestsByPath src/data/__tests__/worker-execution-mode-client.test.ts
