name: P6 30000 load v3 hosted-like (jit off)

# Harness-fidelity supplement to the P6-02 drift confirmation (p6-round71-load-v3.yml). The 30k harness runs on the Supabase CLI's local Postgres with jit = on; canonical DEV (hosted, Postgres 17.6)
# runs jit = off (read-only `show jit`, 2026-09-30). Three RPC cases sit at a constant p50 of about 940 ms in every 30k run so far, which is what a per-execution JIT compilation would look like.
# This measures the DEPLOYED rollout v3 (lineage table shaped like canonical DEV) with the SAME unchanged harness and jit = off (PGOPTIONS), once. It is a measurement of how much of the CI number is the
# harness's own setting; it is not a new gate and it does not replace or re-open the 30k screening.
on:
  workflow_dispatch:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/p6-round72-load-v3-jit-off.yml'
permissions:
  contents: read
concurrency:
  group: p6-round72-load-v3-jit-off-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prove:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/p6-discovery-private
      P6_PUBLIC_ARTIFACT_DIR: /tmp/p6-discovery-evidence
      P6_HISTORICAL_PKG045_REPLAY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Exact source and locked dependencies
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$P6_PUBLIC_ARTIFACT_DIR" /tmp/p6-load-v3-evidence /tmp/p6-load-v3-private
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/dependencies.log" 2>&1
          python3 supabase/migrations/check_migration_integrity.py > "$PRE_V3_ARTIFACT_DIR/integrity.log" 2>&1
          python3 -m py_compile supabase/proofs/discovery/p6_load_30k_v3.py supabase/proofs/discovery/p6_load_30k.py
      - name: Reconstruct disposable historical live79
        run: |
          set -euo pipefail
          umask 077
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/live79.log" 2>&1
      - name: Guard loopback and replay historical predecessor through PKG045b (P0 form)
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL,process.env.RU5_DEVICE_DB_URL);
          if(process.env.DB_URL!==process.env.RU5_DEVICE_DB_URL) throw Error('P6_LOCAL_TARGET_ADMISSION');
          NODE
          run_stage() { local label="$1"; shift; "$@" > "$PRE_V3_ARTIFACT_DIR/$label.log" 2>&1; }
          run_stage source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage pkg027 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage pkg028 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage pkg029 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage pkg030 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage pkg031 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage pkg032 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage pkg033 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage pkg034 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage pkg035 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage pkg037 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage pkg038 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage pkg039 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage pkg040 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage pkg042 node supabase/proofs/pkg042/pkg042_proof.mjs replay
          run_stage p0aware045 node supabase/proofs/discovery/p6_discovery_prepare_p0.mjs
      - name: Shape the lineage table like canonical DEV, apply the DEPLOYED rollout v3 and run the 720-sample 30k screening with jit off
        env:
          PGOPTIONS: -c jit=off
        run: |
          set -euo pipefail
          umask 077
          python3 -B supabase/proofs/discovery/p6_load_30k_v3.py seed-lineage
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f supabase/candidates/p6_discovery_rollout_v3.sql > "$PRE_V3_ARTIFACT_DIR/apply-v3.log" 2>&1
          psql "$DB_URL" -X -qAt -c "show jit" | tee /tmp/p6-load-v3-evidence/jit-setting.txt
          python3 -B supabase/proofs/discovery/p6_load_30k_v3.py measure B
      - name: Destroy disposable stack without backup
        if: always()
        run: |
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then cd /tmp/uskoci-ru5-device-ui; supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || true; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p6-load-v3-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/p6-load-v3-evidence/
          if-no-files-found: error
          retention-days: 30
