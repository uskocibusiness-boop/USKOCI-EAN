# Current DEV client rollout. The historical filename retains the existing workflow identity.
# Publish only after the exact-source APK regression succeeds; no source push publishes an OTA.
name: DEV Android preview OTA
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character source SHA on feature/unified-qa-master-20261017'
        required: true
        type: string
      regression_run_id:
        description: 'Successful Build latest V5 Android preview APK run for the same source SHA'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: uskoci-preview-ota-current
  cancel-in-progress: false
jobs:
  publish-android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD_PROFILE: preview
      USKOCI_OTA_TARGET: preview
      OTA_EXPECTED_SOURCE: ${{ inputs.source_sha }}
      OTA_REGRESSION_RUN_ID: ${{ inputs.regression_run_id }}
      OTA_NATIVE_BASELINE: f56c94c35c8eb0f2f28a6961fb4bf358228c241c
      EXPO_PUBLIC_SUPABASE_URL: https://leqcwgzvjsxugfgzdmth.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_o_I-YOn57oPCrIboF0OjPQ_c3DHmOZW
      EXPO_PUBLIC_USE_FAKE_SOURCE: '0'
      EXPO_PUBLIC_AUTH_RECOVERY_REDIRECT_URL: uskociapp://oporavak
      EXPO_PUBLIC_P6_DISCOVERY_READER: '1'
      EXPO_PUBLIC_EX04_OWN_TASKS_PAGED: '1'
      EXPO_PUBLIC_EX04_OWN_APPLICATIONS_PAGED: '1'
      EXPO_PUBLIC_EX04_CANDIDATES_PAGED: '1'
      EXPO_PUBLIC_VOICE_MESSAGES: '1'
      EXPO_PUBLIC_AI_LOCATION_DIALOGUE: '1'
      EXPO_PUBLIC_CONVERSATION_INBOX: '1'
      # Only this DEV preview client opts into existing versioned, signed review RPCs.
      EXPO_PUBLIC_USKOCI_NEED_SIGNED_REVIEW: 'true'
      EXPO_PUBLIC_USKOCI_WORKER_SIGNED_REVIEW: 'true'
      # DEV preview: signed per-service execution and handoff consent.
      EXPO_PUBLIC_USKOCI_WORKER_CONFIRMED_MODES: 'true'
    steps:
      - name: Checkout exact owner-requested feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require successful regression for this exact source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ota-regression-evidence.cjs
      - name: Verify Expo access and immutable preview runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo "::error::EXPO_TOKEN is missing. Update NOT published."; exit 1; }
          test "$(git rev-parse HEAD)" = "$OTA_EXPECTED_SOURCE"
          test -z "$(git status --porcelain --untracked-files=normal)"
          git merge-base --is-ancestor "$OTA_NATIVE_BASELINE" HEAD
          node scripts/ota-release-preflight.cjs --target preview --baseline "$OTA_NATIVE_BASELINE"
          node - <<'NODE'
          const cfg = require('./app.config.js')({config: require('./app.json').expo});
          if (cfg.android.package !== 'rs.uskoci.preview' ||
              cfg.runtimeVersion !== 'uskoci-v1-preview-r1' ||
              cfg.updates.requestHeaders['expo-channel-name'] !== 'preview' ||
              cfg.extra?.eas?.projectId !== '1e6cc490-9851-4741-9226-128612122db6') {
             throw new Error('OWNER_PREVIEW_IDENTITY_MISMATCH: nothing published');
          }
          console.log('PREVIEW ONLY: verified rs.uskoci.preview / preview / uskoci-v1-preview-r1');
          NODE
      - name: Install locked JS dependencies
        run: npm ci --include=dev
      - name: Verify rollout evidence and environment guards
        # Full client and handler regression already ran on the identical SHA above.
        run: node --test scripts/__tests__/ota-regression-evidence.test.cjs scripts/__tests__/ota-release-preflight.test.cjs scripts/__tests__/build-contract.test.cjs scripts/__tests__/ota-publication-readback.test.cjs
      - name: Verify the actual EAS preview bundler environment
        shell: bash
        run: |
          set -euo pipefail
          # EAS Update SDK55+ uses server environment values, not eas.json build env.
          # Keep the downloaded environment outside source/artifacts and never print it.
          npx --yes eas-cli@23.2.0 env:pull --environment preview \
            --path "$RUNNER_TEMP/uskoci-preview.env" --non-interactive
          node - <<'NODE'
          const fs=require('node:fs'), path=require('node:path'), {parseEnv}=require('node:util');
          const p=require('./scripts/ota-release-preflight.cjs');
          const env=parseEnv(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'uskoci-preview.env'),'utf8'));
          // USKOCI_OTA_TARGET is supplied by this workflow, not bundled into application JS.
          p.verifyBundleEnvironment(p.sourcePlan(process.cwd(),'preview'),{...env,USKOCI_OTA_TARGET:'preview'});
          console.log('All required EAS preview public values match the checked client contract.');
          NODE
      - name: Verify preview has explicit DEV-only signed review feature gates
        shell: bash
        run: |
          set -euo pipefail
          test "${EXPO_PUBLIC_USKOCI_NEED_SIGNED_REVIEW}" = 'true'
          node scripts/build-contract.cjs
          test "${EXPO_PUBLIC_USKOCI_WORKER_SIGNED_REVIEW}" = 'true'
          test "${EXPO_PUBLIC_USKOCI_WORKER_CONFIRMED_MODES}" = 'true'
          test "${EXPO_PUBLIC_SUPABASE_URL}" = 'https://leqcwgzvjsxugfgzdmth.supabase.co'
      - name: Publish checked source to Android preview ONLY
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=normal)"
          msg="DEV Android preview ${GITHUB_SHA} run ${GITHUB_RUN_ID}"
          npx --yes eas-cli@23.2.0 update --branch preview --platform android \
            --environment preview --clear-cache --message "$msg" --non-interactive
      - name: Read back published preview update
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@23.2.0 update:list --branch preview --platform android \
            --runtime-version uskoci-v1-preview-r1 --limit 3 --json --non-interactive > "$RUNNER_TEMP/uskoci-ota-list.json"
          group="$(node - <<'NODE'
          const fs=require('node:fs'), path=require('node:path');
          const p=require('./scripts/ota-publication-readback.cjs');
          const list=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'uskoci-ota-list.json'),'utf8'));
          console.log(p.selectPublicationGroup(list,p.expectedPublication(process.env.GITHUB_SHA,process.env.GITHUB_RUN_ID)));
          NODE
          )"
          # The list message is decorated for display. Only the raw group view
          # can attest source SHA and exact run message; never publish again here.
          npx --yes eas-cli@23.2.0 update:view "$group" --json > "$RUNNER_TEMP/uskoci-ota-group.json"
          export OTA_READBACK_GROUP="$group"
          node - <<'NODE'
          const fs=require('node:fs'), path=require('node:path');
          const p=require('./scripts/ota-publication-readback.cjs');
          const view=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'uskoci-ota-group.json'),'utf8'));
          const exact=p.verifyPublicationView(view,process.env.OTA_READBACK_GROUP,
            p.expectedPublication(process.env.GITHUB_SHA,process.env.GITHUB_RUN_ID));
          console.log('PUBLISHED Android preview OTA:',exact.group,'commit:',exact.sourceSha,
            'runtime:',exact.runtime,'branch:',exact.branch);
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'uskoci-ota-receipt.json'),JSON.stringify({
            ...exact,
            regressionRunId:process.env.OTA_REGRESSION_RUN_ID,nativeBaseline:process.env.OTA_NATIVE_BASELINE,
            installedDeviceVerified:false},null,2));
          NODE
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: USKOCI-DEV-OTA-RECEIPT
          path: |
            ${{ runner.temp }}/uskoci-ota-regression.json
            ${{ runner.temp }}/uskoci-ota-receipt.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary EAS environment
        if: always()
        run: rm -f "$RUNNER_TEMP/uskoci-preview.env" "$RUNNER_TEMP/uskoci-ota-list.json" "$RUNNER_TEMP/uskoci-ota-group.json"
