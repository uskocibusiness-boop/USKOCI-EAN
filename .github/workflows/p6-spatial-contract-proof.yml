name: P6 spatial wire quarantine
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/p6-spatial-contract-proof.yml'
      - 'src/data/discoveryV1SpatialContract.ts'
      - 'src/data/__tests__/discovery-v1-spatial-contract.test.ts'
      - 'docs/implementation/product-v1-closure-20260926/finalization-20260927/P6_MAP_PLACES_WIRE_20260928.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bind tracked source for reproducible offline inspection
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          root = pathlib.Path.cwd()
          out = pathlib.Path('/tmp/p6-source-inspection')
          out.mkdir(mode=0o700)
          sha = os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == sha
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          names = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', '-z', sha]).decode().split('\0')
          roots = ('src/', 'supabase/', 'docs/', 'scripts/', '.github/workflows/')
          suffixes = {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs', '.sql', '.md', '.json', '.yml', '.yaml', '.py', '.sh', '.toml'}
          files = [name for name in names if name and pathlib.PurePosixPath(name).suffix in suffixes
                   and (name.startswith(roots) or '/' not in name)]
          # This packet contains tracked repository source only. No .git,
          # installed dependencies, environment files, live data or runtime logs.
          assert files and all(not (root / name).is_symlink() for name in files)
          assert sum((root / name).stat().st_size for name in files) < 150 * 1024 * 1024
          manifest = {'sourceSha': sha, 'treeSha': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                      'allTrackedPaths': [name for name in names if name], 'files': {}}
          archive = out / 'tracked-source.tar.gz'
          with tarfile.open(archive, 'w:gz') as tar:
              for name in files:
                  manifest['files'][name] = hashlib.sha256((root / name).read_bytes()).hexdigest()
                  tar.add(root / name, arcname=name, recursive=False)
          manifest['archiveSha256'] = hashlib.sha256(archive.read_bytes()).hexdigest()
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          print('SOURCE_PACKET_BOUND', sha, 'files=' + str(len(files)))
          PY
      - name: Retain source binding without publishing a new hosted dashboard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-source-inspection-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/p6-source-inspection/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json
      - name: Spatial wire contract
        run: npx jest --runInBand --testTimeout=30000 --runTestsByPath src/data/__tests__/discovery-v1-spatial-contract.test.ts
      - name: Keep partial P6 out of production
        run: |
          if grep -R --line-number --fixed-strings "rpc_discovery_v1" src/app src/data/supabaseIzvor.ts src/data/ports.ts; then
            echo "P6 remains quarantined until PAGE+MAP+PLACES runtime/performance proof is accepted"
            exit 1
          fi
