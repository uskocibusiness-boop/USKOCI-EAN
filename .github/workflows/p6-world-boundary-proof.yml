name: P6 world boundary proof

# Exercises the REAL/TEST world boundary of the DEPLOYED P6 rollout v3 end-to-end with real rows (master plan P6-03: equality/negative tests against the old
# rule, plans/BUFFERS in the relevant roles) and MEASURES the RLS helper rls_private.p6_discovery_test_world_accounts() at 5 / 10 000 / 100 000 lineage rows,
# on the same DISPOSABLE historical target as the rollout v3 proof (live79 reconstruction, historical replay through PKG045b in its P0 form). Accounts of every
# lineage kind and published/unpublished tasks per owner are seeded, the deployed p6_discovery_rollout_v3.sql is applied locally, and every viewer (TEST, REAL,
# REAL_USER, each owner) and anon reads through rpc_discovery_v1 PAGE/MAP/PLACES/EXACT_PUBLIC and the legacy reader rpc_list_open_tasks_v3. Timings never fail
# the job; functional assertions do. No canonical DEV access, no native claim, no SLA.
# NOT RUN AUTOMATICALLY (owner direction 2026-09-30: P6 closes on its existing evidence; extra proofs are not started for comfort). Prepared during the P6 closure as an
# extra proof for the production-readiness stage (QA debt QAD-04 in docs/implementation/product-v1-closure-20260926/finalization-20260927/P6_CLOSURE_RECEIPT.md). To run it,
# start this workflow by hand once the file is on the default branch, or restore the push trigger below for a run on the work branch:
#   push: { branches: [work/uskoci-ui-unification-20260924], paths: ['supabase/proofs/discovery/p6_world_boundary_proof.mjs', '.github/workflows/p6-world-boundary-proof.yml'] }
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p6-world-boundary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prove:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    # The bulk lineage seeding (100 000 auth.users rows through the profile trigger) and the measurements at 100 000 rows are the long part; the helper's
    # per-row classifier cost is exactly what is being measured, so the budget is deliberately generous rather than tuned.
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/p6-discovery-private
      P6_PUBLIC_ARTIFACT_DIR: /tmp/p6-discovery-evidence
      P6_HISTORICAL_PKG045_REPLAY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Exact source, locked dependencies and the deployed rollout's composition
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$P6_PUBLIC_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git rev-parse HEAD 'HEAD^{tree}' > "$P6_PUBLIC_ARTIFACT_DIR/source-binding.txt"
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/dependencies.log" 2>&1
          python3 supabase/migrations/check_migration_integrity.py > "$PRE_V3_ARTIFACT_DIR/integrity.log" 2>&1
          node --check supabase/proofs/discovery/p6_world_boundary_proof.mjs
          node scripts/proofs/build-p6-rollout-v3.mjs --check | tee "$P6_PUBLIC_ARTIFACT_DIR/composition-check.txt"
          sha256sum supabase/candidates/p6_discovery_rollout_v3.sql | tee "$P6_PUBLIC_ARTIFACT_DIR/rollout-v3-sha256.txt"
      - name: Reconstruct disposable historical live79
        run: |
          set -euo pipefail
          umask 077
          status=0
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/live79.log" 2>&1 || status=$?
          printf 'live79 exit=%s\n' "$status" | tee "$P6_PUBLIC_ARTIFACT_DIR/stages.txt"
          exit "$status"
      - name: Guard loopback and replay historical predecessor through PKG045b
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL,process.env.RU5_DEVICE_DB_URL);
          if(process.env.DB_URL!==process.env.RU5_DEVICE_DB_URL) throw Error('P6_LOCAL_TARGET_ADMISSION');
          NODE
          run_stage() {
            local label="$1" status=0
            shift
            "$@" > "$PRE_V3_ARTIFACT_DIR/$label.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$label" "$status" | tee -a "$P6_PUBLIC_ARTIFACT_DIR/stages.txt"
            return "$status"
          }
          run_stage source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage pkg027 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage pkg028 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage pkg029 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage pkg030 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage pkg031 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage pkg032 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage pkg033 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage pkg034 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage pkg035 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage pkg037 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage pkg038 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage pkg039 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage pkg040 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage pkg042 node supabase/proofs/pkg042/pkg042_proof.mjs replay
          run_stage p0aware045 node supabase/proofs/discovery/p6_discovery_prepare_p0.mjs
      - name: Apply the DEPLOYED rollout v3 locally, prove the world boundary through both readers, measure the helper
        run: |
          set -euo pipefail
          umask 077
          status=0
          node supabase/proofs/discovery/p6_world_boundary_proof.mjs > "$PRE_V3_ARTIFACT_DIR/world-boundary-proof.log" 2>&1 || status=$?
          printf 'world-boundary-proof exit=%s\n' "$status" | tee -a "$P6_PUBLIC_ARTIFACT_DIR/stages.txt"
          tail -12 "$PRE_V3_ARTIFACT_DIR/world-boundary-proof.log"
          exit "$status"
      - name: Destroy disposable stack without backup
        if: always()
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$P6_PUBLIC_ARTIFACT_DIR"
          status=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || status=$?
          fi
          printf 'teardown exit=%s\n' "$status" | tee -a "$P6_PUBLIC_ARTIFACT_DIR/stages.txt"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p6-world-boundary-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/p6-discovery-evidence/
          if-no-files-found: error
          retention-days: 30
