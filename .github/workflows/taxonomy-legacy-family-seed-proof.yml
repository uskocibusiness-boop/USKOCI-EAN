name: Taxonomy legacy 11 families no-authority migration proof
on:
  push:
    branches: [fix/match-ai-category-fallback-20261010]
    paths:
      - '.github/workflows/taxonomy-legacy-family-seed-proof.yml'
      - 'supabase/candidates/dynamic-taxonomy-20261011/dev-seed-legacy-families.sql'
  pull_request:
    paths:
      - '.github/workflows/taxonomy-legacy-family-seed-proof.yml'
      - 'supabase/candidates/dynamic-taxonomy-20261011/dev-seed-legacy-families.sql'
permissions:
  contents: read
jobs:
  legacy-families:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16','17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Prepare locked catalog and migrate exactly 11 historical parent identities
        run: |
          set -euo pipefail
          root=supabase/candidates/dynamic-taxonomy-20261011
          psql -X -v ON_ERROR_STOP=1 -f "$root/disposable-fixture.sql"
          psql -X -v ON_ERROR_STOP=1 -1 -f "$root/dev-dark-launch-locked.sql"
          psql -X -v ON_ERROR_STOP=1 -1 -f "$root/dev-seed-legacy-families.sql"
      - name: Check no authority, no workers, no task amendments, no duplicate upgrade
        run: |
          set -euo pipefail
          result=$(psql -X -v ON_ERROR_STOP=1 -Atc "
            SELECT CASE WHEN
              (SELECT count(*) FROM private.work_taxonomy_categories)=11
              AND (SELECT count(*) FROM private.work_taxonomy_legacy_kind_map)=11
              AND (SELECT count(*) FROM private.work_taxonomy_worker_capabilities)=0
              AND (SELECT count(*) FROM private.work_taxonomy_need_snapshots)=0
              AND (SELECT auto_registration_enabled FROM private.work_taxonomy_control WHERE singleton)=false
              AND (SELECT bool_and(authority='NONE' AND family_only) FROM private.work_taxonomy_legacy_kind_map)
              AND NOT has_table_privilege('service_role','private.work_taxonomy_legacy_kind_map','INSERT')
              THEN 'LEGACY_FAMILY_NO_AUTHORITY_PASS' ELSE 'FAIL' END")
          test "$result" = 'LEGACY_FAMILY_NO_AUTHORITY_PASS'
          if psql -X -v ON_ERROR_STOP=1 -1 -f supabase/candidates/dynamic-taxonomy-20261011/dev-seed-legacy-families.sql >/tmp/dupe.log 2>&1; then
            echo 'duplicate seed bypass'; exit 1
          fi
          grep -q 'TAXONOMY_FAMILY_SEED_REQUIRES_EMPTY_DISABLED_CATALOG' /tmp/dupe.log
          echo LEGACY_FAMILY_NO_AUTHORITY_PASS
