name: Scoped taxonomy service-only PostgREST RPC proof
on:
  pull_request:
    paths:
      - '.github/workflows/taxonomy-scoped-rpc-service-proof.yml'
      - 'supabase/candidates/dynamic-taxonomy-20261011/dev-service-only-scoped-ai-rpc.sql'
  push:
    branches: [fix/match-ai-category-fallback-20261010]
    paths:
      - '.github/workflows/taxonomy-scoped-rpc-service-proof.yml'
      - 'supabase/candidates/dynamic-taxonomy-20261011/dev-service-only-scoped-ai-rpc.sql'
permissions:
  contents: read
jobs:
  private-rpc-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: ['16','17']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Install exact current catalog and service-only RPC layers
        run: |
          set -euo pipefail
          d=supabase/candidates/dynamic-taxonomy-20261011
          psql -X -v ON_ERROR_STOP=1 -f "$d/disposable-fixture.sql"
          for file in dev-dark-launch-locked.sql dev-seed-legacy-families.sql dev-execution-scopes-two-root.sql dev-scoped-ai-worker-readonly-bridge.sql dev-service-only-scoped-ai-rpc.sql; do
            psql -X -v ON_ERROR_STOP=1 -1 -f "$d/$file"
          done
      - name: Prove service-only function grants, read-only and mode mapping
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -Atc "SELECT CASE WHEN
            has_function_privilege('service_role',
              'public.rpc_taxonomy_ai_scoped_preview_service(text,text,text,text[])','EXECUTE')
            AND has_function_privilege('service_role',
              'public.rpc_taxonomy_worker_scoped_preview_service(text,text)','EXECUTE')
            AND NOT has_function_privilege('authenticated',
              'public.rpc_taxonomy_ai_scoped_preview_service(text,text,text,text[])','EXECUTE')
            AND NOT has_function_privilege('anon',
              'public.rpc_taxonomy_worker_scoped_preview_service(text,text)','EXECUTE')
            AND NOT has_table_privilege('service_role','private.work_taxonomy_categories','INSERT')
            AND (SELECT count(*) FROM private.work_taxonomy_worker_capabilities)=0
            AND (SELECT auto_registration_enabled FROM private.work_taxonomy_control WHERE singleton)=false
            THEN 'SCOPED_SERVICE_RPC_ONLY_PASS' ELSE 'FAIL' END" | grep '^SCOPED_SERVICE_RPC_ONLY_PASS$'
          if psql -X -v ON_ERROR_STOP=1 -1 -f supabase/candidates/dynamic-taxonomy-20261011/dev-service-only-scoped-ai-rpc.sql >/tmp/repeat.log 2>&1; then
            echo 'DUPLICATE_RPC_INSTALL'; exit 1
          fi
          grep -q 'USKOCI_TAXONOMY_RPC_BRIDGE_ALREADY_EXISTS' /tmp/repeat.log
          echo 'SERVICE_ROLE_READ_ONLY_RPC_PASS'
