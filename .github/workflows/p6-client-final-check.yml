name: P6 client final check

# Types + the P6/Discovery client suites + the FULL Jest regression on the exact pushed source. Touch
# supabase/proofs/discovery/p6_client_final_check.txt (or this file) to run it. It changes nothing and reaches no backend.
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/p6-client-final-check.yml'
      - 'supabase/proofs/discovery/p6_client_final_check.txt'
permissions:
  contents: read
concurrency:
  group: p6-client-final-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Exact source and locked dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/p6-final
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git rev-parse HEAD 'HEAD^{tree}' > /tmp/p6-final/source-binding.txt
          npm ci
      - name: TypeScript
        run: |
          set -euo pipefail
          npx tsc --noEmit -p tsconfig.json 2>&1 | tee /tmp/p6-final/tsc.txt
      - name: Focused P6 and Discovery client suites
        run: |
          set -euo pipefail
          npx jest --runInBand --testTimeout=30000 --testPathPattern='(discovery|marketplace-view|published-task-discovery|retired-discovery|profile-gallery)' \
            --json --outputFile=/tmp/p6-final/focused.json
      - name: Full regression
        run: npx jest -w 3 --testTimeout=30000 --json --outputFile=/tmp/p6-final/full.json
      - name: Summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          out = {}
          for name in ('focused', 'full'):
              path = f'/tmp/p6-final/{name}.json'
              if os.path.exists(path):
                  d = json.load(open(path, encoding='utf-8'))
                  out[name] = {k: d.get(k) for k in ('numTotalTestSuites', 'numPassedTestSuites', 'numFailedTestSuites', 'numTotalTests', 'numPassedTests', 'numFailedTests', 'success')}
                  out[name]['failedSuites'] = [r['name'].split('USKOCI-CLEAN/')[-1] for r in d.get('testResults', []) if r.get('status') != 'passed'][:20]
          json.dump(out, open('/tmp/p6-final/summary.json', 'w', encoding='utf-8'), indent=1)
          print(json.dumps(out, indent=1))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p6-client-final-check-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/p6-final/
          if-no-files-found: error
          retention-days: 30
