name: Worker taxonomy safe-sync disposable proof
on:
  pull_request:
    paths:
      - 'supabase/candidates/dynamic-taxonomy-20261011/worker-no-implicit-admission-v1.sql'
      - 'supabase/candidates/dynamic-taxonomy-20261011/disposable-worker-safe-sync-*.sql'
      - '.github/workflows/taxonomy-worker-safe-sync-pg-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mapping-only-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Build fully disposable schema
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/catalog-foundation.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-worker-safe-sync-fixture.sql
      - name: Install reviewed-worker mapping-only replacement candidate
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/worker-no-implicit-admission-v1.sql
      - name: Prove unknown skills survive and old capabilities are revoked
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-worker-safe-sync-assert.sql
