name: Unified taxonomy legacy-contract regression
on:
  push:
    branches: [work/ai-taxonomy-final-contract-20261022]
    paths:
      - 'supabase/proofs/dynamic_taxonomy/worker-interview-question-policy.test.mjs'
      - 'supabase/proofs/dynamic_taxonomy/need-review-signed-source.test.mjs'
      - '.github/workflows/ai-taxonomy-final-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Exact source and locked install
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci
          git diff --check
      - name: Focused worker authority and signed Need taxonomy proofs
        run: node --test supabase/proofs/dynamic_taxonomy/worker-interview-question-policy.test.mjs supabase/proofs/dynamic_taxonomy/need-review-signed-source.test.mjs
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json
      - name: Full mobile regression
        run: npx jest --maxWorkers=3 --testTimeout=30000
