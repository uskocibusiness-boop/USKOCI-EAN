name: P5 owned client package
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uskoci-p5-owned-client-package
  cancel-in-progress: false
jobs:
  apply-and-prove:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install existing locked dependencies
        run: npm ci
      - name: Verify predecessor and prepare regression cases
        run: |
          mkdir -p outputs/p5
          node scripts/proofs/p5-client-package.cjs verify
          node scripts/proofs/p5-client-package.cjs tests
      - name: Prove the missing connections on unchanged production source
        shell: bash
        run: |
          set +e
          npx jest --runInBand --testTimeout=30000 --runTestsByPath \
            src/data/__tests__/discovery-map.test.tsx \
            src/data/__tests__/published-task-discovery-route.test.tsx \
            src/data/__tests__/worker-ai-conversation-recovery.test.tsx \
            src/ui/workerProfile/__tests__/worker-ai-review.test.tsx \
            --testNamePattern='P5 work-area:|P5 worker review:' \
            --json --outputFile=outputs/p5/before.json > outputs/p5/before.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo 'Expected missing-connection regressions on predecessor'; exit 1; fi
          node -e "const r=require('./outputs/p5/before.json');if(r.numFailedTests<4||r.numRuntimeErrorTestSuites)throw Error('Invalid predecessor reproduction');console.log('Before:',r.numFailedTests,'failed assertions;',r.numPassedTests,'passed');"
      - name: Apply only the bounded client changes
        shell: bash
        run: |
          node scripts/proofs/p5-client-package.cjs apply
          node scripts/proofs/p5-client-package.cjs verify
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/proofs/p5-client-package.cjs paths > outputs/p5/source-paths.txt
          while IFS= read -r path; do git add -- "$path"; done < outputs/p5/source-paths.txt
          git commit -m 'feat(p5): connect saved work area and worker review'
          git rev-parse HEAD > outputs/p5/tested-source.txt
      - name: TypeScript exact candidate
        shell: bash
        run: npx tsc --noEmit -p tsconfig.json > outputs/p5/types.log 2>&1
      - name: Focused connected-flow regression
        shell: bash
        run: |
          npx jest -w 3 --testTimeout=30000 --runTestsByPath \
            src/data/__tests__/discovery-work-area.test.ts \
            src/data/__tests__/discovery-work-area-hook.test.tsx \
            src/data/__tests__/discovery-map.test.tsx \
            src/data/__tests__/published-task-discovery-route.test.tsx \
            src/data/__tests__/discovery-presentation.test.tsx \
            src/data/__tests__/worker-ai-conversation-recovery.test.tsx \
            src/ui/workerProfile/__tests__/worker-ai-review.test.tsx \
            src/data/__tests__/ai-conversation-layout.test.tsx \
            --json --outputFile=outputs/p5/focused.json > outputs/p5/focused.log 2>&1
      - name: Full Jest exact candidate
        shell: bash
        run: npx jest -w 3 --testTimeout=30000 --json --outputFile=outputs/p5/full.json > outputs/p5/full.log 2>&1
      - name: Record proof and regenerate the existing control board
        shell: bash
        run: |
          node scripts/proofs/p5-client-package.cjs record
          node scripts/control/osvezi.mjs > outputs/p5/control.log 2>&1
          node scripts/proofs/p5-client-package.cjs verify
          git diff --check
          git add -- docs/implementation/product-v1-closure-20260926/PLAN.md \
            docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_39_P5_WORK_AREA_AND_WORKER_REVIEW.md \
            docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_39_P5_CLIENT_CHECKS.json \
            docs/control/redovi.json docs/control/stanje.json docs/control/FINALIZATION_MATRIX.md
          # README explicitly requires this generated page; do not change global ignore rules.
          git add -f -- docs/control/out/tabla.html
          git commit -m 'docs(control): record P5 client proof and native boundary'
      - name: Publish only on an unchanged canonical predecessor
        shell: bash
        run: |
          branch='work/uskoci-ui-unification-20260924'
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          if [ "$current" != "$GITHUB_SHA" ]; then echo 'Canonical branch moved; preserving both histories without push'; exit 1; fi
          node scripts/proofs/p5-client-package.cjs verify
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > outputs/p5/published-head.txt
      - name: Preserve exact logs and unpublished patch on failure
        if: always()
        shell: bash
        run: |
          mkdir -p outputs/p5
          git diff "$GITHUB_SHA" --binary > outputs/p5/candidate.patch
          git log -3 --format='%H %s' > outputs/p5/commits.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-client-proof-${{ github.run_id }}
          path: outputs/p5/
          if-no-files-found: error
          retention-days: 14
