name: P6 native proof APK (x86_64, disposable local endpoint)

# Builds a P6 native APK for an EMULATOR bound to a disposable local Supabase (10.0.2.2:54321).
# It is not a store artifact and never talks to the canonical DEV project. The flavour is recorded in
# supabase/proofs/discovery/p6_native_apk_flavor.txt:
#   proof       the guarded proof gate stays triple: route param p6Proof=1 + compile flag EXPO_PUBLIC_P6_DISCOVERY_PROOF=1 +
#               Android package rs.uskoci.dev (the ordinary Zadaci route keeps the legacy reader)
#   production  the production reader flag EXPO_PUBLIC_P6_DISCOVERY_READER=1 alone (no route parameter, no proof flag): the
#               ordinary Zadaci route mounts the P6 reader, exactly like a DEV/store build compiled with that flag
# Touch supabase/proofs/discovery/p6_native_apk_build.txt (or this file) to rebuild; the journey workflow reads the run id
# from supabase/proofs/discovery/p6_native_apk_run.txt so a driver-only change never rebuilds the APK.
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/p6-native-apk.yml'
      - 'supabase/proofs/discovery/p6_native_apk_build.txt'
      - 'supabase/proofs/discovery/p6_native_apk_flavor.txt'
permissions:
  contents: read
concurrency:
  group: p6-native-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      # The well-known local-development demo keys of the Supabase CLI stack (public constants, not secrets).
      # The journey workflow refuses to run if the live stack reports a different anon key.
      EXPO_PUBLIC_SUPABASE_URL: http://10.0.2.2:54321
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      EXPO_PUBLIC_USE_FAKE_SOURCE: '0'
      EXPO_PUBLIC_AUTH_RECOVERY_REDIRECT_URL: uskociapp://oporavak
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Select the build flavour recorded in the repository
        run: |
          set -euo pipefail
          flavor="$(tr -d '[:space:]' < supabase/proofs/discovery/p6_native_apk_flavor.txt)"
          case "$flavor" in
            proof) echo "EXPO_PUBLIC_P6_DISCOVERY_PROOF=1" >> "$GITHUB_ENV" ;;
            production) echo "EXPO_PUBLIC_P6_DISCOVERY_READER=1" >> "$GITHUB_ENV" ;;
            *) echo "p6_native_apk_flavor.txt must be proof or production"; exit 1 ;;
          esac
          echo "P6N_APK_FLAVOR=$flavor" >> "$GITHUB_ENV"
          echo "APK flavour: $flavor"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Exact source and locked dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/p6-native-apk
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          npm ci
          test "$EXPO_PUBLIC_SUPABASE_URL" = "http://10.0.2.2:54321"
          if [[ "$EXPO_PUBLIC_SUPABASE_URL" == *"leqcwgzvjsxugfgzdmth.supabase.co"* ]]; then echo "canonical DEV endpoint in a disposable proof build"; exit 1; fi
          if grep -R -n -F "EXPO_PUBLIC_P6_DISCOVERY_PROOF: '1'" app.json app.config.* 2>/dev/null; then echo "proof flag must not live in ordinary config"; exit 1; fi
      - name: Inject exact DEV Android package
        run: |
          node <<'NODE'
          const fs=require('fs'),p='app.json',app=JSON.parse(fs.readFileSync(p,'utf8'));
          app.expo.android=app.expo.android||{};
          app.expo.android.package='rs.uskoci.dev';
          app.expo.name='USKOČI P6 NATIVE';
          fs.writeFileSync(p,JSON.stringify(app,null,2)+'\n');
          NODE
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean
      - name: Enable local HTTP only in the generated proof project
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          if 'android:usesCleartextTraffic=' not in text:
              text = text.replace('<application ', '<application android:usesCleartextTraffic="true" ', 1)
          path.write_text(text)
          if 'android:usesCleartextTraffic="true"' not in path.read_text():
              raise SystemExit('proof-only cleartext manifest injection failed')
          PY
      - name: Tune Gradle for the x86_64 emulator
        run: |
          node <<'NODE'
          const fs=require('fs'),p='android/gradle.properties';let text=fs.readFileSync(p,'utf8');
          const set=(k,v)=>{const r=new RegExp('^'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'=.*$','m'),line=k+'='+v;
            text=r.test(text)?text.replace(r,line):text.trimEnd()+'\n'+line+'\n';};
          set('org.gradle.jvmargs','-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8');
          set('reactNativeArchitectures','x86_64');fs.writeFileSync(p,text);
          NODE
      - name: Build proof APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -x lintVitalAnalyzeRelease
      - name: Bind and verify the proof APK
        run: |
          set -euo pipefail
          out=/tmp/p6-native-apk
          cp android/app/build/outputs/apk/release/app-release.apk "$out/USKOCI-P6-NATIVE-x86_64.apk"
          (cd "$out" && sha256sum USKOCI-P6-NATIVE-x86_64.apk > USKOCI-P6-NATIVE-x86_64.apk.sha256)
          echo "$GITHUB_SHA" > "$out/apk-source.txt"
          echo "$P6N_APK_FLAVOR" > "$out/flavor.txt"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -1)"
          "$AAPT" dump badging "$out/USKOCI-P6-NATIVE-x86_64.apk" | head -1 | tee "$out/badging.txt"
          grep -F "package: name='rs.uskoci.dev'" "$out/badging.txt"
          unzip -l "$out/USKOCI-P6-NATIVE-x86_64.apk" | grep -F 'lib/x86_64/' > "$out/abi.txt"
          if unzip -l "$out/USKOCI-P6-NATIVE-x86_64.apk" | grep -q -E 'lib/(arm64-v8a|armeabi-v7a|x86/)'; then echo "x86_64-only APK expected"; exit 1; fi
          bundle="$(find android/app/build/generated/assets -type f -name 'index.android.bundle' | head -n 1)"
          test -n "$bundle"
          grep -aF 'http://10.0.2.2:54321' "$bundle" >/dev/null
          if grep -aF 'leqcwgzvjsxugfgzdmth.supabase.co' "$bundle" >/dev/null; then echo "canonical hostname inside the proof bundle"; exit 1; fi
          grep -aF "$EXPO_PUBLIC_SUPABASE_ANON_KEY" "$bundle" >/dev/null
          echo "PASS P6_NATIVE_APK_BOUND package=rs.uskoci.dev abi=x86_64 endpoint=http://10.0.2.2:54321 source=$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-native-apk-x86_64
          path: |
            /tmp/p6-native-apk/USKOCI-P6-NATIVE-x86_64.apk
            /tmp/p6-native-apk/USKOCI-P6-NATIVE-x86_64.apk.sha256
            /tmp/p6-native-apk/apk-source.txt
            /tmp/p6-native-apk/flavor.txt
            /tmp/p6-native-apk/badging.txt
            /tmp/p6-native-apk/abi.txt
          if-no-files-found: error
          retention-days: 14
