name: Closure taxonomy extension (isolated PostgreSQL component)
on:
  workflow_dispatch:
  push:
    branches: [feature/unified-qa-master-20261017]
    paths:
      - 'supabase/candidates/closure-taxonomy-20261018/**'
      - '.github/workflows/closure-taxonomy-component-proof.yml'
  pull_request:
    paths:
      - 'supabase/candidates/closure-taxonomy-20261018/**'
      - '.github/workflows/closure-taxonomy-component-proof.yml'
permissions:
  contents: read
jobs:
  component:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_PASSWORD: synthetic_component_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify generated candidate against exact captured source
        run: node supabase/candidates/closure-taxonomy-20261018/build.mjs --check
      - name: Execute exact candidate, owned data, holds, leases and refusal controls
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: f01_component
          PGUSER: postgres
          PGPASSWORD: synthetic_component_only
        run: |
          psql -X -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE f01_component TEMPLATE template0;'
          python3 supabase/candidates/closure-taxonomy-20261018/proof.py
      - name: Publish bounded component evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: closure-taxonomy-component-${{ github.sha }}
          path: supabase/candidates/closure-taxonomy-20261018/component-report.json
          if-no-files-found: error
          retention-days: 14
