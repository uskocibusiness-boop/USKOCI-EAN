name: USKOCI temporary isolated Android APK proof

# Test-only; does not sign with the official EAS preview or Play keystore.
# Default: independent QA package. Explicit phone-preview dispatch updates only
# an existing template-debug preview; the installer must compare certificates.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Test APK target (phone-preview requires matching installed debug certificate)'
        required: true
        default: isolated-qa
        type: choice
        options: [isolated-qa, phone-preview]
  push:
    branches: [work/uskoci-cist-proizvod-20261104]
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: uskoci-qa-apk-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'isolated-qa' }}
  cancel-in-progress: true

jobs:
  qa-apk:
    if: github.ref == 'refs/heads/work/uskoci-cist-proizvod-20261104'
    runs-on: ubuntu-latest
    outputs:
      ux_tests: ${{ steps.source_checks.outputs.ux_tests }}
      apk_artifact: ${{ steps.apk_upload.outputs.artifact-id }}
    timeout-minutes: 60
    env:
      CI: '1'
      EAS_BUILD_PROFILE: preview
      USKOCI_OTA_TARGET: preview
      USKOCI_ANDROID_TEST_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'isolated-qa' }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture tracked source for offline audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uskoci-source"
          git archive --format=tar.gz --output="$RUNNER_TEMP/uskoci-source/source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/uskoci-source/source-commit.txt"
          git ls-tree -r -l HEAD > "$RUNNER_TEMP/uskoci-source/source-inventory.txt"
      - name: Upload exact source snapshot separately from APK
        uses: actions/upload-artifact@v4
        with:
          name: uskoci-source-${{ github.sha }}
          path: ${{ runner.temp }}/uskoci-source/
          if-no-files-found: error
          retention-days: 3
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install exact dependencies and enforce the native patch
        run: |
          npm ci
          node scripts/verify-native-patches.cjs
      - name: Archive bounded test runtime for reproducible offline checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uskoci-test-runtime"
          tar -czf "$RUNNER_TEMP/uskoci-test-runtime/runtime.tar.gz" node_modules/react node_modules/react-test-renderer node_modules/react-is node_modules/scheduler node_modules/typescript node_modules/@electric-sql/pglite node_modules/@supabase
          sha256sum package-lock.json > "$RUNNER_TEMP/uskoci-test-runtime/lock.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/uskoci-test-runtime/source-commit.txt"
      - name: Upload bounded test runtime
        uses: actions/upload-artifact@v4
        with:
          name: uskoci-test-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/uskoci-test-runtime/
          if-no-files-found: error
          retention-days: 3
      - name: Verify the active clean source
        id: source_checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uskoci-checks"
          node scripts/verify-native-patches.cjs --repo
          python scripts/qa-gradle-bootstrap.test.py
          python scripts/test_apk_audio_resources.py
          python scripts/test_verify_qa_apk_r2.py
          python -B -m unittest discover -s scripts/bootstrap -p test_generate.py 2>&1 | tee "$RUNNER_TEMP/uskoci-checks/bootstrap-generator.txt"
          node --test scripts/bootstrap/system-reference-seed.test.cjs 2>&1 | tee "$RUNNER_TEMP/uskoci-checks/bootstrap-seed.tap"
          node scripts/record-ux-checkpoint.cjs --verify-source
          npm test 2>&1 | tee "$RUNNER_TEMP/uskoci-checks/tests.tap"
          npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/uskoci-checks/typescript.txt"
          sh supabase/migrations/check_md5.sh 2>&1 | tee "$RUNNER_TEMP/uskoci-checks/migration-integrity.txt"
          node - <<'NODE'
          const fs = require('node:fs');
          const tap = fs.readFileSync(process.env.RUNNER_TEMP + '/uskoci-checks/tests.tap', 'utf8');
          // Node 22 emits TAP '# tests'; Node 24's default reporter emits 'ℹ tests'.
          // Accept exactly one complete summary, never infer success from a substring.
          const stat = label => {
            const rows = [...tap.matchAll(new RegExp('^(?:#|ℹ) ' + label + ' (\\d+)\\r?$', 'gm'))];
            return rows.length === 1 ? Number(rows[0][1]) : null;
          };
          const tests = stat('tests'), passed = stat('pass'), failed = stat('fail'),
            skipped = stat('skipped'), todo = stat('todo');
          if (!Number.isSafeInteger(tests) || tests < 761 || passed !== tests || failed !== 0
            || skipped !== 0 || todo !== 0) throw Error('UX_TEST_EVIDENCE_INVALID');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'ux_tests=' + tests + '\n');
          NODE
      - name: Upload source check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uskoci-checks-${{ github.sha }}
          path: ${{ runner.temp }}/uskoci-checks/
          if-no-files-found: ignore
          retention-days: 3
      - name: Pin canonical DEV settings and isolate app identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const {assertDevBuildContract} = require('./scripts/build-contract.cjs');
          const candidate = require('./scripts/android-test-candidate.cjs').selectTestCandidate({
            target: process.env.USKOCI_ANDROID_TEST_TARGET, eventName: process.env.GITHUB_EVENT_NAME,
            previewEnvironment: require('./eas.json').build.preview.env });
          const config = candidate.environment;
          if (Object.keys(config).some(name => !/^\w+$/.test(name))) throw new Error('INVALID_PREVIEW_KEY');
          const env = {...process.env, ...config};
          assertDevBuildContract(env);
          for (const [key,value] of Object.entries(config)) {
            if (typeof value !== 'string' || /[\r\n]/.test(value)) throw new Error('INVALID_PREVIEW_VALUE');
            fs.appendFileSync(process.env.GITHUB_ENV, key + '=' + value + '\n');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, 'USKOCI_ANDROID_TEST_PACKAGE=' + candidate.package + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'USKOCI_TEST_CERT_SHA256=' + candidate.expectedCertificateSha256 + '\n');
          const src = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          if (src.expo?.android?.package !== 'rs.uskoci.preview') throw new Error('UNEXPECTED_SOURCE_PACKAGE');
          src.expo.name = candidate.name;
          src.expo.android.package = candidate.package;
          fs.writeFileSync('app.json', JSON.stringify(src, null, 2) + '\n');
          NODE
          node - <<'NODE'
          const candidate = require('./scripts/android-test-candidate.cjs').selectTestCandidate({
            target: process.env.USKOCI_ANDROID_TEST_TARGET, eventName: process.env.GITHUB_EVENT_NAME,
            previewEnvironment: require('./eas.json').build.preview.env });
          Object.assign(process.env, candidate.environment);
          const expo=require('./app.config.js')({config: require('./app.json').expo});
          if(expo.android.package!==candidate.package||expo.extra?.uskociBuild?.backendTarget!=='canonical'||expo.runtimeVersion!=='uskoci-v1-preview-r2') throw Error('QA_BUILD_IDENTITY_INVALID');
          if (candidate.firebaseConfigured) {
            require('./scripts/check-eas-preview.cjs').validateFirebase(require('./config/firebase/google-services.json'));
            if (expo.android.googleServicesFile !== './config/firebase/google-services.json') throw Error('PHONE_PREVIEW_FIREBASE_REQUIRED');
          } else if (expo.android.googleServicesFile) throw Error('QA_MUST_HAVE_NO_FIREBASE');
          if (expo.updates.enabled !== false || expo.updates.checkAutomatically !== 'NEVER' || expo.updates.useEmbeddedUpdate !== true) throw Error('QA_MUST_USE_EMBEDDED_SOURCE');
          if (expo.extra.uskociBuild.sourceCommit !== process.env.GITHUB_SHA) throw Error('QA_SOURCE_COMMIT_MISMATCH');
          console.log('QA package isolation, DEV backend and embedded-only source PASS');
          NODE
      - name: Generate only the Android native project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Verify generated native update isolation
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = ET.parse('android/app/src/main/AndroidManifest.xml').getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          metadata = {item.get(android + 'name'): item.get(android + 'value') for item in manifest.findall('application/meta-data')}
          assert metadata.get('expo.modules.updates.ENABLED') == 'false', 'QA_NATIVE_UPDATES_MUST_BE_DISABLED'
          assert metadata.get('expo.modules.updates.EXPO_UPDATES_CHECK_ON_LAUNCH') == 'NEVER', 'QA_NATIVE_UPDATE_CHECK_MUST_BE_DISABLED'
          assert metadata.get('expo.modules.updates.HAS_EMBEDDED_UPDATE') != 'false', 'QA_NATIVE_BUNDLE_REQUIRED'
          sounds = sorted(Path('assets/audio').glob('uskoci_*_v1.wav'))
          assert {p.name for p in sounds} == {'uskoci_message_v1.wav', 'uskoci_opportunity_v1.wav', 'uskoci_confirm_v1.wav'}, 'QA_AUDIO_SOURCE_SET_MISMATCH'
          for sound in sounds:
              bundled = Path('android/app/src/main/res/raw') / sound.name
              assert bundled.is_file() and bundled.read_bytes() == sound.read_bytes(), 'QA_NATIVE_AUDIO_RESOURCE_MISMATCH'
              print('Bundled native sound:', sound.name, hashlib.sha256(sound.read_bytes()).hexdigest())
          print('Generated Android manifest: embedded source only PASS')
          PY
      - name: Prepare pinned Gradle distribution with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          wrapper = Path('android/gradle/wrapper')
          properties = wrapper / 'gradle-wrapper.properties'
          text = properties.read_text()
          original = r'https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip'
          direct = r'https\://downloads.gradle.org/distributions/gradle-9.3.1-bin.zip'
          # Gradle's official release-checksums reference; keep the same version.
          expected = 'b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06'
          assert re.findall(r'^distributionUrl=(.*)$', text, re.M) == [original], 'UNEXPECTED_GRADLE_DISTRIBUTION'
          assert re.findall(r'^validateDistributionUrl=(.*)$', text, re.M) == ['true'], 'GRADLE_URL_VALIDATION_REQUIRED'
          assert re.findall(r'^distributionSha256Sum=(.*)$', text, re.M) in ([], [expected]), 'UNEXPECTED_GRADLE_CHECKSUM'
          assert hashlib.sha256((wrapper / 'gradle-wrapper.jar').read_bytes()).hexdigest() == 'b3a875ddc1f044746e1b1a55f645584505f4a10438c1afea9f15e92a7c42ec13', 'UNEXPECTED_GRADLE_WRAPPER'
          text = text.replace('distributionUrl=' + original, 'distributionUrl=' + direct)
          if not re.search(r'^distributionSha256Sum=', text, re.M):
              text = text.rstrip('\n') + '\ndistributionSha256Sum=' + expected + '\n'
          properties.write_text(text)
          print('Same Gradle 9.3.1 distribution, official SHA-256 and wrapper identity pinned')
          PY
          cd android
          chmod +x gradlew
          # Retry only distribution bootstrap, never a failed application build.
          # Wrapper 9.3.1 predates native retry properties introduced in 9.5.
          gradle_bootstrap_ok=0
          for gradle_attempt in 1 2 3; do
            gradle_bootstrap_log="$RUNNER_TEMP/uskoci-gradle-bootstrap-${gradle_attempt}.log"
            if timeout --kill-after=10s 180s ./gradlew --version > "$gradle_bootstrap_log" 2>&1; then
              cat "$gradle_bootstrap_log"
              gradle_bootstrap_ok=1
              break
            else
              gradle_attempt_exit=$?
              cat "$gradle_bootstrap_log"
            fi
            # Keep checksum, JVM and configuration failures visible immediately.
            if [ "$gradle_attempt_exit" -ne 124 ] && [ "$gradle_attempt_exit" -ne 137 ] && ! grep -Eq 'HTTP response code: (429|5[0-9][0-9])|SocketTimeoutException|[Tt]imed out' "$gradle_bootstrap_log"; then
              exit "$gradle_attempt_exit"
            fi
            if [ "$gradle_attempt" -lt 3 ]; then sleep "$((gradle_attempt * 2))"; fi
          done
          test "$gradle_bootstrap_ok" = 1
      - name: Build standalone installable release JS bundle and APK
        shell: bash
        run: |
          set -euo pipefail
          # The signed-in phone and x86_64 emulator must run the same embedded source.
          # Keep automatic isolated QA ARM64-only; the explicit preview also includes the emulator ABI.
          build_abis=arm64-v8a
          if [ "$USKOCI_ANDROID_TEST_TARGET" = phone-preview ]; then build_abis=arm64-v8a,x86_64; fi
          printf '\nreactNativeArchitectures=%s\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8\n' "$build_abis" >> android/gradle.properties
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2
      - name: Attest isolated APK and source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/qa-apk
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          export USKOCI_QA_AAPT2="$tools_dir/aapt2"
          "$tools_dir/apksigner" verify --verbose --print-certs "$apk" > artifacts/qa-apk/signature.txt
          "$tools_dir/aapt" dump badging "$apk" > artifacts/qa-apk/apk-badging.txt
          grep -F "package: name='$USKOCI_ANDROID_TEST_PACKAGE'" artifacts/qa-apk/apk-badging.txt
          "$tools_dir/aapt" dump xmltree "$apk" AndroidManifest.xml > artifacts/qa-apk/AndroidManifest-tree.txt
          python - <<'PY'
          import json, os, re, subprocess, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          from apk_audio_resources import verify_apk_audio
          directory = Path('artifacts/qa-apk')
          package = os.environ['USKOCI_ANDROID_TEST_PACKAGE']
          phone = os.environ['USKOCI_ANDROID_TEST_TARGET'] == 'phone-preview'
          assert package == ('rs.uskoci.preview' if phone else 'rs.uskoci.preview.qa'), 'APK_TARGET_PACKAGE_MISMATCH'
          signature = (directory / 'signature.txt').read_text()
          certificates = re.findall(r'certificate SHA-256 digest: ([0-9a-f]{64})', signature)
          assert certificates == [os.environ['USKOCI_TEST_CERT_SHA256']], 'APK_TEMPLATE_DEBUG_CERTIFICATE_MISMATCH'
          badging = (directory / 'apk-badging.txt').read_text()
          version = re.search(r"versionCode='(\d+)'", badging)
          assert version and int(version.group(1)) >= 36, 'APK_VERSION_BELOW_INSTALLED_PHONE'
          assert "targetSdkVersion:'36'" in badging, 'APK_TARGET_SDK_CHANGED_REQUIRES_REVIEW'
          manifest = (directory / 'AndroidManifest-tree.txt').read_text()
          blocks = re.split(r'(?m)^\s*E: ', manifest)
          enabled = [block for block in blocks if block.startswith('meta-data ') and '"expo.modules.updates.ENABLED"' in block]
          assert len(enabled) == 1 and re.search(r'android:value\([^)]*\)=\(type 0x12\)0x0\b', enabled[0]), 'APK_UPDATES_NOT_DISABLED'
          with zipfile.ZipFile('android/app/build/outputs/apk/release/app-release.apk') as apk:
            names = apk.namelist()
            abis = sorted({name.split('/')[1] for name in names if name.startswith('lib/') and name.endswith('.so')})
            assert abis == (['arm64-v8a', 'x86_64'] if phone else ['arm64-v8a']), 'APK_ABI_MISMATCH'
            for abi in abis:
              for library in ('libreactnative.so', 'libhermesvm.so'):
                native_path = f'lib/{abi}/{library}'
                assert native_path in names and apk.getinfo(native_path).file_size > 0, f'APK_REQUIRED_NATIVE_LIBRARY_MISSING:{native_path}'
            assert 'assets/index.android.bundle' in names and apk.getinfo('assets/index.android.bundle').file_size > 0, 'APK_EMBEDDED_BUNDLE_MISSING'
            dex = [name for name in names if re.fullmatch(r'classes\d*\.dex', name)]
            assert dex and any(b'USKOCI_RNR01' in apk.read(name) for name in dex), 'APK_NATIVE_PATCH_MISSING'
          sources = {p.name: p.read_bytes() for p in Path('assets/audio').glob('uskoci_*_v1.wav')}
          assert set(sources) == {'uskoci_message_v1.wav', 'uskoci_opportunity_v1.wav', 'uskoci_confirm_v1.wav'}, 'APK_NATIVE_AUDIO_COUNT_MISMATCH'
          # AGP8.12 shortens resource ZIP paths even without minify/shrink.
          # Resolve logical Android raw names/IDs through the actual table, then
          # compare the mapped packaged bytes exactly. Never infer by hash alone.
          apk_path = Path('android/app/build/outputs/apk/release/app-release.apk')
          resources = subprocess.run([os.environ['USKOCI_QA_AAPT2'], 'dump', 'resources', str(apk_path)], check=True, capture_output=True, text=True, timeout=30).stdout
          google_app_ids = re.findall(r'(?m)^\s*resource [^\n]+ string/google_app_id\b[^\n]*\n([^\n]+)', resources)
          if phone:
            assert len(google_app_ids) == 1 and '1:383421751370:android:3e19dd87280aa317a986b3' in google_app_ids[0], 'APK_PREVIEW_FIREBASE_CLIENT_MISSING'
          else:
            assert not google_app_ids, 'QA_APK_MUST_HAVE_NO_FIREBASE_CLIENT'
          audio = verify_apk_audio(apk_path, Path(os.environ['USKOCI_QA_AAPT2']), package, sources)
          (directory / 'native-receipt.json').write_text(json.dumps({'abis': abis, 'embeddedBundle': True, 'otaEnabled': False, 'firebaseConfigured': phone, 'certificateSha256': certificates[0], 'nativePatchMarker': 'USKOCI_RNR01', 'dexFiles': len(dex), 'bundledAudioSha256': {name: value['sha256'] for name, value in audio['resources'].items()}, 'bundledAudioResources': audio['resources'], 'audioResourceTableVerification': {'aapt2': audio['aapt2'], 'resourceDump': audio['resourceDump']}, 'customSoundActivation': 'NOT_ACTIVE_SERVER_DEFAULT_CHANNEL_RETAINED'}, indent=2) + '\n')
          print('Final APK: ' + ', '.join(abis) + ', React Native/Hermes, embedded bundle, OTA disabled and native patch marker PASS')
          PY
          filename_prefix=USKOCI-QA
          if [ "$USKOCI_ANDROID_TEST_TARGET" = phone-preview ]; then filename_prefix=USKOCI-PHONE-PREVIEW; fi
          cp "$apk" "artifacts/qa-apk/$filename_prefix-$(git rev-parse --short=9 HEAD).apk"
          (cd artifacts/qa-apk && sha256sum *.apk > SHA256SUMS.txt)
          node - <<'NODE'
          const fs = require('node:fs'), crypto=require('node:crypto');
          const dir='artifacts/qa-apk';
          const files=fs.readdirSync(dir).filter(f=>f.endsWith('.apk'));
          if(files.length!==1)throw Error('APK_COUNT_INVALID');
          const data=fs.readFileSync(dir + '/' + files[0]);
          const native=JSON.parse(fs.readFileSync(dir + '/native-receipt.json','utf8'));
          const candidate=require('./scripts/android-test-candidate.cjs').selectTestCandidate({target:process.env.USKOCI_ANDROID_TEST_TARGET,eventName:process.env.GITHUB_EVENT_NAME,previewEnvironment:{}});
          const phone=candidate.target==='phone-preview';
          const meta={status:'BUILD_OUTPUT_NOT_NATIVE_E2E',sourceCommit:process.env.GITHUB_SHA,filename:files[0],bytes:data.length,sha256:crypto.createHash('sha256').update(data).digest('hex'),package:candidate.package,signing:'EXPO_TEMPLATE_ANDROID_DEBUG_KEY',backend:'DEV',runtimeVersion:'uskoci-v1-preview-r2',...native,configOverrides:{name:candidate.name,androidPackage:candidate.package},push:'NOT_PROVEN',deviceInstall:'NOT_PERFORMED',replacesExistingPreview:phone,candidateTarget:candidate.target,installationBoundary:phone?'Only update an existing preview whose certificate matches certificateSha256. Never uninstall or clear app data.':'Side-by-side QA package; does not replace preview.'};
          fs.writeFileSync(dir + '/build-receipt.json',JSON.stringify(meta,null,2)+'\n');
          fs.writeFileSync(dir+'/README.txt',phone
            ? `Manual phone/emulator preview test APK (${native.abis.join(', ')}). Template debug certificate, DEV, embedded source only, OTA disabled, Firebase configured. Install -r only after matching the installed preview certificate. NOT EAS signing or Play; NO device/FCM acceptance is claimed.\n`
            : `Temporary side-by-side QA APK only (${native.abis.join(', ')}). Embedded source only; OTA disabled. New package/signing; NOT the signed EAS preview, NOT production/store, NO push or device-install proof.\n`);
          NODE
      - name: Upload installable APK and bounded receipt
        id: apk_upload
        uses: actions/upload-artifact@v4
        with:
          name: uskoci-${{ env.USKOCI_ANDROID_TEST_TARGET }}-apk-${{ github.run_number }}
          path: artifacts/qa-apk/
          if-no-files-found: error
          retention-days: 7

  # Isolated documentation-only writer. The build job stays contents:read.
  # No npm/dependency commands run here, and its token is not stored by checkout.
  # The recorder pins the original master blob and refuses concurrent movement.
  record-ux-checkpoint:
    needs: qa-apk
    if: needs.qa-apk.result == 'success' && github.ref == 'refs/heads/work/uskoci-cist-proizvod-20261104' && (github.event_name != 'workflow_dispatch' || inputs.target != 'phone-preview')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Save verified evidence in the existing execution master
        run: node scripts/record-ux-checkpoint.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UX_CI_TESTS: ${{ needs.qa-apk.outputs.ux_tests }}
          UX_APK_ARTIFACT: ${{ needs.qa-apk.outputs.apk_artifact }}
