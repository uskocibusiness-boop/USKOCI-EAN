name: Unified Gemini taxonomy P0 (read-only)
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/classificationEngine.mjs'
      - 'supabase/functions/_shared/classificationEngine.d.mts'
      - 'supabase/functions/_shared/classificationGeminiShadow.mjs'
      - 'supabase/functions/_shared/classificationOwnerReview.mjs'
      - 'supabase/functions/_shared/classificationGeminiShadow.d.mts'
      - 'supabase/functions/_shared/classificationBatch.mjs'
      - 'supabase/functions/_shared/classificationBatch.d.mts'
      - 'supabase/functions/_shared/taxonomyPostSaveWorker.mjs'
      - 'supabase/functions/_shared/taxonomyPostSaveWorker.d.mts'
      - 'supabase/functions/uskoci-taxonomy-postsave-worker/index.ts'
      - 'supabase/proofs/dynamic_taxonomy/taxonomy-postsave-worker.test.mjs'
      - 'supabase/functions/uskoci-ai-interview/index.ts'
      - 'supabase/functions/uskoci-worker-interview/index.ts'
      - 'src/app/(app)/profil/razgovor.tsx'
      - 'src/ui/workerProfile/workerProfileFacts.ts'
      - 'src/ui/workerProfile/WorkerAiPresentation.tsx'
      - 'src/ui/v2/DiscoveryPresentation.tsx'
      - 'src/ui/v2/discovery/DiscoveryListState.tsx'
      - 'src/ui/v2/discovery/DiscoveryV1Route.tsx'
      - 'supabase/proofs/dynamic_taxonomy/discovery-for-me-confirmed-work-source.test.mjs'
      - 'supabase/proofs/dynamic_taxonomy/unified-*.test.mjs'
      - 'supabase/proofs/dynamic_taxonomy/classification-gemini-shadow*.test.mjs'
      - 'supabase/proofs/dynamic_taxonomy/worker-finish-mode-completeness.test.mjs'
      - 'supabase/proofs/dynamic_taxonomy/worker-interview-question-policy.test.mjs'
      - 'supabase/proofs/dynamic_taxonomy/gemini-real-provider-smoke.mjs'
      - 'supabase/proofs/dynamic_taxonomy/classification-batch.test.mjs'
      - 'supabase/proofs/dynamic_taxonomy/classification-owner-review.test.mjs'
      - 'supabase/proofs/dynamic_taxonomy/need-review-signed-source.test.mjs'
      - 'supabase/candidates/dynamic-taxonomy-20261011/need-review-signed-classification-v1.sql'
      - '.github/workflows/unified-taxonomy-classification-p0.yml'
      - 'supabase/migrations/20261018120335_taxonomy_catalog_verified_alias_context.sql'
      - 'supabase/proofs/dynamic_taxonomy/catalog-alias-context/**'
      - 'supabase/proofs/dynamic_taxonomy/classification-verified-alias.test.mjs'
      - 'supabase/migrations/*_worker_saved_mode_review_continuity.sql'
      - 'supabase/proofs/dynamic_taxonomy/worker-saved-mode-continuity/**'
  workflow_dispatch:
jobs:

  catalog-alias-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Prepare exact previous catalog reader with isolated tables
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/proofs/dynamic_taxonomy/catalog-alias-context/fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proofs/dynamic_taxonomy/catalog-alias-context/before.sql
      - name: Reproduce missing verified-alias context
        run: |
          if psql -X -v ON_ERROR_STOP=1 -f supabase/proofs/dynamic_taxonomy/catalog-alias-context/assert.sql > before.log 2>&1; then
            echo "Expected the exact previous reader to fail"
            exit 1
          fi
          cat before.log
          grep -q ALIAS_CONTEXT_MISSING before.log
      - name: Apply and prove exact alias reader, paging and role guards
        run: |
          psql -X --single-transaction -v ON_ERROR_STOP=1 -f supabase/migrations/20261018120335_taxonomy_catalog_verified_alias_context.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proofs/dynamic_taxonomy/catalog-alias-context/assert.sql
      - name: Prove rollback restores the original function
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/proofs/dynamic_taxonomy/catalog-alias-context/before.sql
          test "$(psql -X -Atc "select md5(pg_get_functiondef('private.taxonomy_ai_catalog_context_v1(text,integer,text)'::regprocedure))")" = b658756bc9c99acf3fd07688050e9792
      - name: Prove candidate reapplies after rollback
        run: |
          psql -X --single-transaction -v ON_ERROR_STOP=1 -f supabase/migrations/20261018120335_taxonomy_catalog_verified_alias_context.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proofs/dynamic_taxonomy/catalog-alias-context/assert.sql

  worker-saved-mode-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Prepare exact previous review with isolated signed-profile fixtures
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/proofs/dynamic_taxonomy/worker-saved-mode-continuity/fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proofs/dynamic_taxonomy/worker-saved-mode-continuity/before.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proofs/dynamic_taxonomy/worker-saved-mode-continuity/assert-before.sql
      - name: Prove saved-mode continuity and stale, changed and revoked negatives
        run: |
          psql -X --single-transaction -v ON_ERROR_STOP=1 -f supabase/migrations/20261018123829_worker_saved_mode_review_continuity.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proofs/dynamic_taxonomy/worker-saved-mode-continuity/assert.sql
      - name: Prove rollback and reapplication
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/proofs/dynamic_taxonomy/worker-saved-mode-continuity/before.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proofs/dynamic_taxonomy/worker-saved-mode-continuity/assert-before.sql
          psql -X --single-transaction -v ON_ERROR_STOP=1 -f supabase/migrations/20261018123829_worker_saved_mode_review_continuity.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/proofs/dynamic_taxonomy/worker-saved-mode-continuity/assert.sql

  classification-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only canonical catalog and Gemini integration invariants
        run: node --test supabase/proofs/dynamic_taxonomy/classification-verified-alias.test.mjs supabase/proofs/dynamic_taxonomy/unified-*.test.mjs supabase/proofs/dynamic_taxonomy/classification-gemini-shadow*.test.mjs supabase/proofs/dynamic_taxonomy/worker-finish-mode-completeness.test.mjs supabase/proofs/dynamic_taxonomy/worker-interview-question-policy.test.mjs supabase/proofs/dynamic_taxonomy/discovery-for-me-confirmed-work-source.test.mjs supabase/proofs/dynamic_taxonomy/classification-batch.test.mjs supabase/proofs/dynamic_taxonomy/classification-owner-review.test.mjs supabase/proofs/dynamic_taxonomy/need-review-signed-source.test.mjs supabase/proofs/dynamic_taxonomy/taxonomy-postsave-worker.test.mjs

  edge-typing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.5.6
      - name: Install exact TypeScript dependencies without postinstall build
        run: npm ci --no-audit --no-fund
      - name: Verify exact worker and requester Gemini schemas on provider wire (offline)
        run: node supabase/proofs/dynamic_taxonomy/gemini-real-provider-smoke.mjs --offline
      - name: Type check both real Gemini Edge handlers
        run: |
          deno check supabase/functions/uskoci-worker-interview/index.ts
          deno check supabase/functions/uskoci-ai-interview/index.ts
          deno check supabase/functions/uskoci-taxonomy-postsave-worker/index.ts

  provider-contract-live:
    name: Gemini provider isolated schema proof (opt-in)
    # Never run paid requests on normal CI or from external PRs. Explicit
    # repository variable and a separate test-only key are both required.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/unified-gemini-classification-p0-20261014' && vars.USKOCI_GEMINI_SMOKE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      USKOCI_GEMINI_TEST_API_KEY: ${{ secrets.USKOCI_GEMINI_TEST_API_KEY }}
      USKOCI_GEMINI_TEST_MODEL: ${{ vars.USKOCI_GEMINI_TEST_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dev dependencies without native hooks
        run: npm ci --no-audit --no-fund
      - name: Two synthetic worker and need provider calls, no DEV access
        run: node supabase/proofs/dynamic_taxonomy/gemini-real-provider-smoke.mjs --provider
