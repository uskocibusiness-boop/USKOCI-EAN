name: USKOCI pinned source transfer

on:
  push:
    branches: [work/source-transfer-690671f-20261103]

permissions:
  contents: read

jobs:
  export-pinned-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 690671f63d7d2d6654ab451b1340045e6034fbd8
          persist-credentials: false
          fetch-depth: 1
      - name: Export tracked source only without credentials or execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "690671f63d7d2d6654ab451b1340045e6034fbd8"
          mkdir -p "$RUNNER_TEMP/uskoci-source"
          git archive --format=tar.gz --prefix=USKOCI-EAN/ HEAD > "$RUNNER_TEMP/uskoci-source/source-690671f.tar.gz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/uskoci-source/git-tree-690671f.txt"
          cd "$RUNNER_TEMP/uskoci-source"
          sha256sum source-690671f.tar.gz git-tree-690671f.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-source-690671f
          path: ${{ runner.temp }}/uskoci-source/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
