name: USKOCI pinned source transfer

on:
  push:
    branches: [work/source-transfer-690671f-20261103]

permissions:
  contents: read

jobs:
  export-pinned-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f94e77d346155acddf63de255e905004f5d21a15
          persist-credentials: false
          fetch-depth: 0
      - name: Export concurrent changes without credentials or execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f94e77d346155acddf63de255e905004f5d21a15"
          mkdir -p "$RUNNER_TEMP/uskoci-source"
          git diff --binary 690671f63d7d2d6654ab451b1340045e6034fbd8 HEAD > "$RUNNER_TEMP/uskoci-source/concurrent-f94e77d.patch"
          git diff --name-only -z 690671f63d7d2d6654ab451b1340045e6034fbd8 HEAD | tar --null -T - -czf "$RUNNER_TEMP/uskoci-source/concurrent-f94e77d.tar.gz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/uskoci-source/git-tree-f94e77d.txt"
          cd "$RUNNER_TEMP/uskoci-source"
          sha256sum concurrent-f94e77d.patch concurrent-f94e77d.tar.gz git-tree-f94e77d.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: concurrent-source-f94e77d
          path: ${{ runner.temp }}/uskoci-source/
          retention-days: 1
          if-no-files-found: error
