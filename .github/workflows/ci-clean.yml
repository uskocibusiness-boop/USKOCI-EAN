name: USKOCI clean branch checks

on:
  push:
    branches: [feature/uskoci-cisto]
  pull_request:
    branches: [feature/uskoci-cisto]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uskoci-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.5.6
      - name: Install exact dependencies and verify native patch
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Deno AI Edge import and type checks (no execution)
        run: |
          deno check --no-config --no-lock --no-npm --no-remote \
            supabase/functions/uskoci-ai-interview/index.ts \
            supabase/functions/uskoci-worker-interview/index.ts \
            supabase/functions/uskoci-taxonomy-postsave-worker/index.ts
      - name: Mobile unit and contract tests
        run: npm test -- --maxWorkers=2 --silent
      - name: Optional profile skill SDK and SQL comparison
        run: node --test scripts/f13-skill-cas.test.mjs
      - name: Hourly application and Agreement SQL chain
        run: |
          python supabase/proofs/ai/generate_hourly_candidate.py --check
          node --test scripts/r07b-hourly-chain.test.mjs
      - name: R03 guarded page source only (no SQL execution)
        run: |
          python supabase/proofs/ex04/build_r03_existing_helper.py --check
          python -m unittest discover -s supabase/proofs/ex04 -p 'test_r03_*.py'
      - name: AI intake and taxonomy contracts
        run: |
          node --test --test-concurrency=2 --test-reporter=dot supabase/proofs/ai/*.test.mjs
          node --test --test-reporter=dot \
            supabase/proofs/dynamic_taxonomy/worker-interview-question-policy.test.mjs \
            supabase/proofs/taxonomy/published_need_category_gate.test.mjs \
            supabase/proofs/taxonomy/live_writer_characterization.test.mjs \
            supabase/proofs/dynamic_taxonomy/classification-active-review.test.mjs \
            supabase/proofs/dynamic_taxonomy/worker-signed-review-source.test.mjs \
            supabase/proofs/dynamic_taxonomy/need-review-signed-source.test.mjs
          node --test --test-reporter=dot \
            supabase/proofs/dynamic_taxonomy/classification-gemini-shadow.test.mjs \
            supabase/proofs/dynamic_taxonomy/service-handoff.test.mjs \
            supabase/proofs/dynamic_taxonomy/worker-existing-identity-recovery.test.mjs \
            supabase/proofs/dynamic_taxonomy/classification-direct-reply.test.mjs \
            supabase/proofs/dynamic_taxonomy/classification-verified-alias.test.mjs \
            supabase/proofs/dynamic_taxonomy/classification-turn-feedback.test.mjs \
            supabase/proofs/dynamic_taxonomy/classification-gemini-shadow-source.test.mjs
      - name: Migration source integrity
        run: |
          python supabase/migrations/check_migration_integrity.py
          python -m unittest discover -s supabase/migrations -p test_migration_integrity.py
      - name: Need column privacy boundary (isolated SQL)
        run: |
          node supabase/proofs/privacy/r01-column-boundary.test.mjs
          node supabase/proofs/privacy/r01-bootstrap-parity.test.mjs
          python -B -m unittest discover -s supabase/proofs/privacy/bootstrap -p 'test_*.py'
