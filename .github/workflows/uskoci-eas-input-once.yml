name: USKOCI lean EAS upload acceptance
on:
  push:
    branches: [work/product-cleanup-20261104]
    paths: [.github/workflows/uskoci-eas-input-once.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/product-cleanup-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      BASE_SHA: 84a7ca78ed042a9f123725e790703663ec7ac7a2
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Pin the isolated checkout and prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/product-cleanup-20261104
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only "$BASE_SHA" HEAD)" = ".github/workflows/uskoci-eas-input-once.yml"
          mkdir -p /tmp/uskoci-eas-audit
      - name: Original locked install, TypeScript and Android Metro baseline
        shell: bash
        run: |
          set -euo pipefail
          npm ci > /tmp/uskoci-eas-audit/npm-ci.log 2>&1
          ./node_modules/.bin/tsc --noEmit > /tmp/uskoci-eas-audit/typescript.log 2>&1
          node - <<'JS' > /tmp/uskoci-eas-audit/android-original.log 2>&1
          const {spawnSync}=require('node:child_process');
          const env={...process.env,...require('./eas.json').build.preview.env,
            EAS_BUILD_PROFILE:'preview',USKOCI_OTA_TARGET:'preview',
            EXPO_NO_TELEMETRY:'1',EXPO_OFFLINE:'1'};
          const result=spawnSync(process.execPath,['node_modules/expo/bin/cli',
            'export','--platform','android','--output-dir','/tmp/uskoci-eas-audit/android-original'],
            {env,stdio:'inherit'});
          if(result.error)throw result.error;
          process.exit(result.status??1);
          JS
      - name: Simulate EAS file exclusions against every tracked file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,hashlib,json
          root=Path.cwd()
          original=(root/'.gitignore').read_text(encoding='utf-8')
          if not original.endswith('\n'): raise SystemExit('GITIGNORE_NEWLINE_CHANGED')
          extra=('\n# EAS project transfer only: retain all gitignore rules above.\n'
              '/docs/\n/tests/\n/__mocks__/\n'
              '/supabase/candidates/\n/supabase/proofs/\n'
              '/supabase/operations/\n/supabase/migrations/\n'
              '/src/designLab/\n'
              '**/__tests__/\n**/*.test.*\n**/*.spec.*\n')
          (root/'.easignore').write_text(original+extra,encoding='utf-8')
          allpaths=[p.decode() for p in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if p]
          proc=subprocess.run(['git','-c','core.excludesFile='+str(root/'.easignore'),
                  'check-ignore','--no-index','-z','--stdin'],
                  input=b'\0'.join(p.encode() for p in allpaths)+b'\0',
                  stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False)
          if proc.returncode!=0:raise SystemExit('IGNORE_CHECK_FAILED '+proc.stderr.decode()[:1000])
          ignored={p.decode() for p in proc.stdout.split(b'\0') if p}
          required=['package.json','package-lock.json','app.json','eas.json','metro.config.cjs',
              'app.config.js','src/app/(app)/nova.tsx','src/features/ai/intake/aiDownLine.ts',
              'supabase/functions/_shared/serviceHandoff.mjs',
              'assets/brand/reference-entry/provenance.json',
              'config/firebase/google-services.json','scripts/check-eas-preview.cjs',
              'patches/react-native-reanimated+4.5.1.patch',
              'vendor/decode-uri-component-compat/package.json']
          excluded=['docs/plan/CODEX_PLAN_RADA.md',
              'supabase/proofs/ai/single_pass_edge.test.mjs',
              'supabase/candidates/match-v1-20261007/candidate.sql',
              'supabase/operations/dev-alpha/r04-single-pass-20261103/build.mjs',
              'src/data/__tests__/p5-matching-field-contract.test.ts',
              'supabase/migrations/20261023210000_matching_work_areas_and_public_grants.sql']
          for p in required:
              if p not in allpaths or p in ignored:raise SystemExit('REQUIRED_FILE_EXCLUDED '+p)
          for p in excluded:
              if p not in allpaths or p not in ignored:raise SystemExit('HISTORICAL_FILE_NOT_EXCLUDED '+p)
          stats={'beforeTracked':len(allpaths),'excludedTracked':len(ignored),
              'keptTracked':len(allpaths)-len(ignored),
              'beforeBytes':sum((root/p).stat().st_size for p in allpaths),
              'excludedBytes':sum((root/p).stat().st_size for p in ignored),
              'easignoreSha256':hashlib.sha256((root/'.easignore').read_bytes()).hexdigest(),
              'proof':'gitignore-compatible selection and Metro export, not official EAS build:inspect'}
          evidence=Path('/tmp/uskoci-eas-audit')
          (evidence/'file-selection.json').write_text(json.dumps(stats,indent=2)+'\n')
          (evidence/'excluded-paths.txt').write_text('\n'.join(sorted(ignored))+'\n')
          for p in sorted(ignored):
              (root/p).unlink()
          print('EXCLUDED',len(ignored),'FILES',stats['excludedBytes'],'BYTES')
          PY
      - name: Re-export Android from filtered build input, without proof or test files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .expo node_modules/.cache/metro
          node - <<'JS' > /tmp/uskoci-eas-audit/android-filtered.log 2>&1
          const {spawnSync}=require('node:child_process');
          const env={...process.env,...require('./eas.json').build.preview.env,
            EAS_BUILD_PROFILE:'preview',USKOCI_OTA_TARGET:'preview',
            EXPO_NO_TELEMETRY:'1',EXPO_OFFLINE:'1'};
          const result=spawnSync(process.execPath,['node_modules/expo/bin/cli',
            'export','--platform','android','--output-dir','/tmp/uskoci-eas-audit/android-filtered'],
            {env,stdio:'inherit'});
          if(result.error)throw result.error;
          process.exit(result.status??1);
          JS
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          evidence=Path('/tmp/uskoci-eas-audit')
          formats={'.js','.hbc','.png','.jpg','.jpeg','.webp','.svg','.ttf','.woff','.woff2','.gif','.mp4','.mp3'}
          def files(folder):
              root=evidence/folder
              return {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file() and p.suffix.lower() in formats}
          old=files('android-original');new=files('android-filtered')
          if not old or old!=new:
              changed=sorted(set(old)^set(new)|{p for p in old.keys()&new.keys() if old[p]!=new[p]})
              raise SystemExit('RUNTIME_OUTPUT_MISMATCH '+str(changed[:30]))
          (evidence/'android-equality.json').write_text(json.dumps({
              'outputs':len(old),'bitwiseEqual':True,'scope':'Metro JS/assets, not APK or native-device test'},indent=2)+'\n')
          print('BITWISE_EQUAL_ANDROID_OUTPUTS',len(old))
          PY
      - name: Restore original proof corpus; add only EAS ignore and existing plan note
        shell: bash
        run: |
          set -euo pipefail
          git restore --worktree .
          git diff --exit-code
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          stats=json.loads(Path('/tmp/uskoci-eas-audit/file-selection.json').read_text())
          binary=json.loads(Path('/tmp/uskoci-eas-audit/android-equality.json').read_text())
          master=Path('docs/plan/CODEX_PLAN_RADA.md')
          text=master.read_text(encoding='utf-8')
          headline='# USKOČI — jedinstveni plan dovršavanja proizvoda i objavljivanja\n'
          if not text.startswith(headline):raise SystemExit('CODEX_HEADING_CHANGED')
          line=(f'\n> R11 EAS upload, 04.11.2026: root .easignore cuva sva postojeca .gitignore pravila,'
              f' a u EAS prenosu izostavlja dokumentaciju, istorijski SQL/proof/operativne pakete,'
              f' Design Lab i testove. Provera svih pracenih putanja: {stats["beforeTracked"]} pre,'
              f' {stats["excludedTracked"]} iskljuceno ({stats["excludedBytes"]} bajtova),'
              f' {stats["keptTracked"]} zadrzano. Izvrsni Android Metro export pre/posle'
              f' ima {binary["outputs"]} potpuno istih JS/asset SHA-256 izlaza. Nema brisanja'
              f' runtime koda, SQL/DEV promene, niti tvrdnje da je APK manji.'
              f' Ovo nije zvanicni EAS build:inspect, native build ili telefon test.'
              f' [CI dokaz](https://github.com/uskocibusiness-boop/USKOCI-EAN/actions/runs/{os.environ["GITHUB_RUN_ID"]}).\n')
          master.write_text(text.replace(headline,headline+line,1),encoding='utf-8')
          PY
          git rm -- .github/workflows/uskoci-eas-input-once.yml
          git add -- .easignore docs/plan/CODEX_PLAN_RADA.md
          git diff --cached --check
          python3 - <<'PY'
          import subprocess,os
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only',os.environ['BASE_SHA']]).decode().splitlines())
          expected={'.easignore','docs/plan/CODEX_PLAN_RADA.md'}
          if changed!=expected:raise SystemExit('SCOPE_CHANGED '+str(changed^expected))
          PY
      - name: Publish the verified change to the isolated cleanup branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/work/product-cleanup-20261104 | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git config user.name "USKOCI verified EAS cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(r11): exclude non-runtime evidence from EAS input without changing Android output"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/work/product-cleanup-20261104
          git rev-parse HEAD > /tmp/uskoci-eas-audit/published-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uskoci-eas-lean-input-evidence
          path: |
            /tmp/uskoci-eas-audit/*.json
            /tmp/uskoci-eas-audit/*.log
            /tmp/uskoci-eas-audit/*.txt
          retention-days: 14
          if-no-files-found: warn
