# Round51 owns the next source evolution; Round50 is frozen and no longer retriggers on this owner file.
name: P6 view adapter and point members
# Round51 is frozen after its accepted evidence/control commit.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p6-view-adapter-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prove:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Exact checkout and locked dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/p6-view-adapter
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          npm ci
          node --check scripts/proofs/p6-view-adapter-record.cjs
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json
      - name: Focused owner and adapter
        run: npx jest --runInBand --testTimeout=30000 --runTestsByPath src/data/__tests__/discovery-v1-owner.test.ts src/data/__tests__/discovery-v1-marketplace-adapter.test.ts --json --outputFile=/tmp/p6-view-adapter/focused.json
      - name: Existing Discovery regressions
        run: npx jest --runInBand --testTimeout=30000 --runTestsByPath src/data/__tests__/discovery-view.test.ts src/data/__tests__/discovery-map.test.tsx src/data/__tests__/discovery-v1-contract.test.ts src/data/__tests__/discovery-v1-spatial-contract.test.ts --json --outputFile=/tmp/p6-view-adapter/existing.json
      - name: Full regression
        run: npx jest -w 3 --testTimeout=30000 --json --outputFile=/tmp/p6-view-adapter/full.json
      - name: Keep production reader quarantined
        run: |
          if grep -R --line-number --fixed-strings "rpc_discovery_v1" src/app src/data/supabaseIzvor.ts src/data/ports.ts; then exit 1; fi
      - name: Evidence and control
        run: |
          node scripts/proofs/p6-view-adapter-record.cjs record
          node scripts/control/osvezi.mjs > /tmp/p6-view-adapter/control.log 2>&1
          node scripts/proofs/p6-view-adapter-record.cjs verify
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/control/redovi.json docs/control/stanje.json docs/control/FINALIZATION_MATRIX.md docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_51_P6_VIEW_ADAPTER.md docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_51_P6_VIEW_ADAPTER_CHECKS.json
          git add -f docs/control/out/tabla.html
          git commit -m 'docs(control): record P6 view adapter and point-members proof'
      - name: Guarded publication
        run: |
          branch='work/uskoci-ui-unification-20260924'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          node scripts/proofs/p6-view-adapter-record.cjs verify
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > /tmp/p6-view-adapter/published-head.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p6-view-adapter-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/p6-view-adapter/
          if-no-files-found: error
          retention-days: 30
