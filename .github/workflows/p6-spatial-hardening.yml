name: P6 spatial guard regression package
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uskoci-p6-spatial-hardening
  cancel-in-progress: false
jobs:
  prove:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify exact predecessor and write regression tests
        run: |
          mkdir -p outputs/p6-spatial
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/proofs/p6-spatial-hardening.cjs
          node scripts/proofs/p6-spatial-hardening.cjs verify
          node scripts/proofs/p6-spatial-hardening.cjs tests
      - name: Reproduce eight malformed-input acceptances before the fix
        run: |
          set +e
          npx jest --runInBand --testTimeout=30000 --runTestsByPath src/data/__tests__/discovery-v1-spatial-contract.test.ts --json --outputFile=outputs/p6-spatial/before.json > outputs/p6-spatial/before.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          node -e "const r=require('./outputs/p6-spatial/before.json');if(r.numFailedTests!==8||r.numRuntimeErrorTestSuites)throw Error('Invalid red-before evidence');console.log('RED-before:',r.numFailedTests,'assertions; runtime errors:',r.numRuntimeErrorTestSuites);"
      - name: Apply and commit the bounded source before checking
        run: |
          node scripts/proofs/p6-spatial-hardening.cjs apply
          node scripts/proofs/p6-spatial-hardening.cjs verify
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/discoveryV1SpatialContract.ts src/data/__tests__/discovery-v1-spatial-contract.test.ts
          git commit -m 'fix(p6): bind spatial continuations and counts to emitted rows'
          git rev-parse HEAD > outputs/p6-spatial/tested-source.txt
      - name: TypeScript exact committed source
        run: npx tsc --noEmit -p tsconfig.json > outputs/p6-spatial/types.log 2>&1
      - name: Focused P6 wire contracts
        run: |
          npx jest --runInBand --testTimeout=30000 --testPathPatterns='discovery-v1.*contract' --json --outputFile=outputs/p6-spatial/focused.json > outputs/p6-spatial/focused.log 2>&1
      - name: Full regression
        run: npx jest -w 3 --testTimeout=30000 --json --outputFile=outputs/p6-spatial/full.json > outputs/p6-spatial/full.log 2>&1
      - name: Evidence and real tracker generation
        run: |
          node scripts/proofs/p6-spatial-hardening.cjs record
          node scripts/control/osvezi.mjs > outputs/p6-spatial/control.log 2>&1
          node scripts/proofs/p6-spatial-hardening.cjs verify
          git diff --check
          git add docs/control/redovi.json docs/control/stanje.json docs/control/FINALIZATION_MATRIX.md docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_43_P6_SPATIAL_GUARDS.md docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_43_P6_SPATIAL_CHECKS.json
          git add -f docs/control/out/tabla.html
          git commit -m 'docs(control): record P6 spatial guard proof and remaining server gate'
      - name: Fast-forward only on unchanged canonical predecessor
        run: |
          branch='work/uskoci-ui-unification-20260924'
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$GITHUB_SHA"
          node scripts/proofs/p6-spatial-hardening.cjs verify
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > outputs/p6-spatial/published-head.txt
      - name: Preserve exact evidence, including failures and unpublished changes
        if: always()
        run: |
          mkdir -p outputs/p6-spatial
          git diff "$GITHUB_SHA" --binary > outputs/p6-spatial/candidate.patch
          git log -3 --format='%H %s' > outputs/p6-spatial/commits.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p6-spatial-hardening-${{ github.run_id }}
          path: outputs/p6-spatial/
          if-no-files-found: error
          retention-days: 14
