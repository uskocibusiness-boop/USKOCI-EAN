name: P6 client paging owner and stale fencing
# Round50 is a frozen, already-recorded proof. Future owner evolution belongs to a new round.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p6-client-owner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prove:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Exact checkout and locked dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/p6-client-owner
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          npm ci
          node --check scripts/proofs/p6-client-owner-record.cjs
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json
      - name: Focused paging-owner proof
        run: npx jest --runInBand --testTimeout=30000 --runTestsByPath src/data/__tests__/discovery-v1-owner.test.ts --json --outputFile=/tmp/p6-client-owner/focused.json
      - name: Existing strict wire contracts
        run: npx jest --runInBand --testTimeout=30000 --runTestsByPath src/data/__tests__/discovery-v1-contract.test.ts src/data/__tests__/discovery-v1-spatial-contract.test.ts --json --outputFile=/tmp/p6-client-owner/contracts.json
      - name: Full regression
        run: npx jest -w 3 --testTimeout=30000 --json --outputFile=/tmp/p6-client-owner/full.json
      - name: Keep P6 production reader quarantined
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-strings "rpc_discovery_v1" src/app src/data/supabaseIzvor.ts src/data/ports.ts; then
            echo "Partial P6 must not be production-wired before rollout/native gates."
            exit 1
          fi
      - name: Evidence and generated control
        run: |
          set -euo pipefail
          node scripts/proofs/p6-client-owner-record.cjs record
          node scripts/control/osvezi.mjs > /tmp/p6-client-owner/control.log 2>&1
          node scripts/proofs/p6-client-owner-record.cjs verify
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/control/redovi.json docs/control/stanje.json docs/control/FINALIZATION_MATRIX.md docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_50_P6_CLIENT_OWNER.md docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_50_P6_CLIENT_OWNER_CHECKS.json
          git add -f docs/control/out/tabla.html
          git commit -m 'docs(control): record P6 paging owner and stale fencing proof'
      - name: Fast-forward only on unchanged canonical source
        run: |
          set -euo pipefail
          branch='work/uskoci-ui-unification-20260924'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          node scripts/proofs/p6-client-owner-record.cjs verify
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > /tmp/p6-client-owner/published-head.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p6-client-owner-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/p6-client-owner/
          if-no-files-found: error
          retention-days: 30
