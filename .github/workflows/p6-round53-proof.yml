name: P6 bounded overlays and server map seam
# HISTORICAL (2026-09-30): this workflow proved the Round53 overlay and server-marker seam while P6 was quarantined. Its final step asserts
# that the server marker layer is unreachable from DiscoveryMap, which the production reader cutover made obsolete, and it commits evidence to
# the branch. It no longer runs on pushes; run it manually only to reproduce the historical evidence. Current proofs: p6-native-apk.yml,
# p6-native-journey.yml, p6-client-final-check.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p6-round53-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prove:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Exact source and locked dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/p6-round53
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          npm ci
          node --check scripts/proofs/p6-round53-record.cjs
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json
      - name: Focused overlay and server marker seam
        run: npx jest --runInBand --testTimeout=30000 --runTestsByPath src/data/__tests__/discovery-v1-overlay-owner.test.ts src/data/__tests__/discovery-v1-server-marker-layer.test.tsx --json --outputFile=/tmp/p6-round53/focused.json
      - name: Existing P6 and Discovery regressions
        run: npx jest --runInBand --testTimeout=30000 --runTestsByPath src/data/__tests__/discovery-v1-contract.test.ts src/data/__tests__/discovery-v1-spatial-contract.test.ts src/data/__tests__/discovery-v1-owner.test.ts src/data/__tests__/discovery-v1-marketplace-adapter.test.ts src/data/__tests__/discovery-v1-screen-session.test.ts src/data/__tests__/discovery-v1-client-transport.test.ts src/data/__tests__/discovery-presentation.test.tsx --json --outputFile=/tmp/p6-round53/existing.json
      - name: Full regression
        run: npx jest -w 3 --testTimeout=30000 --json --outputFile=/tmp/p6-round53/full.json
      - name: Quarantine remains real
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-strings "rpc_discovery_v1" src/app src/data/supabaseIzvor.ts src/data/ports.ts; then
            echo "P6 production transport is still forbidden."
            exit 1
          fi
          if grep -R --line-number --fixed-strings "DiscoveryV1ServerMarkerLayer" src/app src/ui/v2/DiscoveryMap.tsx src/ui/v2/DiscoveryPresentation.tsx; then
            echo "Server marker layer must remain unreachable in Round53."
            exit 1
          fi
      - name: Evidence and control generation
        run: |
          set -euo pipefail
          node scripts/proofs/p6-round53-record.cjs record
          node scripts/control/osvezi.mjs > /tmp/p6-round53/control.log 2>&1
          node scripts/proofs/p6-round53-record.cjs verify
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/control/redovi.json docs/control/stanje.json docs/control/FINALIZATION_MATRIX.md docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_53_P6_BOUNDED_OVERLAYS_AND_MAP_SEAM.md docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_53_P6_BOUNDED_OVERLAYS_AND_MAP_SEAM_CHECKS.json docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_53_FAIL_36491107610.json docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_53_FAIL_36491390975.json
          git add -f docs/control/out/tabla.html
          git commit -m 'docs(control): record bounded P6 overlays and server map seam'
      - name: Fast-forward only on unchanged canonical source
        run: |
          set -euo pipefail
          branch='work/uskoci-ui-unification-20260924'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          node scripts/proofs/p6-round53-record.cjs verify
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > /tmp/p6-round53/published-head.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p6-round53-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/p6-round53/
          if-no-files-found: error
          retention-days: 30
