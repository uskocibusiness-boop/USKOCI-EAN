name: P5 ready task and matching contract
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/p5-ready-matching-proof.yml'
      - 'src/ui/v2/IntakePresentation.tsx'
      - 'src/ui/workerProfile/WorkerAiPresentation.tsx'
      - 'src/data/__tests__/ai-conversation-layout.test.tsx'
      - 'src/data/__tests__/ai-owned-intake-screen.test.tsx'
      - 'src/ui/workerProfile/__tests__/worker-ai-review.test.tsx'
      - 'src/data/__tests__/p5-matching-field-contract.test.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uskoci-p5-ready-matching
  cancel-in-progress: false
jobs:
  prove:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json
      - name: Focused P5 regression
        run: |
          npx jest -w 3 --testTimeout=30000 --runTestsByPath \
            src/data/__tests__/ai-conversation-layout.test.tsx \
            src/ui/workerProfile/__tests__/worker-ai-review.test.tsx \
            src/data/__tests__/p5-matching-field-contract.test.ts \
            src/data/__tests__/v5-review-screen.test.tsx
      - name: Full Jest
        run: npx jest -w 3 --testTimeout=30000
