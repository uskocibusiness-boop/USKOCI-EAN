name: PostgREST 40001 retry proof

# Registry blocker B24 (docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_74_P6_PHYSICAL_HONOR_CANDIDATE.md): canonical DEV shows one PostgREST session
# re-executing a deterministic MEDIA_VERSION_CONFLICT (SQLSTATE 40001) at about 100 log lines per second for days. This job MEASURES, on a disposable Postgres and a
# disposable PostgREST in docker, whether PostgREST retries a request when the called function raises 40001 and whether that continues after the client has gone,
# against a control function and a non-retryable code. No Supabase project, no secret, no canonical DEV access; it never fails on the measurement itself.
on:
  workflow_dispatch:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/postgrest-40001-retry-proof.yml'
      - 'supabase/proofs/postgrest/**'
permissions:
  contents: read
concurrency:
  group: postgrest-40001-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Measure PostgREST behaviour on SQLSTATE 40001
        run: bash supabase/proofs/postgrest/b24_40001_retry_proof.sh
