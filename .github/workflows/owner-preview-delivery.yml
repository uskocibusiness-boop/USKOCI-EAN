name: Owner bounded source and Android preview
on:
  push:
    branches: [work/rev14-review-f17]
    paths: [.github/workflows/owner-preview-delivery.yml]
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
      actions: read
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.5.6
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41647979080
          name: c10-recovered-source-evidence
          path: ${{ runner.temp }}/input
      - name: Verify exact source and both bounded deltas
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'uskocibusiness-boop/USKOCI-EAN'
          test "$GITHUB_REF" = 'refs/heads/work/rev14-review-f17'
          test "$(git rev-parse HEAD^)" = '3346e1518b85d592c2d4de2ea280e356597caae5'
          python - <<'PY'
          import base64,gzip,hashlib,json,os,subprocess
          from pathlib import Path
          root=Path.cwd(); evidence=Path(os.environ['RUNNER_TEMP'])/'delivery';evidence.mkdir()
          h=lambda b:hashlib.sha256(b).hexdigest()
          first=(Path(os.environ['RUNNER_TEMP'])/'input/c10/delta.json').read_bytes()
          assert h(first)=='d6f9949b2f9f2eaa24a6337a2bf04c584f51f8b80bc3a66449803cecc9324a83'
          ids=['e25aced9f622f0179294e8a492ad46d610c4bb98','062e2afbc7052a11a4fe98ccd84ef938a7706e0b','e844082b47e2e9ca577d3aafe95a0810b9541cbd','dbc1a9c667325ca00e0601b420950be9270bc910']
          parts=[]
          for i,sha in enumerate(ids):
              result=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha]))
              data=base64.b64decode(result['content']);assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              if i==1:
                  assert data.count(b'KSeUV2qK')==1
                  data=data.replace(b'KSeUV2qK',b'KSeUV2q2K')
                  assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='0f20bab54acc6d81dc6e421ea6acb293cf5831c6'
              parts.append(data)
          second=gzip.decompress(base64.b64decode(b''.join(parts),validate=True))
          assert h(second)=='91011357276e569a686c8b329e5ffd4f93611a3621a7a69f56f1c1d63e9b5f26'
          changed=set(subprocess.check_output(['git','diff','--name-only','06d6dd637b3190d3643032dd17a7b3d4f429854f','HEAD'],text=True).splitlines())
          assert changed=={'.github/workflows/'+x for x in ['c10-source-transfer.yml','c10-tested-transfer.yml','c10-transfer-recovery.yml','owner-preview-delivery.yml']},'NEWER_SOURCE_PRESENT'
          final={}
          for raw,count in [(first,19),(second,7)]:
              items=json.loads(raw)['changes'];assert len(items)==count
              for item in items:
                  path=root/item['path'];assert path.resolve().is_relative_to(root) and not item['path'].startswith('.')
                  assert (h(path.read_bytes()) if path.exists() else None)==item['before'],'PREIMAGE:'+item['path']
                  if item['after'] is None:path.unlink()
                  else:
                      if item['before'] is None:content=item['content']
                      else:
                          lines=path.read_text().splitlines(keepends=True)
                          for start,end,replacement in reversed(item['edits']):
                              assert 0<=start<=end<=len(lines);lines[start:end]=replacement
                          content=''.join(lines)
                      data=content.encode();assert h(data)==item['after'],'POSTIMAGE:'+item['path']
                      path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
                  final[item['path']]=item['after']
          assert len(final)==25
          (evidence/'expected.json').write_text(json.dumps(final))
          subprocess.run(['git','add','--',*final],check=True)
          print('VERIFIED_SOURCE_FILES',len(final))
          PY
          git diff --cached --check
      - name: Install exact lockfile dependencies
        run: npm ci
      - name: Intake, configuration and duplicate declaration protection
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=spec --test-concurrency=1 supabase/proofs/ai/intake_module_boundary.test.mjs supabase/proofs/ai/single_pass_edge.test.mjs supabase/proofs/ai/v5_worker_edge.test.mjs supabase/proofs/ai/taxonomy_runtime_config.test.mjs supabase/proofs/dynamic_taxonomy/classification-gemini-shadow-source.test.mjs supabase/proofs/ai/worker_mode_declarations.test.mjs | tee "$RUNNER_TEMP/delivery/intake.log"
      - name: Need context and safety
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=spec supabase/proofs/ai/ai_edge_context.test.mjs | tee "$RUNNER_TEMP/delivery/context.log"
      - name: Complete catalog and ownership
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=spec --test-concurrency=1 supabase/proofs/ai/background_catalog_completeness.test.mjs supabase/proofs/ai/background_catalog_hierarchy.test.mjs supabase/proofs/ai/background_catalog_lifecycle.test.mjs supabase/proofs/ai/background_taxonomy_scope.test.mjs supabase/proofs/ai/background_taxonomy_failures.test.mjs | tee "$RUNNER_TEMP/delivery/catalog.log"
      - name: Continuity, accounting and frozen historical package
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=spec --test-concurrency=1 supabase/proofs/ai/single_pass_continuity.test.mjs supabase/proofs/ai/classification-full-catalog-edge.test.mjs supabase/proofs/ai/ai_accounting_transport.test.mjs supabase/proofs/ai/gemini_usage.test.mjs supabase/proofs/ai/frozen_single_pass_package.test.mjs | tee "$RUNNER_TEMP/delivery/continuity.log"
          node supabase/operations/dev-alpha/r04-single-pass-20261103/edge-package.mjs --check
          npx tsc --noEmit
          deno check --no-config --no-lock --no-npm --no-remote supabase/functions/uskoci-ai-interview/index.ts supabase/functions/uskoci-worker-interview/index.ts
          git diff --exit-code
      - name: Record exact evidence without secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          evidence=Path(os.environ['RUNNER_TEMP'])/'delivery'; expected=json.loads((evidence/'expected.json').read_text()); results={}
          for name in ['intake','context','catalog','continuity']:
              text=re.sub(r'\x1b\[[0-9;]*m','',(evidence/(name+'.log')).read_text())
              result={key:int(re.findall(r'(?:^|\n)[^\n]*?\b'+key+r' (\d+)\s*(?:\n|$)',text)[-1]) for key in ['tests','pass','fail','cancelled','skipped','todo']}
              assert result['fail']==result['cancelled']==result['skipped']==0 and result['pass']>0
              results[name]=result
          for path,sha in expected.items():
              actual=hashlib.sha256(Path(path).read_bytes()).hexdigest() if Path(path).exists() else None
              assert actual==sha,'TEST_MUTATED_SOURCE:'+path
          receipt={'scope':'C10_R04_R08_TARGETED_SOURCE','runId':os.environ['GITHUB_RUN_ID'],'runSource':os.environ['GITHUB_SHA'],'results':results,'typescript':'PASS','denoTwoHandlers':'PASS','frozenHistoricalPackage':'PASS','files':expected,'limitations':['synthetic provider and Auth','not full CI or DEV deployment','no native acceptance'],'devCredentialAvailable':bool(os.environ.get('SUPABASE_ACCESS_TOKEN'))}
          dest=Path('supabase/proofs/ai/c10_mode_delivery_ci_receipt_20261103.json');assert not dest.exists();dest.write_text(json.dumps(receipt,indent=2)+'\n');(evidence/'receipt.json').write_bytes(dest.read_bytes())
          master=Path('docs/plan/CODEX_PLAN_RADA.md');text=master.read_text();lines=text.splitlines(keepends=True)
          lines.insert(1,'> **SOURCE/CI isporuka C10 + R04/R08, 03.11.2026:** ciljani GitHub run '+os.environ['GITHUB_RUN_ID']+' potvrđuje '+str(sum(x['pass'] for x in results.values()))+' PASS, 0 FAIL/0 SKIP, '+str(sum(x['todo'] for x in results.values()))+' postojeći TODO; TypeScript, dva Deno handler-a i istorijski Edge paket PASS. Receipt `supabase/proofs/ai/c10_mode_delivery_ci_receipt_20261103.json`. DEV/novi APK/telefon se ovim ne tvrde; R01/R10 ostaju otvoreni.\n');master.write_text(''.join(lines))
          subprocess.run(['git','add','--',str(dest),str(master)],check=True)
          print('TARGETED_PASS',sum(x['pass'] for x in results.values()),'DEV_CREDENTIAL_AVAILABLE',receipt['devCredentialAvailable'])
          PY
          git diff --cached --check
      - name: Publish only tested source with concurrency guard
        id: publish
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_WRITE_TOKEN" | base64 -w0)"
          remote="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/work/rev14-review-f17 | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ai): reject ambiguous mode changes and retire inactive intake paths'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/work/rev14-review-f17
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "$commit" > "$RUNNER_TEMP/delivery/published-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-source-delivery-evidence
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: warn
          retention-days: 7
  android:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      EAS_BUILD_PROFILE: preview
      USKOCI_OTA_TARGET: preview
      USKOCI_PUSH_PROOF_BUILD: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Load reviewed preview configuration
        run: |
          node - <<'JS'
          const fs=require('fs');const env=require('./eas.json').build.preview.env;
          if(env.EXPO_PUBLIC_P6_DISCOVERY_READER!=='0'||env.EXPO_PUBLIC_USE_FAKE_SOURCE!=='0'||env.USKOCI_OTA_TARGET!=='preview')throw Error('PREVIEW_SCOPE');
          for(const [k,v] of Object.entries(env)){if(!/^[A-Z0-9_]+$/.test(k)||typeof v!=='string'||/[\r\n]/.test(v))throw Error('ENV_INVALID');fs.appendFileSync(process.env.GITHUB_ENV,k+'='+v+'\n');}
          JS
      - name: Install exact dependencies
        run: npm ci --include=dev
      - name: Preview identity and Android prebuild
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const config=require('./app.config.js')({config:require('./app.json').expo});
          if(config.android.package!=='rs.uskoci.preview'||config.runtimeVersion!=='uskoci-v1-preview-r1'||config.updates.requestHeaders['expo-channel-name']!=='preview')throw Error('PREVIEW_IDENTITY');
          JS
          npx expo prebuild --platform android --clean --no-install
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          old=json.loads(subprocess.check_output(['git','show','HEAD:package.json']));new=json.loads(Path('package.json').read_text())
          assert {k:v for k,v in old.items() if k!='scripts'}=={k:v for k,v in new.items() if k!='scripts'},'PREBUILD_DEPENDENCY_DRIFT'
          if old!=new:Path('package.json').write_bytes(subprocess.check_output(['git','show','HEAD:package.json']))
          PY
          git diff --exit-code
          printf '\nreactNativeArchitectures=arm64-v8a\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8\n' >> android/gradle.properties
      - name: Build installable phone APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk"
          cd android
          ./gradlew assembleRelease --no-daemon --max-workers=2 2>&1 | tee "$RUNNER_TEMP/apk/build.log"
      - name: Verify actual APK identity and signing
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk/signature.txt"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk/badging.txt"
          grep -q "name='rs.uskoci.preview'" "$RUNNER_TEMP/apk/badging.txt"
          ! grep -q 'application-debuggable' "$RUNNER_TEMP/apk/badging.txt"
          python - <<'PY'
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path
          src=Path('android/app/build/outputs/apk/release/app-release.apk');out=Path(os.environ['RUNNER_TEMP'])/'apk';commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with zipfile.ZipFile(src) as z:
              assert z.testzip() is None
              arches={x.split('/')[1] for x in z.namelist() if x.startswith('lib/') and x.endswith('.so')}
              assert arches=={'arm64-v8a'},arches
          name='USKOCI-PREVIEW-'+commit[:8]+'-ARM64.apk';dest=out/name;dest.write_bytes(src.read_bytes());digest=hashlib.sha256(dest.read_bytes()).hexdigest()
          (out/(name+'.sha256')).write_text(digest+'  '+name+'\n')
          (out/'apk-receipt.json').write_text(json.dumps({'source':commit,'package':'rs.uskoci.preview','runtime':'uskoci-v1-preview-r1','sha256':digest,'bytes':dest.stat().st_size,'abi':list(arches),'runId':os.environ['GITHUB_RUN_ID'],'signing':'internal preview; not production signing','limitations':['not installed or tested on a physical phone','no user login or two-account E2E','not Firebase push proof','server delivery recorded separately']},indent=2)+'\n')
          print('APK_VERIFIED',name,digest,dest.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: USKOCI-OWNER-PREVIEW-ARM64
          path: ${{ runner.temp }}/apk/
          if-no-files-found: warn
          retention-days: 7
