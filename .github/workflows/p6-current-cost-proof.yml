name: P6 current dependency and measured SQL cost
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p6-current-cost-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-proof:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/p6-discovery-private
      P6_PUBLIC_ARTIFACT_DIR: /tmp/p6-discovery-evidence
      P6_HISTORICAL_PKG045_REPLAY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Bind exact checkout and install locked existing dependencies
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$P6_PUBLIC_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git rev-parse HEAD 'HEAD^{tree}' > "$P6_PUBLIC_ARTIFACT_DIR/source-binding.txt"
          git ls-files -z supabase/migrations supabase/operations/dev-alpha/ledger supabase/candidates supabase/proofs docs/implementation/v5-ai-first .github/workflows/p6-current-cost-proof.yml src/data/marketplaceView.ts src/lib/calendarTime.ts src/lib/location.ts src/lib/market.ts src/ui/calendar/calendarPresentation.ts package.json package-lock.json | xargs -0 sha256sum | sha256sum > "$P6_PUBLIC_ARTIFACT_DIR/source-manifest-sha256.txt"
          dependency_exit=0
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/01-dependencies.log" 2>&1 || dependency_exit=$?
          printf '01-dependencies exit=%s\n' "$dependency_exit" | tee "$P6_PUBLIC_ARTIFACT_DIR/stages.txt"
          test "$dependency_exit" -eq 0
          static_exit=0
          { python3 supabase/migrations/check_migration_integrity.py &&
            node --check supabase/proofs/discovery/p6_discovery_prepare.mjs &&
            node --check supabase/proofs/discovery/p6_discovery_run.mjs &&
            node --check supabase/proofs/discovery/p6_discovery_parity_vectors.mjs;
          } > "$PRE_V3_ARTIFACT_DIR/01-static.log" 2>&1 || static_exit=$?
          printf '01-static exit=%s\n' "$static_exit" | tee -a "$P6_PUBLIC_ARTIFACT_DIR/stages.txt"
          test "$static_exit" -eq 0
          python3 -B -m unittest discover -s supabase/proofs/discovery -p test_p6_cost_parse.py -v > "$P6_PUBLIC_ARTIFACT_DIR/parser-checks.txt" 2>&1
          node --check scripts/proofs/p6-cost-record.cjs
          git diff --quiet
      - name: Reconstruct disposable historical live79
        run: |
          set -euo pipefail
          umask 077
          setup_exit=0
          # Raw local keys remain outside uploaded artifacts.
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/02-live79.log" 2>&1 || setup_exit=$?
          printf '02-live79 exit=%s\n' "$setup_exit" | tee -a "$P6_PUBLIC_ARTIFACT_DIR/stages.txt"
          exit "$setup_exit"
      - name: Guard targets and reconstruct the PKG045 column-grant predecessor
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          try {
            assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL,process.env.RU5_DEVICE_DB_URL);
            if(process.env.DB_URL!==process.env.RU5_DEVICE_DB_URL) throw new Error();
          } catch { console.error('FAIL P6_LOCAL_TARGET_ADMISSION'); process.exit(1); }
          NODE
          run_stage() {
            local stage="$1" status=0
            shift
            printf '%s START\n' "$stage" | tee -a "$P6_PUBLIC_ARTIFACT_DIR/stages.txt"
            "$@" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$stage" "$status" | tee -a "$P6_PUBLIC_ARTIFACT_DIR/stages.txt"
            return "$status"
          }
          # Existing PKG045 replay chain; no PKG046/050/051, A1 or B3 dependency.
          run_stage 03-source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage 04-dev-alpha-to-pkg026 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage 05-pkg027 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage 06-pkg028 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage 07-pkg029 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage 08-pkg030 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage 09-pkg031 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage 10-pkg032 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage 11-pkg033 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage 12-pkg034 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage 13-pkg035 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage 14-pkg037 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage 15-pkg038 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage 16-pkg039 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage 17-pkg040 node supabase/proofs/pkg042/pkg042_proof.mjs replay
      - name: Compare fresh dependency metadata and measure exact target SQL
        run: |
          set -euo pipefail
          umask 077
          proof_exit=0
          python3 -B supabase/proofs/discovery/p6_current_cost.py > "$PRE_V3_ARTIFACT_DIR/19-p6.log" 2>&1 || proof_exit=$?
          printf '19-p6 exit=%s\n' "$proof_exit" | tee -a "$P6_PUBLIC_ARTIFACT_DIR/stages.txt"
          exit "$proof_exit"
      - name: Stop disposable stack without retaining it
        if: always()
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$P6_PUBLIC_ARTIFACT_DIR"
          teardown_exit=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || teardown_exit=$?
          fi
          printf 'teardown exit=%s\n' "$teardown_exit" | tee -a "$P6_PUBLIC_ARTIFACT_DIR/stages.txt"
          exit "$teardown_exit"
      - name: Record scoped results and generate existing tracker
        if: success()
        run: |
          node scripts/proofs/p6-cost-record.cjs record
          node scripts/control/osvezi.mjs > "$PRE_V3_ARTIFACT_DIR/control.log" 2>&1
          node scripts/proofs/p6-cost-record.cjs verify
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/control/redovi.json docs/control/stanje.json docs/control/FINALIZATION_MATRIX.md docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_46_P6_CURRENT_DEPENDENCY_AND_COST.md docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_46_P6_COST_CHECKS.json docs/implementation/product-v1-closure-20260926/finalization-20260927/round46/
          git add -f docs/control/out/tabla.html
          git commit -m 'docs(control): record measured P6 SQL cost and live column rollout boundary'
      - name: Fast-forward only on unchanged canonical HEAD
        if: success()
        run: |
          branch='work/uskoci-ui-unification-20260924'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          node scripts/proofs/p6-cost-record.cjs verify
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > "$P6_PUBLIC_ARTIFACT_DIR/published-head.txt"
      - name: Retain source patch including failed or unpublished results
        if: always()
        run: |
          mkdir -p "$P6_PUBLIC_ARTIFACT_DIR"
          git diff "$GITHUB_SHA" --binary > "$P6_PUBLIC_ARTIFACT_DIR/candidate.patch"
          git log -3 --format='%H %s' > "$P6_PUBLIC_ARTIFACT_DIR/commits.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p6-current-cost-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/p6-discovery-evidence/
          if-no-files-found: error
          retention-days: 30
