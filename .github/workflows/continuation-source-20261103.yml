name: Bounded continuation source 20261103

on:
  push:
    branches: [work/rev14-review-f17]
    paths: [.github/workflows/continuation-source-20261103.yml]

permissions:
  contents: read

jobs:
  source:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d8975895d33dfd0d684f43e09e901e9976fdf8e2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked offline-proof dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package only the already public tracked source and two proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d8975895d33dfd0d684f43e09e901e9976fdf8e2
          mkdir -p "$RUNNER_TEMP/continuation-source"
          git archive --format=tar.gz -o "$RUNNER_TEMP/continuation-source/source.tar.gz" HEAD
          tar -czf "$RUNNER_TEMP/continuation-source/proof-dependencies.tar.gz" node_modules/@electric-sql/pglite node_modules/typescript
          git rev-parse HEAD > "$RUNNER_TEMP/continuation-source/source-sha.txt"
          (cd "$RUNNER_TEMP/continuation-source" && sha256sum source.tar.gz proof-dependencies.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuation-source-d8975895
          path: ${{ runner.temp }}/continuation-source/
          if-no-files-found: error
          retention-days: 1
