name: Build Android push-proof APK

on:
  push:
    branches:
      - work/uskoci-ui-unification-20260924
    paths:
      - 'app.config.js'
      - 'scripts/__tests__/firebase-config.test.ts'
      - 'scripts/ci/attest_push_manifest.py'
      - 'scripts/ci/test_attest_push_manifest.py'
      - 'scripts/ci/attest_ota_preview.py'
      - '.github/workflows/build-android-push-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_PUBLIC_SUPABASE_URL: https://leqcwgzvjsxugfgzdmth.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_o_I-YOn57oPCrIboF0OjPQ_c3DHmOZW
  EXPO_PUBLIC_USE_FAKE_SOURCE: '0'
  EXPO_PUBLIC_AUTH_RECOVERY_REDIRECT_URL: uskociapp://oporavak
  # Match the DEV app features whose readers are already applied on this same project.
  EXPO_PUBLIC_P6_DISCOVERY_READER: '1'
  EXPO_PUBLIC_EX04_OWN_TASKS_PAGED: '1'
  EXPO_PUBLIC_EX04_OWN_APPLICATIONS_PAGED: '1'
  EXPO_PUBLIC_EX04_CANDIDATES_PAGED: '1'
  EXPO_PUBLIC_VOICE_MESSAGES: '1'
  EXPO_PUBLIC_AI_LOCATION_DIALOGUE: '1'
  EXPO_PUBLIC_CONVERSATION_INBOX: '1'
  # Bounded numeric-only trace for the combined phone QA package, never a store build.
  EXPO_PUBLIC_DISCOVERY_TRACE: '1'
  CI: '1'

jobs:
  android-push-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Verify the Reanimated patch (RNR-01)
        run: node scripts/verify-native-patches.cjs

      - name: Prove push-proof config isolation
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm test -- --runInBand scripts/__tests__/firebase-config.test.ts src/data/__tests__/native-push-device.test.ts src/data/__tests__/push-device-client.test.ts src/data/__tests__/push-settings-route.test.tsx
          node <<'NODE'
          const fs=require('fs'), crypto=require('crypto');
          const g=JSON.parse(fs.readFileSync('config/firebase/google-services.json','utf8'));
          const clients=(g.client||[]).map(c=>c.client_info?.android_client_info?.package_name).filter(Boolean);
          if(JSON.stringify(clients)!==JSON.stringify(['rs.uskoci.preview'])) throw new Error('FIREBASE_CLIENT_SCOPE_CHANGED');
          const hash=crypto.createHash('sha256').update(fs.readFileSync('config/firebase/google-services.json')).digest('hex');
          if(hash!=='44d16e473ec04afa35df40fd7fa5eb9d79c6c341f348236355f8098b369fcb91') throw new Error('FIREBASE_PUBLIC_CONFIG_CHANGED');
          NODE

      - name: Resolve exact preview identity for the proof
        env:
          USKOCI_PUSH_PROOF_BUILD: '1'
          NODE_ENV: production
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='app.json', app=JSON.parse(fs.readFileSync(p,'utf8'));
          app.expo.android=app.expo.android||{};
          app.expo.android.package='rs.uskoci.preview';
          app.expo.name='USKOČI PUSH PROOF';
          fs.writeFileSync(p,JSON.stringify(app,null,2)+'\n');
          NODE
          npx expo config --json > /tmp/uskoci-push-proof-config.json
          node <<'NODE'
          const fs=require('fs'), c=JSON.parse(fs.readFileSync('/tmp/uskoci-push-proof-config.json','utf8'));
          const names=(c.plugins||[]).map(p=>Array.isArray(p)?p[0]:p);
          if(c.android?.package!=='rs.uskoci.preview') throw new Error('WRONG_PUSH_PROOF_PACKAGE');
          if(c.android?.googleServicesFile!=='./config/firebase/google-services.json') throw new Error('MISSING_FIREBASE_CLIENT');
          if(names.includes('./plugins/withFirebaseEnrollmentDisabled.js')) throw new Error('PUSH_PROOF_ENROLLMENT_STILL_DISABLED');
          if(!names.includes('expo-notifications')) throw new Error('NOTIFICATIONS_PLUGIN_MISSING');
          NODE

      - name: Generate native Android project
        env:
          USKOCI_PUSH_PROOF_BUILD: '1'
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean

      - name: Verify generated Firebase enrollment inputs
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/ci -p 'test_attest_push_manifest.py'
          cmp config/firebase/google-services.json android/app/google-services.json
          if grep -R -n 'firebase_messaging_auto_init_enabled.*false' android/app/src/main android/app 2>/dev/null; then
            echo 'Push proof still disables Firebase Messaging auto-init'
            exit 1
          fi
          grep -q 'com.google.gms.google-services' android/app/build.gradle

      - name: Build ARM64 release APK
        working-directory: android
        env:
          USKOCI_PUSH_PROOF_BUILD: '1'
          EAS_BUILD_PROFILE: preview
          USKOCI_OTA_TARGET: preview
          NODE_ENV: production
        run: |
          printf '\nreactNativeArchitectures=arm64-v8a\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8\n' >> gradle.properties
          ./gradlew assembleRelease --no-daemon --max-workers=2 -x lintVitalAnalyzeRelease

      - name: Attest actual APK package and Firebase Messaging merge
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk USKOCI-PUSH-PROOF.apk
          sha256sum USKOCI-PUSH-PROOF.apk > USKOCI-PUSH-PROOF.apk.sha256
          APKS=$(find "$ANDROID_HOME" -type f -name apkanalyzer | sort -V | tail -1)
          test -n "$APKS"
          "$APKS" manifest print USKOCI-PUSH-PROOF.apk > /tmp/push-proof-manifest.xml
          # application-id reparses apkanalyzer's own invalid XML when an Expo header contains JSON quotes.
          # The existing OTA attestor handles that exact renderer case; still inspect the compiled APK.
          python3 scripts/ci/attest_push_manifest.py /tmp/push-proof-manifest.xml
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const apk=fs.readFileSync('USKOCI-PUSH-PROOF.apk');
          const cfg=JSON.parse(fs.readFileSync('/tmp/uskoci-push-proof-config.json','utf8'));
          const receipt={
            status:'PUSH_CAPABLE_APK_BUILT_DEVICE_PENDING',
            source:process.env.GITHUB_SHA,
            tree:cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),
            workflowRunId:Number(process.env.GITHUB_RUN_ID),
            package:'rs.uskoci.preview',
            firebaseProject:'uskoci-ed59b',
            expoProjectId:cfg.extra?.eas?.projectId??null,
            apkSha256:crypto.createHash('sha256').update(apk).digest('hex'),
            apkBytes:apk.length,
            firebaseMessagingIntentPresent:true,
            firebaseAutoInitExplicitlyDisabled:false,
            devApplied:false,edgeApplied:false,pushSent:false,deviceInstalled:false
          };
          fs.writeFileSync('USKOCI-PUSH-PROOF-attestation.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
          cat USKOCI-PUSH-PROOF-attestation.json

      - name: Upload push-proof APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: USKOCI-PUSH-PROOF-APK
          retention-days: 14
          path: |
            USKOCI-PUSH-PROOF.apk
            USKOCI-PUSH-PROOF.apk.sha256
            USKOCI-PUSH-PROOF-attestation.json

      - name: Preserve unverified APK diagnostics after an attestation failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: USKOCI-PUSH-PROOF-UNVERIFIED
          retention-days: 7
          if-no-files-found: ignore
          path: |
            USKOCI-PUSH-PROOF.apk
            USKOCI-PUSH-PROOF.apk.sha256
            /tmp/push-proof-manifest.xml
