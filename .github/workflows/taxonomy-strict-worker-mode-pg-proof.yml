name: Strict worker execution mode disposable proof
on:
  pull_request:
    paths:
      - 'supabase/candidates/dynamic-taxonomy-20261011/taxonomy-strict-worker-mode-v1.sql'
      - 'supabase/candidates/dynamic-taxonomy-20261011/worker-need-fit-strict-scope-v1.sql'
      - 'supabase/candidates/dynamic-taxonomy-20261011/disposable-strict-mode-*.sql'
      - '.github/workflows/taxonomy-strict-worker-mode-pg-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16','17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Create disposable canonical taxonomy and mocked save receipts
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/catalog-foundation.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-owner-admission-fixture.sql
      - name: Create strictly private and disabled per-skill scope gate
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/taxonomy-strict-worker-mode-v1.sql
      - name: Create one reviewed worker and two distinct services
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-strict-mode-fixture.sql
      - name: Prove no implicit mode, stale revision, withdrawn skill or unsaved source match
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-strict-mode-assert.sql
      - name: Require actual matcher integration to stay behind disabled-by-default control
        run: |
          grep -q 'taxonomy_match_scope_control_v1' supabase/candidates/dynamic-taxonomy-20261011/worker-need-fit-strict-scope-v1.sql
          grep -q 'taxonomy_scope_eligible_v1(n.id,p.account_id)' supabase/candidates/dynamic-taxonomy-20261011/worker-need-fit-strict-scope-v1.sql
