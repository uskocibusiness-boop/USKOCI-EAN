name: AI category matching source safety
on:
  pull_request:
    paths:
      - '.github/workflows/match-category-fallback-proof.yml'
      - 'supabase/candidates/match-category-fallback-20261010/**'
      - 'supabase/proofs/match_category_fallback/**'
  push:
    branches: [fix/match-ai-category-fallback-20261010]
    paths:
      - '.github/workflows/match-category-fallback-proof.yml'
      - 'supabase/candidates/match-category-fallback-20261010/**'
      - 'supabase/proofs/match_category_fallback/**'
permissions:
  contents: read
jobs:
  source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Source hash, exact scoped patch and rollback proof (NO DB)
        run: node --test supabase/proofs/match_category_fallback/source.test.mjs


  disposable-postgresql:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic_disposable_only
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Actual PostgreSQL before, candidate, rollback, and re-apply (synthetic only)
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          root=supabase/proofs/match_category_fallback
          sql_dir=supabase/candidates/match-category-fallback-20261010
          run_pg () {
            docker exec -i "$PG_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1
          }
          extract_definition () {
            awk '/^CREATE OR REPLACE FUNCTION private[.]worker_need_fit_v1[(]/ { printing=1 }
              printing { print }
              printing && /^\$function\$;$/ { exit }' "$1" > "$RUNNER_TEMP/match-category-function.sql"
            grep -qF '$function$;' "$RUNNER_TEMP/match-category-function.sql"
            test "$(grep -c 'CREATE OR REPLACE FUNCTION private.worker_need_fit_v1' "$RUNNER_TEMP/match-category-function.sql")" -eq 1
          }
          echo 'STAGE 1: disposable schema, fake user fixtures and real 11-kind helper'
          run_pg < "$root/disposable-schema.sql"
          run_pg < "$root/live-work-kinds-v5.sql"
          echo 'STAGE 2: real canonical predecessor, reproduce over-broad matching'
          extract_definition "$sql_dir/revert.sql"
          run_pg < "$RUNNER_TEMP/match-category-function.sql"
          echo 'Load actual canonical cheap dispatch and match wrapper (synthetic fixtures only)'
          run_pg < "$root/live-dispatch-prefilter.sql"
          run_pg < "$root/baseline-assert.sql"
          echo 'STAGE 3: real candidate SQL; service, area, time, exclusions, first-refusal'
          extract_definition "$sql_dir/candidate.sql"
          run_pg < "$RUNNER_TEMP/match-category-function.sql"
          run_pg < "$root/candidate-assert.sql"
          run_pg < "$root/dispatch-prefilter-assert.sql"
          echo 'STAGE 4: exact revert must recover canonical predecessor'
          extract_definition "$sql_dir/revert.sql"
          run_pg < "$RUNNER_TEMP/match-category-function.sql"
          run_pg < "$root/baseline-assert.sql"
          echo 'STAGE 5: reapply candidate and ensure results are deterministic'
          extract_definition "$sql_dir/candidate.sql"
          run_pg < "$RUNNER_TEMP/match-category-function.sql"
          run_pg < "$root/candidate-assert.sql"
          run_pg < "$root/dispatch-prefilter-assert.sql"
          echo 'STAGE 6: full guarded candidate + exact guarded revert SQL transactions'
          extract_definition "$sql_dir/revert.sql"
          run_pg < "$RUNNER_TEMP/match-category-function.sql"
          run_pg < "$root/baseline-assert.sql"
          run_pg < "$sql_dir/candidate.sql"
          run_pg < "$root/candidate-assert.sql"
          run_pg < "$root/dispatch-prefilter-assert.sql"
          run_pg < "$sql_dir/revert.sql"
          run_pg < "$root/baseline-assert.sql"
          echo 'ISOLATED_SQL_PROOF_PASS; production Supabase NOT accessed'
