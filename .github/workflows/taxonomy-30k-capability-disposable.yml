name: Dynamic taxonomy 30k records capability scale proof
on:
  pull_request:
    paths:
      - '.github/workflows/taxonomy-30k-capability-disposable.yml'
      - 'supabase/candidates/dynamic-taxonomy-20261011/disposable-30k-capabilities.sql'
  push:
    branches: [fix/match-ai-category-fallback-20261010]
    paths:
      - '.github/workflows/taxonomy-30k-capability-disposable.yml'
      - 'supabase/candidates/dynamic-taxonomy-20261011/disposable-30k-capabilities.sql'
permissions:
  contents: read
jobs:
  capability-catalog-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Build locked catalog with no external systems
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -1 -f supabase/candidates/dynamic-taxonomy-20261011/dev-dark-launch-locked.sql
      - name: Load 60 varied services and 20k worker plus 10k task revision capability records
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-30k-capabilities.sql
      - name: Assert the feature flag never flipped and provider wasn't called
        run: |
          psql -X -v ON_ERROR_STOP=1 -Atc "SELECT CASE WHEN NOT auto_registration_enabled AND
            (SELECT count(*) FROM private.work_taxonomy_worker_capabilities)=20000
            AND (SELECT count(*) FROM private.work_taxonomy_need_snapshots)=10000
            THEN 'TAXONOMY_30K_RECORDS_CAPABILITY_PROOF_PASS' ELSE
            'TAXONOMY_30K_RECORDS_CAPABILITY_PROOF_FAIL' END
            FROM private.work_taxonomy_control WHERE singleton" | tee /tmp/proof.log
          grep -q '^TAXONOMY_30K_RECORDS_CAPABILITY_PROOF_PASS$' /tmp/proof.log
