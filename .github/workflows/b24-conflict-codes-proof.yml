name: B24 conflict codes proof

# Registry blocker B24 (docs/implementation/product-v1-closure-20260926/finalization-20260927/b24/B24_IMPACT.md): PostgREST 14 re-executes a request whose function raises SQLSTATE 40001
# without end. The candidates under supabase/candidates/b24_nonretried_conflicts_*.sql turn the 110 deterministic conflict raises of the 68 live functions into PT409. This job runs
# them on a DISPOSABLE Postgres 17 + PostgREST 14.5 in docker against a stand-in of the 68 functions and of the certificate machinery (no Supabase project, no secret, no canonical DEV
# access): the defect before (never answers, keeps running after the client has gone), exactly the classified sites converted, nothing else moved, the certificate re-bound by part 2
# only, 409 at once after, refusal to run twice, byte-for-byte reverts. It never applies anything anywhere.
on:
  workflow_dispatch:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - 'supabase/candidates/b24_nonretried_conflicts_*.sql'
      - 'supabase/proofs/b24/**'
      - '.github/workflows/b24-conflict-codes-proof.yml'
permissions:
  contents: read
concurrency:
  group: b24-conflict-codes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mechanics:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      B24_ARTIFACT_DIR: /tmp/b24-mechanics
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: The committed candidates equal what the inventory generates
        run: python3 supabase/proofs/b24/build_b24_candidates.py --check
      - name: Prove the mechanics and the PostgREST behaviour
        run: python3 supabase/proofs/b24/b24_mechanics_proof.py | tee /tmp/b24-mechanics-console.txt
      - name: Step summary
        if: always()
        run: |
          mkdir -p "$B24_ARTIFACT_DIR"
          { echo '## B24 mechanics proof'; echo; echo '```'; tail -60 /tmp/b24-mechanics-console.txt 2>/dev/null | cut -c1-300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b24-mechanics-${{ github.sha }}
          path: /tmp/b24-mechanics/
          if-no-files-found: warn
          retention-days: 30
