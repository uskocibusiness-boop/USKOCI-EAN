name: USKOCI private taxonomy locked DEV staging proof
on:
  pull_request:
    paths:
      - '.github/workflows/taxonomy-dark-launch-locked-pg-proof.yml'
      - 'supabase/candidates/dynamic-taxonomy-20261011/dev-dark-launch-locked.sql'
      - 'supabase/candidates/dynamic-taxonomy-20261011/dark-launch-assert.sql'
  push:
    branches: [fix/match-ai-category-fallback-20261010]
    paths:
      - '.github/workflows/taxonomy-dark-launch-locked-pg-proof.yml'
      - 'supabase/candidates/dynamic-taxonomy-20261011/dev-dark-launch-locked.sql'
      - 'supabase/candidates/dynamic-taxonomy-20261011/dark-launch-assert.sql'
permissions:
  contents: read
jobs:
  private-catalog-dark-launch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16','17']
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Prepare roles and disposable needs table
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-fixture.sql
      - name: Install the EXACT guarded dark-launch file in a transaction
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -1 -f supabase/candidates/dynamic-taxonomy-20261011/dev-dark-launch-locked.sql
      - name: Prove server preview works but registration, user authority, DML and push remain disabled
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/dark-launch-assert.sql
      - name: Prove a repeat install fails closed without changing data
        run: |
          set -euo pipefail
          if psql -X -v ON_ERROR_STOP=1 -1 -f supabase/candidates/dynamic-taxonomy-20261011/dev-dark-launch-locked.sql > /tmp/second-run.out 2>&1; then
            echo 'BAD: duplicate install did not fail closed'; exit 1
          fi
          grep -q 'USKOCI_TAXONOMY_PARTIALLY_PRESENT_NO_AUTOMATIC_UPGRADE' /tmp/second-run.out
          psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/dark-launch-assert.sql
          echo 'TAXONOMY_PRIVATE_DARK_LAUNCH_PROOF_PASS; no Supabase credentials, API or provider'
