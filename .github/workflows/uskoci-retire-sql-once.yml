name: USKOCI retire verified applied SQL candidates
# The one-shot inventory does not count its own candidate-name literals as runtime references.

on:
  push:
    branches: [work/product-cleanup-20261104]
    paths: [.github/workflows/uskoci-retire-sql-once.yml]

permissions:
  contents: read

jobs:
  verify-and-retire:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/product-cleanup-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      BASE_SHA: 127c3e0b3c96d629578a95b222b6726433a3150c
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Inventory all applied candidates and stage only unreferenced whole packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/uskoci-sql-cleanup
          python3 scripts/retire_applied_sql_once.py > /tmp/uskoci-sql-cleanup/selection.log
          git diff --check
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('docs/continuation/ARHIVIRANI_APPLIED_KANDIDATI_20261104.json')
          r=json.loads(p.read_text())
          print('REMOVED',len(r['removed']),'FILES',r['removedBytes'],'BYTES')
          for folder in r['checkedFolders']:
              print('FOLDER',folder['folder'],'retired=',folder['retired'],
                    'activeReferences=',len(folder['activeOrTestExternalReferences']))
          assert r['removed'] and r['removedBytes']>0
          PY
      - name: Install exactly locked app dependencies and run TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm ci > /tmp/uskoci-sql-cleanup/npm-ci.log 2>&1
          ./node_modules/.bin/tsc --noEmit > /tmp/uskoci-sql-cleanup/typescript.log 2>&1
      - name: Full mobile regression including moved AI intake tests
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --maxWorkers=2 --silent --json --outputFile /tmp/uskoci-sql-cleanup/jest.json > /tmp/uskoci-sql-cleanup/jest.log 2>&1
          node - <<'JS'
          const a=require('/tmp/uskoci-sql-cleanup/jest.json');
          if(!a.success||a.numFailedTestSuites!==0||a.numFailedTests!==0) throw Error('MOBILE_TESTS_FAILED');
          for(const f of ['aiDownLine.test.ts','aiInterviewWelcome.test.ts'])
            if(!a.testResults.some(x=>x.name.endsWith('/tests/ai/__tests__/'+f)&&x.status==='passed'))throw Error('RELOCATED_TEST_MISSING '+f);
          console.log(JSON.stringify({suites:a.numTotalTestSuites,tests:a.numTotalTests,passed:a.numPassedTests,pending:a.numPendingTests}));
          JS
      - name: Server proofs with actual source, no live DEV writes
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=spec supabase/proofs/ai/*.test.mjs > /tmp/uskoci-sql-cleanup/ai-node.log 2>&1
          node --test --test-reporter=spec supabase/proofs/match_category_fallback/source.test.mjs > /tmp/uskoci-sql-cleanup/match-node.log 2>&1
          node --test --test-reporter=spec supabase/proofs/dynamic_taxonomy/worker-interview-question-policy.test.mjs > /tmp/uskoci-sql-cleanup/taxonomy-node.log 2>&1
          node --test --test-reporter=spec supabase/proofs/privacy/r01_future_public_default_grants.test.mjs > /tmp/uskoci-sql-cleanup/privacy-node.log 2>&1
          node supabase/operations/dev-alpha/r04-single-pass-20261103/build.mjs --check > /tmp/uskoci-sql-cleanup/edge-package.log 2>&1
          node supabase/operations/dev-alpha/r04-single-pass-20261103/edge-package.mjs --check >> /tmp/uskoci-sql-cleanup/edge-package.log 2>&1
      - name: Android Metro preview bundle does not depend on retired candidates
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS' > /tmp/uskoci-sql-cleanup/android-export.log 2>&1
          const {spawnSync}=require('node:child_process');
          const env={...process.env,...require('./eas.json').build.preview.env,
             EAS_BUILD_PROFILE:'preview',USKOCI_OTA_TARGET:'preview',EXPO_NO_TELEMETRY:'1',EXPO_OFFLINE:'1'};
          const x=spawnSync(process.execPath,
             ['node_modules/expo/bin/cli','export','--platform','android',
              '--output-dir','/tmp/uskoci-sql-cleanup/android-export'],{env,stdio:'inherit'});
          if(x.error)throw x.error;process.exit(x.status??1);
          JS
      - name: Guard final scope and publish only isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git rm -- scripts/retire_applied_sql_once.py .github/workflows/uskoci-retire-sql-once.yml
          git add -- docs/plan/CODEX_PLAN_RADA.md docs/continuation/ARHIVIRANI_APPLIED_KANDIDATI_20261104.json docs/continuation/ARHIVIRANI_APPLIED_KANDIDATI_20261104.md
          git diff --cached --check
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          f='docs/continuation/ARHIVIRANI_APPLIED_KANDIDATI_20261104.json'
          j=json.loads(pathlib.Path(f).read_text())
          removed={x['path'] for x in j['removed']}
          expected=removed|{'docs/plan/CODEX_PLAN_RADA.md',
             f,'docs/continuation/ARHIVIRANI_APPLIED_KANDIDATI_20261104.md'}
          diff=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA']]).decode().splitlines())
          if diff!=expected: raise SystemExit('FINAL_SCOPE_CHANGED '+repr(sorted(diff^expected)))
          count=len([x for x in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if x])
          if count!=3922-len(removed)+2: raise SystemExit('UNEXPECTED_COUNT '+str(count))
          assert all(path.startswith('supabase/candidates/') for path in removed)
          # Originals still recoverable from full Git history at immutable BASE.
          for x in j['removed']:
              if subprocess.check_output(['git','show',os.environ['BASE_SHA']+':'+x['path']]) is None:
                  raise SystemExit('MISSING_ORIGINAL '+x['path'])
          tests=json.loads(pathlib.Path('/tmp/uskoci-sql-cleanup/jest.json').read_text())
          out={'date':'2026-11-04','source':os.environ['BASE_SHA'],
               'workflow':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],
               'filesBefore':3922,'filesAfter':count,'oldCandidateFilesRemoved':len(removed),
               'removedBytes':j['removedBytes'],
               'retiredFolders':[x['folder'] for x in j['checkedFolders'] if x['retired']],
               'preservedFolders':[x['folder'] for x in j['checkedFolders'] if not x['retired']],
               'mobileTests':tests.numTotalTests if False else tests['numTotalTests'],
               'mobilePassed':tests['numPassedTests'],
               'runtimeChanged':False,'edgeDeploy':False,'databaseChanged':False,
               'notProven':['All candidate directories reviewed semantically',
                            'Real Gemini, phone or two-account E2E',
                            'APK size reduction from repository cleanup']}
          pathlib.Path('/tmp/uskoci-sql-cleanup/final-proof.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY
          remote=$(git ls-remote origin refs/heads/work/product-cleanup-20261104 | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git config user.name "USKOCI verified cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(r11): archive unreferenced applied SQL candidate packages"
          token=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $token" push origin HEAD:refs/heads/work/product-cleanup-20261104
          git rev-parse HEAD > /tmp/uskoci-sql-cleanup/published-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uskoci-sql-cleanup-verification
          path: |
            /tmp/uskoci-sql-cleanup/*.json
            /tmp/uskoci-sql-cleanup/*.log
            /tmp/uskoci-sql-cleanup/*.txt
          retention-days: 14
          if-no-files-found: warn
