name: OTA bundle runtime and feature safety
on:
  pull_request:
    paths:
      - 'scripts/ota-release-preflight.cjs'
      - 'scripts/ota-regression-evidence.cjs'
      - 'scripts/__tests__/ota-regression-evidence.test.cjs'
      - '.github/workflows/dev-android-preview-ota-20261014.yml'
      - 'scripts/__tests__/ota-release-preflight.test.cjs'
      - 'scripts/ota-preview-guard.cjs'
      - 'app.config.js'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - '.github/workflows/ota-bundle-safety-proof.yml'
  push:
    branches: [fix/match-ai-category-fallback-20261010]
    paths:
      - 'scripts/ota-release-preflight.cjs'
      - 'scripts/__tests__/ota-release-preflight.test.cjs'
      - 'scripts/ota-preview-guard.cjs'
      - 'app.config.js'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - '.github/workflows/ota-bundle-safety-proof.yml'
permissions:
  contents: read
jobs:
  verify-preview-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check preview OTA plan without bundling or publishing
        run: node scripts/ota-release-preflight.cjs --target preview --plan-only
      - name: Negative tests for OTA runtime, flags and DEV production target
        run: node --test scripts/__tests__/ota-release-preflight.test.cjs
      - name: Exact native baseline and regression proof consistency
        run: node --test scripts/__tests__/ota-regression-evidence.test.cjs
