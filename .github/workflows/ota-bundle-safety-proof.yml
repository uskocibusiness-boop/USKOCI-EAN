# One-time operational bridge for the previously approved DEV preview OTA only.
# Runs from an isolated operations branch; the protected publication workflow
# still performs its full exact-source regression, native and EAS environment gates.
name: One-time approved DEV preview OTA dispatch
on:
  push:
    branches: [operations/phase-a-preview-ota-20261022]
    paths:
      - '.github/workflows/ota-bundle-safety-proof.yml'
permissions:
  contents: read
  actions: write
jobs:
  dispatch-approved-preview:
    if: ${{ github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/operations/phase-a-preview-ota-20261022' && github.event.head_commit.message == 'ops: invoke owner-approved exact-source DEV preview OTA' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET_SHA: fcef803e719ba5663f6cfd8fbd5a601e08a3479b
      TARGET_BRANCH: feature/unified-qa-master-20261017
      REGRESSION_RUN_ID: '39781869336'
    steps:
      - name: Verify exact master and successful source-locked regression
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GH_REPO/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')"
          test "$sha" = "$TARGET_SHA" || { echo "::error::source moved; refusing dispatch"; exit 1; }
          gh api "repos/$GH_REPO/actions/runs/$REGRESSION_RUN_ID" \
            --jq '[.head_sha,.head_branch,.path,.status,.conclusion,.event,.repository.full_name,.head_repository.full_name] | @tsv' \
            | grep -Fx "$TARGET_SHA"$'\\t'"$TARGET_BRANCH"$'\\t''.github/workflows/build-latest-v5-preview-apk.yml'$'\\t''completed'$'\\t''success'$'\\t''push'$'\\t'"$GH_REPO"$'\\t'"$GH_REPO"
          gh api "repos/$GH_REPO/actions/runs/$REGRESSION_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '[.jobs[] | select(.name=="android" and .status=="completed" and .conclusion=="success") | .steps[] | select(.conclusion=="success") | .name] | index("Full regression suite") != null and index("TypeScript") != null and index("Current source ownership") != null' \
            | grep -Fx true
      - name: Dispatch protected existing workflow exactly once
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/actions/workflows/dev-android-preview-ota-20261014.yml/runs?event=workflow_dispatch&per_page=60" \
              --jq '.workflow_runs[] | select(.head_sha==env.TARGET_SHA) | .id' | grep -q '^[0-9]'; then
            echo "An OTA dispatch already exists for this immutable SHA; not triggering a duplicate."
            exit 0
          fi
          gh api -X POST "repos/$GH_REPO/actions/workflows/dev-android-preview-ota-20261014.yml/dispatches" \
            -f "ref=$TARGET_BRANCH" \
            -f "inputs[source_sha]=$TARGET_SHA" \
            -f "inputs[regression_run_id]=$REGRESSION_RUN_ID"
          echo "Requested protected DEV preview OTA for exact SHA $TARGET_SHA, regression $REGRESSION_RUN_ID."
