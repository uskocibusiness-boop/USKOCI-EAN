name: Signed Need review client compatibility
on:
  pull_request:
    paths:
      - 'src/data/aiTaskReviewClientService.ts'
      - 'src/data/__tests__/ai-task-review-client.test.ts'
      - 'supabase/candidates/dynamic-taxonomy-20261011/need-review-signed-classification-v1.sql'
      - '.github/workflows/taxonomy-review-client-compat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-review-decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without native postinstall
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check old review + signed category identity contract
        run: npx jest src/data/__tests__/ai-task-review-client.test.ts --runInBand --silent
      - name: Type-check the complete React Native client contracts
        run: npx tsc --noEmit --pretty false
