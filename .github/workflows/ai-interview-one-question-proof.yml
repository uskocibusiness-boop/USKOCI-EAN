name: AI interview one-question and voice regression
on:
  push:
    branches: [work/ai-single-question-voice-20261022]
    paths:
      - 'supabase/functions/_shared/interviewVoiceInstruction.mjs'
      - 'supabase/functions/uskoci-ai-interview/index.ts'
      - 'supabase/functions/uskoci-worker-interview/index.ts'
      - 'supabase/proofs/ai/interview_voice_one_question.test.mjs'
      - 'supabase/proofs/ai/ai_edge_context.test.mjs'
      - 'supabase/proofs/ai/v5_worker_edge.test.mjs'
      - '.github/workflows/ai-interview-one-question-proof.yml'
  pull_request:
    paths:
      - 'supabase/proofs/ai/v5_ai_stream.test.mjs'
      - '.github/workflows/ai-interview-one-question-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-one-question-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Exact source and locked install
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci
          git diff --check
      - name: Full TypeScript
        run: npx tsc --noEmit -p tsconfig.json
      - name: Shared voice and exact-source mocked Edge tests
        run: |
          node --test \
            supabase/proofs/ai/interview_voice_one_question.test.mjs \
            supabase/proofs/ai/ai_edge_context.test.mjs \
            supabase/proofs/ai/v5_worker_edge.test.mjs \
            supabase/proofs/ai/v5_ai_stream.test.mjs
      - name: Full mobile Jest regression
        run: npx jest --maxWorkers=3 --testTimeout=30000
