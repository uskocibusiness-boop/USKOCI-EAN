name: P6 native journey (disposable restricted server + x86_64 emulator)

# Native acceptance of the P6 Discovery reader on a DISPOSABLE server that already has the PKG045b restricted Need ACL,
# the exact frozen P6 rollout and the proven visibility + PLACES cost layers. Real local Auth, RLS on, no canonical DEV.
# The proof APK is built once by p6-native-apk.yml; the run id is recorded in supabase/proofs/discovery/p6_native_apk_run.txt
# and the journey mode (probe | full) in p6_native_journey_mode.txt, so a driver-only change never rebuilds the APK.
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/p6-native-journey.yml'
      - 'scripts/p6_native_journey.py'
      - 'scripts/p6_run_native_journey.sh'
      - 'supabase/proofs/discovery/p6_native_fixture.mjs'
      - 'supabase/proofs/discovery/p6_native_apk_run.txt'
      - 'supabase/proofs/discovery/p6_native_journey_mode.txt'
      - 'supabase/proofs/discovery/p6_native_journey_steps.txt'
permissions:
  contents: read
  actions: read
concurrency:
  group: p6-native-journey-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journey:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/p6-discovery-private
      P6_PUBLIC_ARTIFACT_DIR: /tmp/p6-discovery-evidence
      P6_HISTORICAL_PKG045_REPLAY: '1'
      P6N_ARTIFACT_DIR: artifacts/p6-native
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Read the recorded APK run and journey mode
        run: |
          set -euo pipefail
          apk_run="$(tr -d '[:space:]' < supabase/proofs/discovery/p6_native_apk_run.txt)"
          mode="$(tr -d '[:space:]' < supabase/proofs/discovery/p6_native_journey_mode.txt)"
          [[ "$apk_run" =~ ^[0-9]+$ ]] || { echo "p6_native_apk_run.txt must hold a run id"; exit 1; }
          [[ "$mode" =~ ^(probe|full)$ ]] || { echo "p6_native_journey_mode.txt must be probe or full"; exit 1; }
          # Optional focused run: step names (login always). Empty = the whole journey, the only acceptance run.
          steps="$(tr '\r\n,' '   ' < supabase/proofs/discovery/p6_native_journey_steps.txt 2>/dev/null | tr -s ' ' | sed 's/^ //; s/ $//' || true)"
          [[ -z "$steps" || "$steps" =~ ^[a-z_]+( [a-z_]+)*$ ]] || { echo "p6_native_journey_steps.txt must hold step names"; exit 1; }
          echo "P6N_APK_RUN=$apk_run" >> "$GITHUB_ENV"
          echo "P6N_JOURNEY=$mode" >> "$GITHUB_ENV"
          echo "P6N_STEPS=$steps" >> "$GITHUB_ENV"
      - name: Download and verify the proof APK
        run: |
          set -euo pipefail
          mkdir -p /tmp/p6-native-apk
          gh run download "$P6N_APK_RUN" --repo "$GITHUB_REPOSITORY" -n p6-native-apk-x86_64 -D /tmp/p6-native-apk
          (cd /tmp/p6-native-apk && sha256sum -c USKOCI-P6-NATIVE-x86_64.apk.sha256)
          grep -F "package: name='rs.uskoci.dev'" /tmp/p6-native-apk/badging.txt
          apk_sha="$(tr -d '[:space:]' < /tmp/p6-native-apk/apk-source.txt)"
          git cat-file -e "$apk_sha^{commit}"
          drift="$(git diff --name-only "$apk_sha" HEAD -- src assets app.json app.config.js package.json package-lock.json babel.config.js metro.config.js index.js || true)"
          if [[ -n "$drift" ]]; then echo "Client source moved since the APK build ($apk_sha):"; echo "$drift"; echo "Rebuild the APK (touch p6_native_apk_build.txt) and record its run id."; exit 1; fi
          echo "P6N_APK_SOURCE=$apk_sha" >> "$GITHUB_ENV"
          # An APK run recorded before flavours existed is a proof-flavour build.
          flavor="proof"; [[ -f /tmp/p6-native-apk/flavor.txt ]] && flavor="$(tr -d '[:space:]' < /tmp/p6-native-apk/flavor.txt)"
          recorded="$(tr -d '[:space:]' < supabase/proofs/discovery/p6_native_apk_flavor.txt)"
          [[ "$flavor" == "$recorded" ]] || { echo "APK flavour ($flavor) differs from p6_native_apk_flavor.txt ($recorded): record the matching APK run"; exit 1; }
          echo "P6N_ROUTE=$flavor" >> "$GITHUB_ENV"
          echo "PASS P6_NATIVE_APK_BOUND run=$P6N_APK_RUN source=$apk_sha no_client_source_drift"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Exact source and locked dependencies
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$P6_PUBLIC_ARTIFACT_DIR" "$P6N_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/dependencies.log" 2>&1
          python3 supabase/migrations/check_migration_integrity.py > "$PRE_V3_ARTIFACT_DIR/integrity.log" 2>&1
          python3 -m py_compile scripts/p6_native_journey.py scripts/ru5_android_device_ui_journey.py
          node --check supabase/proofs/discovery/p6_native_fixture.mjs
      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/live79.log" 2>&1
      - name: Replay predecessor through PKG045b
        run: |
          set -euo pipefail
          run_stage() { local label="$1"; shift; "$@" > "$PRE_V3_ARTIFACT_DIR/$label.log" 2>&1; }
          run_stage source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage pkg027 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage pkg028 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage pkg029 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage pkg030 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage pkg031 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage pkg032 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage pkg033 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage pkg034 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage pkg035 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage pkg037 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage pkg038 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage pkg039 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage pkg040 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage pkg042 node supabase/proofs/pkg042/pkg042_proof.mjs replay
          run_stage p0aware045 node supabase/proofs/discovery/p6_discovery_prepare_p0.mjs
      - name: Apply the deployable P6 rollout v2 (frozen rollout + visibility + PLACES layers, one transaction)
        run: |
          set -euo pipefail
          node scripts/proofs/build-p6-rollout-v2.mjs --check
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f supabase/candidates/p6_discovery_rollout_v2.sql > "$PRE_V3_ARTIFACT_DIR/rollout-v2.log" 2>&1
          echo "PASS P6_ROLLOUT_V2_APPLIED_LOCAL"
      - name: Track function calls and bind the APK to this stack
        run: |
          set -euo pipefail
          # The `postgres` role of the local stack cannot change these settings; supabase_admin can. Statement logging makes the
          # DISPOSABLE database record each bound rpc_discovery_v1 body, so the driver can compare the UI with the exact requests the
          # app sent (the logs stay on the runner; only parsed request shapes reach the report).
          admin="postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres"
          psql "$admin" -X -qAt -c "alter system set track_functions='all'" || echo "track_functions unavailable (non-fatal)"
          psql "$admin" -X -qAt -c "alter system set log_statement='all'" -c "alter system set log_parameter_max_length=-1" -c "select pg_reload_conf()"
          psql "$admin" -X -qAt -c "show log_statement" -c "show log_destination" -c "show logging_collector" -c "show log_directory"
          # Statement-log self-test: an extended-protocol statement with a bound parameter must appear in the container log
          # (the journey driver reads the app's PostgREST calls back from exactly such lines).
          psql "$DB_URL" -X -qAt <<'SQL' || echo "psql bind self-test statement unavailable (non-fatal)"
          select $1::text \bind 'p6_logging_selftest' \g
          SQL
          sleep 2
          db="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)"
          echo "db container: ${db:-none}; gateway: $(docker ps --format '{{.Names}}' | grep -m1 kong || echo none)"
          docker logs "$db" 2>&1 | grep -n -B1 -A1 "p6_logging_selftest" | cut -c1-300 | head -12 || echo "SELFTEST_NOT_IN_CONTAINER_LOG"
          expected='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0'
          if [[ "$RU5_DEVICE_ANON_KEY" != "$expected" ]]; then
            echo "The live stack anon key differs from the key compiled into the APK."
            echo "live key length=${#RU5_DEVICE_ANON_KEY} prefix=${RU5_DEVICE_ANON_KEY:0:24}"
            exit 1
          fi
          echo "PASS P6_NATIVE_KEY_BOUND stack anon key equals the APK key"
      - name: Fixture — two real local Auth accounts and 100 published tasks under the restricted ACL
        run: node supabase/proofs/discovery/p6_native_fixture.mjs
      - name: Enable KVM for the Android emulator when available
        run: |
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; echo "KVM_AVAILABLE=1"; else echo "KVM_AVAILABLE=0"; fi
      - name: Run the native journey on the emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash scripts/p6_run_native_journey.sh
      - name: Evidence gate
        if: always()
        run: |
          set -euo pipefail
          test -s "$P6N_ARTIFACT_DIR/p6-native-report.json"
          python3 - <<'PY'
          import json, os
          d = os.environ['P6N_ARTIFACT_DIR']
          r = json.load(open(d + '/p6-native-report.json', encoding='utf-8'))
          print('journey', r.get('mode'), 'result', r.get('result'), 'steps', len(r.get('steps', [])), 'checks', len(r.get('checks', [])))
          bad = [c for c in r.get('checks', []) if not c.get('ok')]
          for c in bad: print('  CHECK FAIL', c)
          bad_steps = [s for s in r.get('steps', []) if not s.get('ok')]
          for s in bad_steps: print('  STEP FAIL', s)
          fatal = open(d + '/logcat-fatal.txt', encoding='utf-8', errors='replace').read().strip() if os.path.exists(d + '/logcat-fatal.txt') else ''
          if fatal: print('  LOGCAT FATAL LINES:\n' + fatal[:1500])
          # Native map annotations that could not draw: MapLibre's snapshot of a pill returned null (its view had no size), soft-caught by React.
          bitmap = 0
          if os.path.exists(d + '/logcat.txt'):
              for line in open(d + '/logcat.txt', encoding='utf-8', errors='replace'):
                  if 'viewToBitmap(...) must not be null' in line: bitmap += 1
          print('annotation bitmap exceptions:', bitmap)
          if r.get('mode') == 'full':
              assert r.get('result') == 'PASS' and not bad and not bad_steps and not fatal and bitmap == 0, 'P6 native journey not accepted'
              print('PASS P6_NATIVE_JOURNEY_FOCUSED_ONLY steps=' + ','.join(r['focused']) if r.get('focused') else 'PASS P6_NATIVE_JOURNEY_ACCEPTED')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p6-native-journey-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/p6-native/
            /tmp/p6-discovery-private/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop disposable Supabase
        if: always()
        run: |
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then cd /tmp/uskoci-ru5-device-ui; supabase stop --no-backup > /tmp/teardown.log 2>&1 || true; fi
