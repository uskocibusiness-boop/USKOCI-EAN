name: Taxonomy physical vs remote two-root hierarchy proof
on:
  push:
    branches: [fix/match-ai-category-fallback-20261010]
    paths:
      - '.github/workflows/taxonomy-two-root-execution-proof.yml'
      - 'supabase/candidates/dynamic-taxonomy-20261011/dev-execution-scopes-two-root.sql'
      - 'supabase/candidates/dynamic-taxonomy-20261011/disposable-execution-two-roots-assert.sql'
  pull_request:
    paths:
      - '.github/workflows/taxonomy-two-root-execution-proof.yml'
      - 'supabase/candidates/dynamic-taxonomy-20261011/dev-execution-scopes-two-root.sql'
      - 'supabase/candidates/dynamic-taxonomy-20261011/disposable-execution-two-roots-assert.sql'
permissions:
  contents: read
jobs:
  remote-physical-hierarchy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Install exactly the three additive private catalog migrations
        run: |
          set -euo pipefail
          dir=supabase/candidates/dynamic-taxonomy-20261011
          psql -X -v ON_ERROR_STOP=1 -f "$dir/disposable-fixture.sql"
          psql -X -v ON_ERROR_STOP=1 -1 -f "$dir/dev-dark-launch-locked.sql"
          psql -X -v ON_ERROR_STOP=1 -1 -f "$dir/dev-seed-legacy-families.sql"
          psql -X -v ON_ERROR_STOP=1 -1 -f "$dir/dev-execution-scopes-two-root.sql"
      - name: Verify root distinction and remote/on-site deep tree browsing
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-execution-two-roots-assert.sql
      - name: Repeated migration must fail closed
        run: |
          set -euo pipefail
          dir=supabase/candidates/dynamic-taxonomy-20261011
          if psql -X -v ON_ERROR_STOP=1 -1 -f "$dir/dev-execution-scopes-two-root.sql" >/tmp/repeat.txt 2>&1; then
            echo 'ERROR: duplicate install succeeded'; exit 1
          fi
          grep -q 'USKOCI_EXECUTION_SCOPE_ALREADY_INSTALLED' /tmp/repeat.txt
          echo 'TWO_EXECUTION_ROOTS_HIERARCHY_PASS'
