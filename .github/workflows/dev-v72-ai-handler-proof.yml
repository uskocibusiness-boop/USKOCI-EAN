name: DEV v72 AI handler proof

on:
  push:
    branches:
      - integration/ai-v72-edge-source-20261012
      - work/uskoci-ui-unification-20260924
    paths:
      - 'supabase/functions/uskoci-ai-interview/index.ts'
      - 'supabase/functions/_shared/geminiTaskStream.ts'
      - 'supabase/functions/_shared/taxonomyScopedShadow.mjs'
      - 'src/data/__tests__/ai-natural-server-guard.test.ts'
      - 'src/data/__tests__/gemini-v70-safety-stream.test.ts'
      - 'src/data/__tests__/gemini-http-stream-regression.test.ts'
      - '.github/workflows/dev-v72-ai-handler-proof.yml'
  pull_request:
    paths:
      - 'supabase/functions/uskoci-ai-interview/index.ts'
      - 'supabase/functions/_shared/geminiTaskStream.ts'
      - 'supabase/functions/_shared/taxonomyScopedShadow.mjs'
      - 'src/data/__tests__/ai-natural-server-guard.test.ts'
      - '.github/workflows/dev-v72-ai-handler-proof.yml'

permissions:
  contents: read

concurrency:
  group: dev-v72-ai-handler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handler-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.5.6
      - name: Install exact dependencies
        run: npm ci
      - name: Gemini provider, guard, time and safety regressions (mocked only)
        run: npx jest src/data/__tests__/ai-natural-server-guard.test.ts src/data/__tests__/gemini-http-stream-regression.test.ts src/data/__tests__/gemini-v70-safety-stream.test.ts --runInBand
      - name: TypeScript contracts
        run: npx tsc --noEmit
      - name: Deno Edge function and shadow module source
        run: deno check supabase/functions/uskoci-ai-interview/index.ts
