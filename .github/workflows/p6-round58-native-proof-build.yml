name: P6 guarded native proof build
# HISTORICAL (2026-09-30): this workflow proved the Round58 (guarded native proof build) while P6 was quarantined. Its evidence step commits to the branch and its
# static admission assumed the P6 reader was unreachable from src/app. The production reader cutover made that obsolete, so it no longer
# runs on pushes; run it manually only to reproduce the historical evidence. Current proofs: p6-native-apk.yml, p6-native-journey.yml,
# p6-client-final-check.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p6-round58-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prove-and-build:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      CI: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://leqcwgzvjsxugfgzdmth.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_o_I-YOn57oPCrIboF0OjPQ_c3DHmOZW
      EXPO_PUBLIC_USE_FAKE_SOURCE: '0'
      EXPO_PUBLIC_AUTH_RECOVERY_REDIRECT_URL: uskociapp://oporavak
      EXPO_PUBLIC_P6_DISCOVERY_PROOF: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Exact source and locked dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/p6-round58
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          npm ci
          node --check scripts/proofs/p6-round58-record.cjs
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json
      - name: Focused P6 native gate and integration source
        run: npx jest --runInBand --testTimeout=30000 --runTestsByPath src/data/__tests__/discovery-v1-native-proof-gate.test.ts src/data/__tests__/discovery-v1-route-coordinator.test.ts src/data/__tests__/discovery-v1-presentation-bridge.test.ts src/data/__tests__/discovery-v1-screen-session.test.ts src/data/__tests__/profile-gallery.test.tsx --json --outputFile=/tmp/p6-round58/focused.json
      - name: Full regression
        run: npx jest -w 3 --testTimeout=30000 --json --outputFile=/tmp/p6-round58/full.json
      - name: Static fail-closed route admission
        run: |
          set -euo pipefail
          grep -F "discoveryV1NativeProofAllowed(proofParam)" 'src/app/(app)/zadaci.tsx'
          grep -F "publicationRoute" 'src/app/(app)/zadaci.tsx'
          test "$(grep -R -l -F 'DiscoveryV1NativeProofRoute' src/app | wc -l)" -eq 1
          if grep -R -n -F "EXPO_PUBLIC_P6_DISCOVERY_PROOF: '1'" app.json app.config.* 2>/dev/null; then
            echo "Proof flag must not be persisted in ordinary app config."
            exit 1
          fi
      - name: Inject exact DEV Android package
        run: |
          node <<'NODE'
          const fs=require('fs'),p='app.json',app=JSON.parse(fs.readFileSync(p,'utf8'));
          app.expo.android=app.expo.android||{};
          app.expo.android.package='rs.uskoci.dev';
          app.expo.name='USKOČI P6 PROOF';
          fs.writeFileSync(p,JSON.stringify(app,null,2)+'\n');
          NODE
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean
      - name: Tune Gradle for ARM64 physical proof candidate
        run: |
          node <<'NODE'
          const fs=require('fs'),p='android/gradle.properties';let text=fs.readFileSync(p,'utf8');
          const set=(k,v)=>{const r=new RegExp('^'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'=.*$','m'),line=k+'='+v;
            text=r.test(text)?text.replace(r,line):text.trimEnd()+'\n'+line+'\n';};
          set('org.gradle.jvmargs','-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8');
          set('reactNativeArchitectures','arm64-v8a');fs.writeFileSync(p,text);
          NODE
      - name: Build proof APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -x lintVitalAnalyzeRelease
      - name: Bind proof APK
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/p6-round58/USKOCI-P6-PROOF-ARM64.apk
          sha256sum /tmp/p6-round58/USKOCI-P6-PROOF-ARM64.apk > /tmp/p6-round58/USKOCI-P6-PROOF-ARM64.apk.sha256
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -1)"
          test -n "$AAPT"
          "$AAPT" dump badging /tmp/p6-round58/USKOCI-P6-PROOF-ARM64.apk | head -1 | tee /tmp/p6-round58/badging.txt
          grep -F "package: name='rs.uskoci.dev'" /tmp/p6-round58/badging.txt
          unzip -l /tmp/p6-round58/USKOCI-P6-PROOF-ARM64.apk | grep -F 'lib/arm64-v8a/' > /tmp/p6-round58/abi.txt
          if unzip -l /tmp/p6-round58/USKOCI-P6-PROOF-ARM64.apk | grep -q -E 'lib/(x86|x86_64|armeabi-v7a)/'; then
            echo "Proof APK must be ARM64-only."
            exit 1
          fi
      - name: Restore exact tracked source after native prebuild mutation
        run: |
          set -euo pipefail
          # Expo prebuild may rewrite tracked app/package metadata. APK bytes are already bound above;
          # evidence must start from the exact source commit, with generated android/ remaining untracked/ignored.
          git restore --source="$GITHUB_SHA" --worktree --staged -- .
          git diff --quiet
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Evidence and generated control
        run: |
          set -euo pipefail
          node scripts/proofs/p6-round58-record.cjs record
          node scripts/control/osvezi.mjs > /tmp/p6-round58/control.log 2>&1
          node scripts/proofs/p6-round58-record.cjs verify
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/control/redovi.json docs/control/stanje.json docs/control/FINALIZATION_MATRIX.md docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_58_P6_GUARDED_NATIVE_PROOF_BUILD.md docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_58_P6_GUARDED_NATIVE_PROOF_BUILD_CHECKS.json
          git add -f docs/control/out/tabla.html
          git commit -m 'docs(control): record guarded P6 native proof APK build'
      - name: Publish evidence only if canonical source did not move
        run: |
          set -euo pipefail
          branch='work/uskoci-ui-unification-20260924'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          node scripts/proofs/p6-round58-record.cjs verify
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > /tmp/p6-round58/published-head.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p6-native-proof-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/p6-round58/USKOCI-P6-PROOF-ARM64.apk
            /tmp/p6-round58/USKOCI-P6-PROOF-ARM64.apk.sha256
            /tmp/p6-round58/badging.txt
            /tmp/p6-round58/abi.txt
            /tmp/p6-round58/focused.json
            /tmp/p6-round58/full.json
            /tmp/p6-round58/published-head.txt
          if-no-files-found: warn
          retention-days: 14
