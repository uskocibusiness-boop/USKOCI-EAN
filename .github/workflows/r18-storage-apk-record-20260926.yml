name: Record verified R18 storage APK
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths: ['.github/workflows/r18-storage-apk-record-20260926.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r18-storage-apk-record-20260926
  cancel-in-progress: false
jobs:
  verify-and-record:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    env:
      APK_RUN: '36242064743'
      APK_SOURCE: 'cc8649a80d5c62ed6f50e6a3f9fe825742a4af0e'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Follow only the already requested exact build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$APK_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/r18-storage-apk-record-20260926.yml'
          mkdir -p /tmp/r18-storage-apk-proof
          gh run watch "$APK_RUN" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APK_RUN" > /tmp/r18-storage-apk-proof/run.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const r=JSON.parse(readFileSync('/tmp/r18-storage-apk-proof/run.json','utf8'));
          assert.equal(r.id,Number(process.env.APK_RUN)); assert.equal(r.head_sha,process.env.APK_SOURCE);
          assert.equal(r.head_branch,'work/uskoci-ui-unification-20260924');
          assert.equal(r.path,'.github/workflows/build-android-dev-apk.yml');
          assert.equal(r.status,'completed'); assert.equal(r.conclusion,'success');
          NODE
          gh run download "$APK_RUN" --repo "$GITHUB_REPOSITORY" --name USKOCI-DEV-APK --dir /tmp/r18-storage-apk-proof
      - name: Independently verify APK bytes, bundled code and source-bound attestations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, zipfile
          p=Path('/tmp/r18-storage-apk-proof')
          apk=p/'USKOCI-DEV.apk'; data=apk.read_bytes(); digest=hashlib.sha256(data).hexdigest()
          assert digest==(p/'USKOCI-DEV.apk.sha256').read_text().split()[0]
          recovery=json.loads((p/'USKOCI-DEV-recovery-attestation.json').read_text())
          icon=json.loads((p/'USKOCI-DEV-icon-attestation.json').read_text())
          for receipt in (recovery,icon):
            assert receipt['result']=='PASS'
            assert receipt['apkSha256']==digest
            assert receipt['sourceCommit']==os.environ['APK_SOURCE']
            assert str(receipt['workflowRunId'])==os.environ['APK_RUN']
            assert str(receipt['workflowRunAttempt'])=='1'
          assert recovery['apkBytes']==len(data)
          assert recovery['sourceTree']==icon['sourceTree']
          assert recovery['recoveryCompiledIntoBundle'] is True
          assert recovery['recoveryEnvLeftForRuntime'] is False
          assert recovery['recoveryCompiledDisabled'] is False
          assert recovery['liveWrites'] is False and recovery['providerCalled'] is False
          with zipfile.ZipFile(apk) as z:
            assert hashlib.sha256(z.read(recovery['bundlePath'])).hexdigest()==recovery['bundleSha256']
            abis=sorted({name.split('/')[1] for name in z.namelist() if name.startswith('lib/') and name.endswith('.so')})
          assert abis==['arm64-v8a'], abis
          result={'status':'APK_BUILT_ATTESTED_DEVICE_PENDING','sourceCommit':os.environ['APK_SOURCE'],
            'testedRuntimeCommit':'33d86b45a06883af8524130a3e6cf2ee1b69e61b','workflowRunId':int(os.environ['APK_RUN']),
            'workflowUrl':'https://github.com/Uskoci1/USKOCI-CLEAN/actions/runs/'+os.environ['APK_RUN'],
            'sourceTree':recovery['sourceTree'],'apkSha256':digest,'apkBytes':len(data),'abis':abis,
            'bundleSha256':recovery['bundleSha256'],'recoveryAttestation':'PASS','iconAttestation':'PASS',
            'deviceInstalled':False,'deviceTestPerformed':False,'pushTestPerformed':False,
            'devApplied':False,'edgeApplied':False,'storeRelease':False,'externalDashboardPublished':False}
          base=Path('docs/implementation/release-hardening-20260926')
          assert not (base/'STORAGE_APK.json').exists(), 'Already recorded; do not overwrite'
          (base/'STORAGE_APK.json').write_text(json.dumps(result,indent=2)+'\n')
          (p/'verified-apk.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Update the same tracker without granting phone acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const base='docs/implementation/release-hardening-20260926/';
          const e=JSON.parse(readFileSync(base+'STORAGE_APK.json','utf8'));
          const report='# R18 storage — tačan Android APK\n\nStatus: **APK_BUILT_ATTESTED_DEVICE_PENDING**.\n\nAPK source: `'+e.sourceCommit+'`. Provereni runtime: `'+e.testedRuntimeCommit+'`; dodatak je samo ograničeni CI zahtev za build, bez nove promene aplikacije.\n\n[Build]('+e.workflowUrl+'). SHA-256: `'+e.apkSha256+'`. Bajtova: '+e.apkBytes+'. ABI: arm64-v8a. Preuzet APK je nezavisno upoređen sa checksum-om i sa obe source-bound attestation datoteke; Hermes bundle hash je ponovo izračunat. Recovery i launcher icon: PASS.\n\n## Nije dokazano\n\nAPK nije instaliran niti testiran na fizičkom telefonu u ovoj proveri. Ne dokazuje push, produkciono potpisivanje, Play Store, App Store ili jednakost svih DEV funkcija. Nije bilo DEV/Edge/provider/push izmena. Razvojni paket koristi postojeći rs.uskoci.dev build put; ne treba ga predstavljati kao push-capable ili production paket.\n\n## Sledeća ograničena provera\n\nPrvo potvrditi tačan instalirani hash/izvor i pokretanje. Zatim, samo na posebno odobrenom zadatku i nalozima, proveriti poznato odbijanje, profil → povratak, dvostruki reset i offline/replay bez duplikata. Ne brisati podatke aplikacije ili nalog da bi se izazvao storage kvar; ti kvarovi su simulirani u CI-ju, ne na korisnikovom telefonu. Telefon u kontrolnoj tabli ostaje nepotvrđen.\n';
          writeFileSync(base+'STORAGE_APK.md',report);
          const path='docs/control/redovi.json'; const rows=JSON.parse(readFileSync(path,'utf8'));
          const row=rows.redovi.find(r=>r.id==='B09'); assert.ok(row);
          row.sledece='26.09: tačan Android APK '+e.sourceCommit.slice(0,8)+' / run '+e.workflowRunId+' napravljen i hash/attestation proveren; NIJE instaliran niti testiran na telefonu. Dokaz: '+base+'STORAGE_APK.json. '+row.sledece;
          writeFileSync(path,JSON.stringify(rows,null,2)+'\n');
          const nextPath='docs/implementation/design-system/r19-task-agreement-20260925/NEXT.md';
          let next=readFileSync(nextPath,'utf8');
          const anchor='## Next client work, after the APK result\n';
          assert.equal(next.split(anchor).length,2);
          next=next.replace(anchor,anchor+'\nStorage checkpoint APK is now built and attested: source `'+e.sourceCommit+'`, run `'+e.workflowRunId+'`. See `'+base+'STORAGE_APK.md`. Physical-device installation/acceptance remains pending; do not rebuild the tested client fix or claim real push from this DEV APK.\n');
          writeFileSync(nextPath,next);
          NODE
          node scripts/control/osvezi.mjs
      - name: Commit only APK evidence and generated state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- docs/implementation/release-hardening-20260926/STORAGE_APK.json \
            docs/implementation/release-hardening-20260926/STORAGE_APK.md \
            docs/control/redovi.json docs/control/stanje.json \
            docs/implementation/design-system/r19-task-agreement-20260925/NEXT.md
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'; import { execFileSync } from 'node:child_process';
          const files=execFileSync('git',['diff','--cached','--name-only'],{encoding:'utf8'}).trim().split('\n');
          const allowed=new Set(['docs/implementation/release-hardening-20260926/STORAGE_APK.json',
            'docs/implementation/release-hardening-20260926/STORAGE_APK.md','docs/control/redovi.json','docs/control/stanje.json',
            'docs/implementation/design-system/r19-task-agreement-20260925/NEXT.md']);
          assert.equal(files.length,allowed.size); assert.ok(files.every(p=>allowed.has(p)));
          NODE
          remote_head=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA" || { echo 'Branch moved; preserve the verified artifact, never force-push.'; exit 1; }
          git config user.name 'USKOCI evidence bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record exact storage checkpoint APK and retain device-pending status'
          git push origin "HEAD:$GITHUB_REF"
          git rev-parse HEAD > /tmp/r18-storage-apk-proof/evidence-commit.txt
      - name: Retain verified APK evidence and the actual table
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r18-storage-apk-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            /tmp/r18-storage-apk-proof/verified-apk.json
            /tmp/r18-storage-apk-proof/evidence-commit.txt
            docs/implementation/release-hardening-20260926/STORAGE_APK.json
            docs/implementation/release-hardening-20260926/STORAGE_APK.md
            docs/control/stanje.json
            docs/control/redovi.json
            docs/control/out/tabla.html
