name: USKOCI carve product-only source, verified

on:
  push:
    branches: [work/uskoci-cist-proizvod-20261104]
    paths: [.github/workflows/uskoci-product-slim-once.yml]

permissions:
  contents: read

jobs:
  carve-source:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-cist-proizvod-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PRODUCT_BASE_SHA: 357d767d9f7ad61b0cd452c9c3a0e44b1b69664f
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Pin the exact isolated base and prepare report directory
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/uskoci-cist-proizvod-20261104
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/uskoci-product"
          test "$(git rev-parse "$PRODUCT_BASE_SHA")" = "$PRODUCT_BASE_SHA"
      - name: Locked original dependencies, complete static graph and reference Android export
        shell: bash
        run: |
          set -euo pipefail
          npm ci > "$RUNNER_TEMP/uskoci-product/npm-original.log" 2>&1
          node scripts/product-audit.cjs --out "$RUNNER_TEMP/uskoci-product/source-audit" > "$RUNNER_TEMP/uskoci-product/graph-original.log" 2>&1
          node - <<'JS' > "$RUNNER_TEMP/uskoci-product/android-before.log" 2>&1
          const {spawnSync}=require('node:child_process');
          const env={...process.env,...require('./eas.json').build.preview.env,
            EAS_BUILD_PROFILE:'preview',USKOCI_OTA_TARGET:'preview',EXPO_NO_TELEMETRY:'1',EXPO_OFFLINE:'1'};
          const r=spawnSync(process.execPath,['node_modules/expo/bin/cli','export',
            '--no-bytecode','--platform','android','--output-dir',
            process.env.RUNNER_TEMP+'/uskoci-product/android-before'],{env,stdio:'inherit'});
          if(r.error)throw r.error;
          process.exit(r.status??1);
          JS
      - name: Physically remove old tests and archives from this branch only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/product_slim_once.py > "$RUNNER_TEMP/uskoci-product/prune.log"
          git diff --cached --check
      - name: Keep one small product smoke test and one simple future build check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path.cwd()
          smoke = """'use strict';
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs'),path=require('node:path');
          const root=path.resolve(__dirname,'..');
          const exists=p=>fs.existsSync(path.join(root,p));
          test('app has both real AI interview routes',()=>{
            for(const p of ['src/app/(app)/nova.tsx','src/app/(app)/profil/razgovor.tsx',
              'src/ui/aiFirst/AiConversationShell.tsx','src/ui/v2/IntakePresentation.tsx'])
              assert.ok(exists(p),p);
          });
          test('one shared service handoff contract exists for both client and Edge',()=>{
            const client=fs.readFileSync(path.join(root,'src/contracts/serviceHandoff.ts'),'utf8');
            assert.match(client,/supabase\\/functions\\/_shared\\/serviceHandoff[.]mjs/);
            assert.ok(exists('supabase/functions/_shared/serviceHandoff.mjs'));
          });
          test('both Edge interview entrypoints remain buildable source',()=>{
            for(const p of ['supabase/functions/uskoci-ai-interview/index.ts',
              'supabase/functions/uskoci-worker-interview/index.ts'])assert.ok(exists(p),p);
          });
          test('canonical database migration history is still present',()=>{
            const dir=path.join(root,'supabase/migrations');
            assert.equal(fs.readdirSync(dir).filter(x=>x.endsWith('.sql')).length>100,true);
          });
          test('native patch and app entry generation inputs are kept',()=>{
            for(const p of ['patches/react-native-reanimated+4.5.1.patch',
              'scripts/verify-native-patches.cjs','scripts/sync-entry-reference-assets.cjs',
              'assets/brand/reference-entry/provenance.json','vendor/decode-uri-component-compat/package.json'])
              assert.ok(exists(p),p);
          });
          test('production tree has no historical QA corpora or extra masters',()=>{
            for(const p of ['supabase/proofs','supabase/candidates','supabase/operations',
              'src/data/__tests__','src/designLab','docs/continuation','jest.config.cjs'])
              assert.equal(exists(p),false,p);
            for(const p of ['docs/plan/CODEX_PLAN_RADA.md','docs/product/USKOCI_PRODUCT_UX_MASTER.md'])
              assert.ok(exists(p),p);
          });
          test('normal product screens keep active visual resources',()=>{
            for(const p of ['assets/illustrations/natural-v1/home.webp',
              'assets/illustrations/uskoci-clock-v1.png',
              'assets/illustrations/uskoci-messages-v2.png'])
              assert.ok(exists(p),p);
          });
          """
          # Dedent embedded JavaScript, keeping the source readable.
          import textwrap
          (root/'scripts/product-smoke.test.cjs').write_text(textwrap.dedent(smoke).lstrip(),encoding='utf-8')
          ci = """name: USKOCI product source smoke
          on:
            push:
              branches: [work/uskoci-cist-proizvod-20261104]
            workflow_dispatch:
          permissions:
            contents: read
          concurrency:
            group: uskoci-product-source-smoke
            cancel-in-progress: true
          jobs:
            source:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              env:
                CI: '1'
                EXPO_OFFLINE: '1'
                EXPO_NO_TELEMETRY: '1'
              steps:
                - uses: actions/checkout@v4
                  with:
                    persist-credentials: false
                - uses: actions/setup-node@v4
                  with:
                    node-version: '24'
                    cache: npm
                - name: Install exact app/build dependencies
                  run: npm ci
                - name: Validate types and bounded product invariants
                  run: |
                    ./node_modules/.bin/tsc --noEmit
                    npm test
                - name: Verify Android Metro Hermes export
                  shell: bash
                  run: |
                    node - <<'JS'
                    const {spawnSync}=require('node:child_process');
                    const env={...process.env,...require('./eas.json').build.preview.env,
                      EAS_BUILD_PROFILE:'preview',USKOCI_OTA_TARGET:'preview',EXPO_NO_TELEMETRY:'1',EXPO_OFFLINE:'1'};
                    const r=spawnSync(process.execPath,['node_modules/expo/bin/cli','export','--platform','android','--output-dir',process.env.RUNNER_TEMP+'/android-product'],{env,stdio:'inherit'});
                    if(r.error)throw r.error;process.exit(r.status??1);
                    JS
          """
          (root/'.github/workflows/uskoci-product-check.yml').write_text(textwrap.dedent(ci).lstrip(),encoding='utf-8')
          pkgfile=root/'package.json'
          pkg=json.loads(pkgfile.read_text())
          if pkg['scripts'].get('test')!='jest': raise SystemExit('NPM_TEST_SCRIPT_CHANGED')
          pkg['scripts']['test']='node --test scripts/product-smoke.test.cjs'
          pkgfile.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          readme=root/'README.md'
          text=readme.read_text(encoding='utf-8')
          readme.write_text("""# USKOČI — čist izvršni proizvod (izdvojena grana)

          Ovo je samostalna radna grana za aktivan React Native/Expo kod,
          Supabase Edge funkcije, kanonske migracije baze, native integraciju,
          brend-resurse i konfiguraciju izgradnje.

          **Ovo nije spajanje sa glavnom granom i nije nova aplikacija od nule.**
          Polazni izvor: work/uskoci-cleanroom-audit-20261104
          na commitu 357d767d9f7ad61b0cd452c9c3a0e44b1b69664f.

          ## Jedina dva mastera
          - docs/plan/CODEX_PLAN_RADA.md — izvršni plan.
          - docs/product/USKOCI_PRODUCT_UX_MASTER.md — vlasnički UX i proizvod.

          ## Čisti proizvod
          - src/app — ulazi Expo Router ekrana.
          - src/features, src/data, src/contracts, src/ui, src/hooks — aktivna aplikacija.
          - supabase/functions — aktivni Edge kod i zajednički validatori.
          - supabase/migrations — kanonska SQL istorija (nije cela DEV ledger istorija).
          - assets, config, modules, plugins, patches, vendor — build/resursi.

          ## Razvoj bez nepotrebne istorije u folderu
          Velika kolekcija QA provera, SQL kandidata, istorijskih analiza i
          restore dokaza nije obrisana iz Git istorije. Čuva se u drugoj grani,
          work/uskoci-cleanroom-audit-20261104, na prethodno pinovanom commitu.
          Tamo se po potrebi izvršavaju detaljni testovi nad aktuelnim kodom.
          Ova grana pokreće mali izvorni smoke test preko npm test i proverava
          TypeScript, Expo build i native integraciju u GitHub Actions.

          ## Lokalna izgradnja
          npm ci
          npm test
          npx tsc --noEmit
          npx expo export --platform android

          Ovo nije potvrda realnog Gemini razgovora, Supabase DEV Auth/RLS,
          instaliranog APK-a ili stvarnog dvo-naložnog toka. Produkcioni backend
          mora imati odvojenu verifikaciju i ne sme naslepo koristiti DEV postavke.
          """.replace('          ','').lstrip(),encoding='utf-8')
          master=root/'docs/plan/CODEX_PLAN_RADA.md'
          original=master.read_text(encoding='utf-8')
          key='# USKOČI — jedinstveni plan dovršavanja proizvoda i objavljivanja\n'
          if not original.startswith(key):raise SystemExit('MASTER_HEADER_CHANGED')
          note=('\\n> **R11 — izolovano PRODUKTNO radno stablo, 04.11.2026:** grana '
            'work/uskoci-cist-proizvod-20261104 cuva samo React Native/Expo, Supabase '
            'Edge, kanonske migracije, resurse i potrebne native/build alate. '
            'Stari testovi, istorijski kandidati, proof/operations i dokumentacioni arhivi '
            'ostaju u zasebnom izvornom Git commitu 357d767d9f7ad61b0cd452c9c3a0e44b1b69664f. '
            'Za runtime su zadrzani svi originalni kodni fajlovi, bez prepravljanja '
            'poslovne logike; E2E/DEV/native nisu time automatski potvrdjeni. '
            'Jedna operativna grana, dve postojece master istine.\\n')
          master.write_text(original.replace(key,key+note,1),encoding='utf-8')
          print('PREPARED_PRODUCT_ONLY_SMOKE_AND_DOCS')
          PY
      - name: Reinstall and validate actual product-only source
        shell: bash
        run: |
          set -euo pipefail
          npm ci > "$RUNNER_TEMP/uskoci-product/npm-product.log" 2>&1
          ./node_modules/.bin/tsc --noEmit > "$RUNNER_TEMP/uskoci-product/tsc-product.log" 2>&1
          npm test > "$RUNNER_TEMP/uskoci-product/smoke.log" 2>&1
          node - <<'JS' > "$RUNNER_TEMP/uskoci-product/android-after.log" 2>&1
          const {spawnSync}=require('node:child_process');
          const env={...process.env,...require('./eas.json').build.preview.env,
            EAS_BUILD_PROFILE:'preview',USKOCI_OTA_TARGET:'preview',EXPO_NO_TELEMETRY:'1',EXPO_OFFLINE:'1'};
          const r=spawnSync(process.execPath,['node_modules/expo/bin/cli','export',
            '--no-bytecode','--platform','android','--output-dir',
            process.env.RUNNER_TEMP+'/uskoci-product/android-after'],{env,stdio:'inherit'});
          if(r.error)throw r.error;
          process.exit(r.status??1);
          JS
      - name: Verify exact Android JS and graphic assets before/after removing QA material
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ['RUNNER_TEMP'])/'uskoci-product'
          def files(directory):
              p=root/directory
              return {str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest()
                  for f in p.rglob('*') if f.is_file()}
          before=files('android-before');after=files('android-after')
          if not before or before!=after:
              changed=sorted(set(before)^set(after)|{p for p in before.keys()&after.keys() if before[p]!=after[p]})
              raise SystemExit('ACTUAL_ANDROID_OUTPUT_CHANGED: '+repr(changed[:22]))
          (root/'ANDROID_OUTPUT_PARITY.json').write_text(json.dumps({
            'exactOutputFiles':len(before),'sha256Equal':True,
            'scope':'Expo Android JS/assets no-bytecode; no native APK or real Gemini proof'},indent=2)+'\n')
          print('ANDROID_JS_AND_ASSETS_IDENTICAL',len(before))
          PY
      - name: QA regression using the original test corpus without keeping it in the product branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          base=os.environ['PRODUCT_BASE_SHA']
          info=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'uskoci-product/PRODUCT_SOURCE_MANIFEST.json').read_text())
          for row in info['removedFilesIndex']:
              p=pathlib.Path(row['path'])
              p.parent.mkdir(exist_ok=True,parents=True)
              raw=subprocess.check_output(['git','show',base+':'+row['path']])
              p.write_bytes(raw)
          print('TEMPORARY_QA_CORPUS_RESTORED',len(info['removedFilesIndex']))
          PY
          ./node_modules/.bin/jest --maxWorkers=2 --silent --json --outputFile "$RUNNER_TEMP/uskoci-product/full-regression.json" > "$RUNNER_TEMP/uskoci-product/full-regression.log" 2>&1
          node --test --test-reporter=spec \
            supabase/proofs/ai/worker_mode_short_replies.test.mjs \
            supabase/proofs/ai/worker_mode_declarations.test.mjs \
            supabase/proofs/ai/single_pass_edge.test.mjs > "$RUNNER_TEMP/uskoci-product/server-ai-proof.log" 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          root=Path(os.environ['RUNNER_TEMP'])/'uskoci-product'
          info=json.loads((root/'PRODUCT_SOURCE_MANIFEST.json').read_text())
          for row in info['removedFilesIndex']:
              p=Path(row['path'])
              if not p.is_file():raise SystemExit('TEMP_QA_FILE_NOT_RESTORED '+str(p))
              p.unlink()
          for name in ['supabase/proofs','supabase/candidates','supabase/operations',
              'src/data/__tests__','docs/continuation','jest.config.cjs']:
              if Path(name).exists():
                  # Empty directories can survive a temporary QA overlay. Files may not.
                  if Path(name).is_file() or any(x.is_file() for x in Path(name).rglob('*')):
                      raise SystemExit('QA_MATERIAL_LEFT_IN_PRODUCT: '+name)
          j=json.loads((root/'full-regression.json').read_text())
          if not j['success'] or j['numFailedTests'] or j['numFailedTestSuites']:
              raise SystemExit('FULL_QA_REGRESSION_FAILED')
          print('EXTERNAL_QA_REGRESSION_PROVEN',j['numPassedTests'],j['numTotalTests'])
          PY
      - name: Prove normal Android Hermes export and exact final product-only structure
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS' > "$RUNNER_TEMP/uskoci-product/hermes.log" 2>&1
          const {spawnSync}=require('node:child_process');
          const env={...process.env,...require('./eas.json').build.preview.env,EAS_BUILD_PROFILE:'preview',USKOCI_OTA_TARGET:'preview',EXPO_NO_TELEMETRY:'1',EXPO_OFFLINE:'1'};
          const r=spawnSync(process.execPath,['node_modules/expo/bin/cli','export',
            '--platform','android','--output-dir',process.env.RUNNER_TEMP+'/uskoci-product/android-hermes'],{env,stdio:'inherit'});
          if(r.error)throw r.error;
          process.exit(r.status??1);
          JS
          git rm -- scripts/product_slim_once.py .github/workflows/uskoci-product-slim-once.yml
          git add -- package.json README.md docs/plan/CODEX_PLAN_RADA.md \
            scripts/product-smoke.test.cjs .github/workflows/uskoci-product-check.yml
          git diff --cached --check
          python3 - <<'PY'
          from pathlib import Path
          import json,os,subprocess
          out=Path(os.environ['RUNNER_TEMP'])/'uskoci-product'
          r=json.loads((out/'PRODUCT_SOURCE_MANIFEST.json').read_text())
          j=json.loads((out/'full-regression.json').read_text())
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only',os.environ['PRODUCT_BASE_SHA']],text=True).splitlines())
          expected={x['path'] for x in r['removedFilesIndex']}|{
              'README.md','package.json','docs/plan/CODEX_PLAN_RADA.md',
              'scripts/product-smoke.test.cjs','.github/workflows/uskoci-product-check.yml'}
          if changed!=expected:
              raise SystemExit('FINAL_PRODUCT_SCOPE_NOT_VERIFIED '+repr(sorted(changed^expected)[:25]))
          retained=[p for p in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if p]
          if len(retained)!=r['retainedOriginalFiles']+2:
              raise SystemExit('WRONG_FINAL_PRODUCT_FILE_COUNT '+str(len(retained)))
          report={
              'source':r['sourceCommit'],'productBranch':'work/uskoci-cist-proizvod-20261104',
              'sourceFilesBefore':r['totalOriginalFiles'],
              'sourceFilesRemoved':r['removedFiles'],
              'productFilesAfter':len(retained),
              'oldSourceBytesRemoved':r['removedBytes'],
              'canonicalMigrationsRetained':r['retainedCanonicalMigrations'],
              'allMobileJestTestsTemporarilyRun':j['numTotalTests'],
              'mobilePassed':j['numPassedTests'],
              'appJSAndAssetsBitwiseEqual':True,
              'normalHermesExportPassed':True,
              'typescriptPassed':True,'lockedInstallOnProductTreePassed':True,
              'smallProductSmokePassed':True,'mergedOtherBranches':False,
              'serverModified':False,'liveAppDeployed':False,'gitHistoryErased':False,
              'notProven':['Native APK install, two accounts, real Gemini conversation or current DEV schema and privacy parity',
                  'User-visible speed improvement or smaller APK size',
                  'Future tests outside clean source must be run against the matching commit']
          }
          (out/'PRODUCT_ACCEPTANCE.json').write_text(json.dumps(report,indent=2)+'\n')
          print('VERIFIED_PRODUCT_ONLY_SOURCE',json.dumps(report))
          PY
      - name: Publish this separate lean source, without merging into any other branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target=refs/heads/work/uskoci-cist-proizvod-20261104
          test "$(git ls-remote origin "$target" | cut -f1)" = "$GITHUB_SHA"
          git config user.name "USKOCI product source cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(product): keep only app, Edge, SQL migrations and verified build inputs"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:"$target"
          git rev-parse HEAD > "$RUNNER_TEMP/uskoci-product/PUBLISHED_COMMIT.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uskoci-product-only-source-acceptance
          path: ${{ runner.temp }}/uskoci-product/*.json
          retention-days: 30
          if-no-files-found: warn
