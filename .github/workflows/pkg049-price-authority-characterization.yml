name: PKG-049 price authority characterization
# B09 / PKG-049 (owner decision 2026-10-01: "ŽELIM SERVERSKI AUTORITET ZA CENU U V1"). NO server change is made or proposed here: the authority (private.assert_application_price_v5, md5 bd7ef029, called by
# rpc_submit_response, rpc_select_response, rpc_resolve_stale_response_after_need_edit and both need_candidate_states_v5 overloads) is already live on canonical DEV since ledger 189 (PKG-033a).
# This job is the EVIDENCE REFRESH (docs: b09/B09_PRICE_AUTHORITY_FINDING_20261001.md, section 10 T0-T8): on a DISPOSABLE DEV-equivalent chain (the unchanged source147 -> PKG-050 stages, plus the
# exact EX-04D candidate text inside the proof for the second need_candidate_states_v5 overload, plus an in-proof conversion of exactly two PRE-B24 bodies) with actual Auth and actual PostgREST
# (real JWTs) and the real client TypeScript it proves, as a modified client would meet it: DIRECT PostgREST TABLE WRITES on the response, Agreement, selection and task tables (price integrity is claimed
# to be RPC-only: each attack must give the pinned outcome and leave the stored price surface byte-identical), the RPC refusals (exact message, SQLSTATE, HTTP 400, nothing written), replay and
# idempotency, stale reconfirm, selection with no price argument and bound to the pinned (revision, version, hash), the readback, and it CHARACTERISES (does not judge) the Agreement change flow as open
# owner decision D3. Phase P8 weakens the rule on purpose, on the chain only, to prove the proof turns RED (a probe is detected only by the OBSERVED weakened outcome).
# CHAIN FIDELITY. The chain is NOT DEV. It lacks the DEV ledger 202-219 items pkg051a, A1/P0/P4/P5/B3a-c, PKG-045b P0 (needs column ACL, certificate re-bind), P6 rollout v3, B24 Part 1/2, Voice B1 and
# EX-04A-C; its certified set and certificate are chain-internal (before = after only). B24 Part 1 as a whole cannot apply (relaxed mode relaxes only the md5 pins and the closed name lists, NOT
# existence, uniqueness or the quoted-site count: private.platform_price_add_version exists only after pkg051a, and later push bodies drift the site count), so the proof converts exactly the two
# price-chain bodies d37c4f7c -> 96cb9aac (stale resolver) and dfa1a809 -> 450b6f8d (rpc_confirm_need_edit), ONE TRANSACTION EACH, with B24's own mechanics, after measuring the derived md5 against the DEV md5.
# Only four documented chain-drift guards are tolerated by that stage; any other failure fails the run. When the stale resolver is not the DEV body, the PT409 (HTTP 409) coverage is a recorded GAP and the
# result is PASS_WITH_GAPS.
# The pin gate FAILS the run when a core pin differs without an explanation, when the helper vocabulary or its raise count differs or when a swallow list has a gap. Its label says "PRICE-CHAIN BODIES == DEV"
# (the pinned function bodies ONLY, never the chain) or which differences are explained, and every pass line carries it.
# The path filter below names every file the proof or its unit tests read, the real client module graph, and the files that DEFINE the chain (the unit tests require all of them to be covered).
# No DEV, provider or device access. Every outcome destroys the disposable stack.
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/pkg049-price-authority-characterization.yml'
      - 'supabase/proofs/pkg049/**'
      - 'supabase/proofs/ex04/ts_loader.mjs'
      - 'supabase/proofs/pre_v3/closure_runtime.mjs'
      - 'supabase/proofs/pre_v3/history_snapshot.mjs'
      - 'supabase/proofs/ru5_device_ui_local_guard.mjs'
      - 'supabase/proofs/ru5_device_ui_live79_env.sh'
      - 'supabase/proofs/pkg023/pkg023_surface.sql'
      - 'supabase/proofs/b24/b24_inventory.tsv'
      - 'supabase/candidates/ex04d_candidates_page.sql'
      - 'supabase/candidates/b24_nonretried_conflicts_part1.sql'
      - 'supabase/operations/dev-alpha/ledger/**'
      # the files that DEFINE the chain this evidence is about (round 3): every migration, every pkg candidate the replay stages apply (pkg033a, pkg035a, pkg045a, pkg051a ... are all pkg*), the replay
      # and stage proof scripts and the proof directories they read, the Edge sources, and the few non-supabase inputs the stage scripts read. Documents that only MENTION a path are intentionally outside.
      - 'supabase/migrations/**'
      - 'supabase/candidates/pkg*.sql'
      - 'supabase/functions/**'
      - 'supabase/proofs/pkg023j/replay_source147.py'
      - 'supabase/proofs/pkg027/**'
      - 'supabase/proofs/pkg028/**'
      - 'supabase/proofs/pkg029/**'
      - 'supabase/proofs/pkg030/**'
      - 'supabase/proofs/pkg031/**'
      - 'supabase/proofs/pkg032/**'
      - 'supabase/proofs/pkg033/**'
      - 'supabase/proofs/pkg034/**'
      - 'supabase/proofs/pkg035/**'
      - 'supabase/proofs/pkg037/**'
      - 'supabase/proofs/pkg038/**'
      - 'supabase/proofs/pkg039/**'
      - 'supabase/proofs/pkg040/**'
      - 'supabase/proofs/pkg042/**'
      - 'supabase/proofs/pkg050/**'
      - 'supabase/proofs/ai/**'
      - 'supabase/proofs/completion/**'
      - 'supabase/proofs/legal/**'
      - 'supabase/proofs/policy/**'
      - 'supabase/proofs/notifications/**'
      - 'docs/implementation/v5-ai-first/PRESELECTION_QA_EXECUTABLE_POLICY.json'
      - 'docs/implementation/v5-ai-first/pkg042/FUNCTION_PINS_20260922.json'
      - 'scripts/render-qa-policy-bundle.mjs'
      - 'src/contracts/qaSubmission.ts'
      - 'src/lib/qaTextHash.ts'
      - 'src/data/agreementClientService.ts'
      - 'src/data/agreementCompletion.ts'
      - 'src/data/agreementRatingsRead.ts'
      - 'src/data/applicationClientService.ts'
      - 'src/data/applicationSelectionClientService.ts'
      - 'src/data/calendarErrors.ts'
      - 'src/data/candidateClientService.ts'
      - 'src/data/candidatesPage.ts'
      - 'src/data/legacyRpcFailure.ts'
      - 'src/data/myApplicationsView.ts'
      - 'src/data/needClientService.ts'
      - 'src/data/needDetailPresentation.ts'
      - 'src/data/needEnding.ts'
      - 'src/data/needUrgencyClientService.ts'
      - 'src/data/ownApplicationsPage.ts'
      - 'src/data/ownTasksPage.ts'
      - 'src/data/reviewsClientService.ts'
      - 'src/data/ru4Production.ts'
      - 'src/data/serverReceipt.ts'
      - 'src/lib/calendarTime.ts'
      - 'src/lib/capabilityTerms.ts'
      - 'src/lib/dogovorenoVreme.ts'
      - 'src/lib/inicijali.ts'
      - 'src/lib/location.ts'
      - 'src/lib/market.ts'
      - 'src/lib/novac.ts'
      - 'src/lib/tacanTermin.ts'
      - 'src/lib/vreme.ts'
      - 'src/ui/calendar/calendarPresentation.ts'
      - 'src/ui/system/plural.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pkg049-price-authority-characterization-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/pkg049-private
      PKG049_ARTIFACT_DIR: /tmp/pkg049-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Bind exact source, check the proof files, install the dependencies and run the pure unit tests (pins, gate, B24 derivation, model, weakening plan, workflow coverage, dry runs of the P0 stage loop and of P1b)
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$PKG049_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' > "$PKG049_ARTIFACT_DIR/source-binding.txt"
          for file in pkg049_pins.mjs pkg049_lib.mjs pkg049_proof.mjs pkg049_pins.test.mjs pkg049_lib.test.mjs pkg049_blocks.test.mjs; do node --check "supabase/proofs/pkg049/$file"; done
          dependency_exit=0
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/01-dependencies.log" 2>&1 || dependency_exit=$?
          printf '01-dependencies exit=%s\n' "$dependency_exit" | tee "$PKG049_ARTIFACT_DIR/stages.txt"
          test "$dependency_exit" -eq 0
          git diff --exit-code
          node --test supabase/proofs/pkg049/*.test.mjs | tee "$PKG049_ARTIFACT_DIR/unit-tests.txt"
      - name: Reconstruct the existing disposable historical live79
        run: |
          set -euo pipefail
          umask 077
          setup_exit=0
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/02-live79.log" 2>&1 || setup_exit=$?
          printf '02-live79 exit=%s\n' "$setup_exit" | tee -a "$PKG049_ARTIFACT_DIR/stages.txt"
          exit "$setup_exit"
      - name: Guard loopback targets and replay the unchanged predecessor stages (source147 to PKG-050)
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          try {
            assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL, process.env.RU5_DEVICE_DB_URL);
            if (process.env.DB_URL !== process.env.RU5_DEVICE_DB_URL) throw new Error();
          } catch { console.error('FAIL PKG049_LOCAL_TARGET_ADMISSION'); process.exit(1); }
          NODE
          run_stage() {
            local stage="$1" status=0
            shift
            printf '%s START\n' "$stage" | tee -a "$PKG049_ARTIFACT_DIR/stages.txt"
            "$@" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$stage" "$status" | tee -a "$PKG049_ARTIFACT_DIR/stages.txt"
            return "$status"
          }
          # Exact stage order of ex04d-candidates-page-proof.yml and chat-voice-b1-dev-application-proof.yml up to PKG-050 (PKG-045a, which created rpc_read_task and rpc_list_my_tasks, is replayed inside stage 18).
          # pkg033a (exact DEV text, applied by stage 11) yields submit c98e5bee, select 7cbb8390 (asserted again by stage 12), the helper bd7ef029 and the PRE-B24 stale resolver d37c4f7c; pkg035a (applied by stage 13)
          # yields need_candidate_states_v5(uuid) 6d65e304 and selectable_application_count; the EX-04D proof asserts the helper and need_candidate_states_v5(uuid) equal the DEV pins on exactly this chain. Nothing after touches the price chain.
          run_stage 03-source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage 04-dev-alpha-to-pkg026 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage 05-pkg027 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage 06-pkg028 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage 07-pkg029 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage 08-pkg030 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage 09-pkg031 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage 10-pkg032 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage 11-pkg033 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage 12-pkg034 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage 13-pkg035 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage 14-pkg037 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage 15-pkg038 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage 16-pkg039 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage 17-pkg040 node supabase/proofs/pkg042/pkg042_proof.mjs replay
          run_stage 18-pkg042-to-pkg050 node supabase/proofs/pkg050/pkg050_proof.mjs
      - name: Pin gate, direct table writes (P1b), modified-client matrix, replay, stale reconfirm, selection, real client, Agreement change (D3), weakening probes, neutrality (actual Auth and PostgREST)
        run: |
          set -euo pipefail
          umask 077
          proof_exit=0
          timeout --signal=TERM --kill-after=10s 3000s node supabase/proofs/pkg049/pkg049_proof.mjs 2>&1 | tee "$PRE_V3_ARTIFACT_DIR/19-pkg049-proof.log" || proof_exit=${PIPESTATUS[0]}
          printf '19-pkg049-proof exit=%s\n' "$proof_exit" | tee -a "$PKG049_ARTIFACT_DIR/stages.txt"
          cp "$PRE_V3_ARTIFACT_DIR/pkg049-report.json" "$PKG049_ARTIFACT_DIR/pkg049-report.json" || true
          cp "$PRE_V3_ARTIFACT_DIR/pkg049-report.md" "$PKG049_ARTIFACT_DIR/pkg049-report.md" || true
          { echo '## PKG-049 price authority characterization (the label comes first: this is evidence about the disposable CHAIN, never about DEV; "PRICE-CHAIN BODIES == DEV" means ONLY that the pinned price-chain function bodies are byte-equal to the 2026-10-01 DEV readback, the chain otherwise lacks pkg051a, PKG-045b P0, B24 Part 2, Voice B1 and more; a PASS_WITH_GAPS result lists what was NOT demonstrated)'; echo; head -c 60000 "$PKG049_ARTIFACT_DIR/pkg049-report.md" 2>/dev/null || echo "(no markdown report: proof exit $proof_exit)"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$proof_exit"
      - name: Always discard the disposable database
        if: always()
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$PKG049_ARTIFACT_DIR"
          teardown_exit=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || teardown_exit=$?
          fi
          printf 'teardown exit=%s\n' "$teardown_exit" | tee -a "$PKG049_ARTIFACT_DIR/stages.txt"
          exit "$teardown_exit"
      - name: Upload only bounded source and result summaries including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pkg049-price-authority-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/pkg049-artifacts/source-binding.txt
            /tmp/pkg049-artifacts/unit-tests.txt
            /tmp/pkg049-artifacts/stages.txt
            /tmp/pkg049-artifacts/pkg049-report.json
            /tmp/pkg049-artifacts/pkg049-report.md
          if-no-files-found: error
          retention-days: 30
