name: P6 quarantined screen session
# HISTORICAL (2026-09-30): this workflow proved the Round52 (quarantined P6 screen session) while P6 was quarantined. Its evidence step commits to the branch and its
# static admission assumed the P6 reader was unreachable from src/app. The production reader cutover made that obsolete, so it no longer
# runs on pushes; run it manually only to reproduce the historical evidence. Current proofs: p6-native-apk.yml, p6-native-journey.yml,
# p6-client-final-check.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p6-screen-session-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prove:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: |
          set -euo pipefail
          mkdir -p /tmp/p6-screen
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          npm ci
          node --check scripts/proofs/p6-screen-session-record.cjs
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json
      - name: Focused P6 screen ownership
        run: npx jest --runInBand --testTimeout=30000 --runTestsByPath src/data/__tests__/discovery-v1-client-transport.test.ts src/data/__tests__/discovery-v1-screen-session.test.ts src/data/__tests__/discovery-v1-owner.test.ts src/data/__tests__/discovery-v1-marketplace-adapter.test.ts --json --outputFile=/tmp/p6-screen/focused.json
      - name: Existing Discovery regressions
        run: npx jest --runInBand --testTimeout=30000 --runTestsByPath src/data/__tests__/discovery-view.test.ts src/data/__tests__/discovery-map.test.tsx src/data/__tests__/discovery-presentation.test.tsx src/data/__tests__/discovery-v1-contract.test.ts src/data/__tests__/discovery-v1-spatial-contract.test.ts --json --outputFile=/tmp/p6-screen/existing.json
      - name: Full regression
        run: npx jest -w 3 --testTimeout=30000 --json --outputFile=/tmp/p6-screen/full.json
      - name: Enforce quarantine boundary
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-strings "rpc_discovery_v1" src/app src/data/supabaseIzvor.ts src/data/ports.ts; then exit 1; fi
          test "$(grep -c --fixed-strings "rpc_discovery_v1" src/data/discoveryV1ClientTransport.ts)" -ge 1
      - name: Evidence and control
        run: |
          node scripts/proofs/p6-screen-session-record.cjs record
          node scripts/control/osvezi.mjs > /tmp/p6-screen/control.log 2>&1
          node scripts/proofs/p6-screen-session-record.cjs verify
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/control/redovi.json docs/control/stanje.json docs/control/FINALIZATION_MATRIX.md docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_52_P6_QUARANTINED_SCREEN.md docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_52_P6_QUARANTINED_SCREEN_CHECKS.json
          git add -f docs/control/out/tabla.html
          git commit -m 'docs(control): record quarantined P6 screen ownership proof'
      - name: Guarded publication
        run: |
          branch='work/uskoci-ui-unification-20260924'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          node scripts/proofs/p6-screen-session-record.cjs verify
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > /tmp/p6-screen/published-head.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p6-screen-session-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/p6-screen/
          if-no-files-found: error
          retention-days: 30
