name: Build Android development APK

# Owner-approved OTA Preview native baseline (2026-10-06). Deliberate checkpoint; retry 5 resolves numeric compiled runtime resource refs before enforcement.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'APK target (phone: ARM64, emulator: x86_64)'
        type: choice
        required: true
        default: phone
        options:
          - phone
          - emulator
      # RNR-01 / B22 (owner decision 2026-10-02, "uvedi zakrpu"): the Reanimated patch is ON for every build. `skip` exists only to build the
      # BEFORE arm of the A/B measurement from the identical source (docs/implementation/product-v1-closure-20260926/finalization-20260927/
      # B22_REANIMATED_PATCH_20261002.md); such a build is named -unpatched and is never published as dev-latest.
      reanimated_patch:
        description: 'Reanimated patch RNR-01 (apply = normal build; skip = BEFORE arm of the B22 A/B measurement, never published)'
        type: choice
        required: true
        default: apply
        options:
          - apply
          - skip
  push:
    branches:
      - clean-alpha-backend
      - work/uskoci-ui-unification-20260924
    paths:
      - '.github/workflows/build-android-dev-apk.yml'

permissions:
  contents: write

env:
  # Public client configuration by design. No service-role/provider secret is stored here.
  EXPO_PUBLIC_SUPABASE_URL: https://leqcwgzvjsxugfgzdmth.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_o_I-YOn57oPCrIboF0OjPQ_c3DHmOZW
  EXPO_PUBLIC_USE_FAKE_SOURCE: '0'
  # PKG-016 / GAP-0007. configuredRecoveryRedirect() returns null unless this is present
  # and, on native, exactly equals the redirect the source pins. Without it the bundler
  # inlines undefined and the signed APK ships an app in which password recovery can
  # never work. The exact value is asserted below against the artifact, not assumed.
  EXPO_PUBLIC_AUTH_RECOVERY_REDIRECT_URL: uskociapp://oporavak
  # P6 (2026-09-30): the Zadaci route reads through the P6 server reader (rpc_discovery_v1) and needs the P6 rollout on the target backend. The
  # canonical DEV project carries it; a build for a backend without it must leave this out (or set it to '0'). It is a compile-time switch:
  # recompiling without it is the kill switch.
  EXPO_PUBLIC_P6_DISCOVERY_READER: '1'
  # EX-04 (2026-10-01, owner-approved native check on the HONOR): the paged own-task (S1), own-application (S2) and candidate (S4) readers. ex04a/b/c/d are applied on the
  # canonical DEV project (ledger 219); a build for a backend without them must leave these out. Compile-time switches, one per package; recompiling without them is the kill switch.
  EXPO_PUBLIC_EX04_OWN_TASKS_PAGED: '1'
  EXPO_PUBLIC_EX04_OWN_APPLICATIONS_PAGED: '1'
  EXPO_PUBLIC_EX04_CANDIDATES_PAGED: '1'
  # Voice B1 is applied on canonical DEV. B2 Android recording/player UI is included for scoped native acceptance.
  # Remove this flag and rebuild to return to V1 readers. AI PCM capture stays on its existing native adapter until parity is accepted.
  EXPO_PUBLIC_VOICE_MESSAGES: '1'
  # AI-LOCATION-01: DEV SQL 20261002185306 and interview Edge v51 readback verified.
  # Remove this compile-time flag and rebuild to disable contextual map replies.
  EXPO_PUBLIC_AI_LOCATION_DIALOGUE: '1'
  # MESSAGES-INBOX-01: DEV migration 20261002223407, exact RPC and ACL postflight passed.
  EXPO_PUBLIC_CONVERSATION_INBOX: '1'
  CI: '1'
  NODE_ENV: production

jobs:
  android-apk:
    runs-on: ubuntu-latest
    # 35 cut a run that was only slow (2026-10-07: run 37613049263 hit the limit; the build before took 24m42s).
    timeout-minutes: 55

    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked dependencies
        run: npm ci --include=dev

      # RNR-01 / B22: `npm ci` has already run patch-package (postinstall: --error-on-fail --error-on-warn) and the verifier. This step proves
      # again, before any native code is generated or compiled, that node_modules holds exactly the reviewed patched Reanimated file;
      # patch-package alone is silent when patches/ is missing, and Reanimated is compiled from node_modules in the Gradle build below.
      - name: Verify the Reanimated patch (RNR-01)
        if: ${{ inputs.reanimated_patch != 'skip' }}
        run: node scripts/verify-native-patches.cjs

      # BEFORE arm of the B22 measurement only (workflow_dispatch reanimated_patch=skip): same source, patch reversed, pristine file verified.
      - name: Reverse the Reanimated patch (BEFORE arm only)
        if: ${{ inputs.reanimated_patch == 'skip' }}
        run: |
          set -euo pipefail
          npx patch-package --reverse --error-on-fail
          node scripts/verify-native-patches.cjs --expect-unpatched

      - name: Verify canonical entry WebP contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const asset = 'assets/generated/uskoci-entry-city.webp';
          if (!fs.existsSync(asset)) {
            throw new Error(`Missing generated canonical entry asset: ${asset}`);
          }
          const bytes = fs.readFileSync(asset);
          const isWebP =
            bytes.subarray(0, 4).toString('ascii') === 'RIFF' &&
            bytes.subarray(8, 12).toString('ascii') === 'WEBP';
          if (!isWebP) {
            throw new Error(`Canonical entry asset extension/bytes mismatch: ${asset}`);
          }
          console.log(`[entry-reference] Android asset contract OK: ${asset}, ${bytes.length} bytes`);
          NODE

      - name: Verify canonical OTA Preview source and Location ancestry
        env:
          EAS_BUILD_PROFILE: preview
          USKOCI_OTA_TARGET: preview
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/work/uskoci-ui-unification-20260924'
          test "$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          for required in \
            ace26143288d83fc8c806eab2fc425a2638d0d34 \
            efd8f658708350d6f5100e435ec051878926028b \
            105bcae8ff741ea4a9540c6f29259852dcbf0edc \
            707d60ef653db46d094400e6bd30d0e1654a61e8 \
            d67afe76766573192af921211cb3803fe255ac76; do
            git merge-base --is-ancestor "$required" HEAD
            echo "Included ancestor: $required"
          done
          node scripts/ota-preview-guard.cjs
          node <<'NODE'
          const fs = require('fs');
          const config = require('./app.config.js')({ config: JSON.parse(fs.readFileSync('app.json', 'utf8')).expo });
          if (config.android.package !== 'rs.uskoci.preview') throw new Error('APK_NOT_PREVIEW_PACKAGE');
          if (config.runtimeVersion !== 'uskoci-v1-preview-r1') throw new Error('APK_RUNTIME_DRIFT');
          if (config.updates.requestHeaders['expo-channel-name'] !== 'preview') throw new Error('APK_CHANNEL_DRIFT');
          if (!config.updates.enabled) throw new Error('APK_UPDATES_DISABLED');
          console.log(JSON.stringify({package: config.android.package, version: config.version,
            versionCode: config.android.versionCode, runtimeVersion: config.runtimeVersion,
            channel: config.updates.requestHeaders['expo-channel-name'], updateUrl: config.updates.url}));
          NODE

      - name: Verify compiled APK attestor boundaries offline
        run: python3 -m unittest discover -s scripts/ci -p 'test_attest_ota_preview.py' -v

      - name: OTA source guards, TypeScript and full regression before native build
        env:
          NODE_ENV: test
        run: |
          set -euo pipefail
          # Match the proven source-test environment; these shell-only unsets do not alter the APK build flags.
          unset EXPO_PUBLIC_AUTH_RECOVERY_REDIRECT_URL EXPO_PUBLIC_P6_DISCOVERY_READER
          unset EXPO_PUBLIC_EX04_OWN_TASKS_PAGED EXPO_PUBLIC_EX04_OWN_APPLICATIONS_PAGED EXPO_PUBLIC_EX04_CANDIDATES_PAGED
          unset EXPO_PUBLIC_VOICE_MESSAGES EXPO_PUBLIC_AI_LOCATION_DIALOGUE EXPO_PUBLIC_CONVERSATION_INBOX
          npx jest scripts/__tests__/eas-preview-guard.test.ts scripts/__tests__/ota-preview-guard.test.ts src/data/__tests__/build-identity.test.tsx --runInBand
          npx tsc --noEmit
          npm test -- --runInBand

      - name: Generate native Android project
        env:
          EAS_BUILD_PROFILE: preview
          USKOCI_OTA_TARGET: preview
          USKOCI_PUSH_PROOF_BUILD: '0'
        run: npx expo prebuild --platform android --clean

      - name: Tune Gradle for CI APK
        env:
          USKOCI_ANDROID_BUILD_TARGET: ${{ inputs.target || 'phone' }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'android/gradle.properties';
          let text = fs.readFileSync(path, 'utf8');
          const setProp = (key, value) => {
            const re = new RegExp(`^${key.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&')}=.*$`, 'm');
            const line = `${key}=${value}`;
            text = re.test(text) ? text.replace(re, line) : `${text.trimEnd()}\n${line}\n`;
          };
          setProp('org.gradle.jvmargs', '-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8');
          const architectures = { phone: 'arm64-v8a', emulator: 'x86_64' };
          const target = process.env.USKOCI_ANDROID_BUILD_TARGET;
          if (!Object.hasOwn(architectures, target)) throw new Error('Unknown Android build target');
          setProp('reactNativeArchitectures', architectures[target]);
          fs.writeFileSync(path, text);
          NODE

      - name: Build standalone release APK
        working-directory: android
        env:
          EAS_BUILD_PROFILE: preview
          USKOCI_OTA_TARGET: preview
          USKOCI_PUSH_PROOF_BUILD: '0'
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -x lintVitalAnalyzeRelease

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk USKOCI-DEV.apk
          sha256sum USKOCI-DEV.apk > USKOCI-DEV.apk.sha256
          cp USKOCI-DEV.apk USKOCI-PREVIEW.apk
          sha256sum USKOCI-PREVIEW.apk > USKOCI-PREVIEW.apk.sha256

      # Record the compiled OTA verdict but do not fail before the artifact upload.
      # The enforcement step below runs only after the APK + receipts have been preserved.
      - name: Attest compiled OTA Preview identity and signing
        env:
          USKOCI_ANDROID_BUILD_TARGET: ${{ inputs.target || 'phone' }}
        run: |
          set -uo pipefail
          attest_rc=0
          python3 scripts/ci/attest_ota_preview.py USKOCI-PREVIEW.apk USKOCI-OTA-PREVIEW-receipt.json || attest_rc=$?
          if [ ! -f USKOCI-OTA-PREVIEW-receipt.json ]; then
            node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('USKOCI-OTA-PREVIEW-receipt.json', JSON.stringify({
            status: 'APK_ATTESTATION_FAILED',
            error: 'attestor exited without writing a receipt',
            sourceSha: process.env.GITHUB_SHA || null,
            githubRunId: process.env.GITHUB_RUN_ID || null,
            physicalPhone: 'NOT_TESTED',
            otaPreview: 'NOT_VERIFIED',
            production: 'NOT_BUILT_OR_DEPLOYED'
          }, null, 2) + '\n');
          NODE
          fi
          {
            echo '### OTA Preview APK boundary receipt — not phone verification'
            echo '```json'
            cat USKOCI-OTA-PREVIEW-receipt.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$attest_rc" -ne 0 ]; then
            echo "::warning::Compiled OTA Preview attestation recorded a failure; the APK and receipt will be uploaded before enforcement."
          fi
          true

      - name: Attest the recovery redirect is compiled into the artifact
        run: |
          set -euo pipefail
          USKOCI_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')" \
            python3 scripts/ci/attest_recovery_redirect.py \
              USKOCI-DEV.apk USKOCI-DEV-recovery-attestation.json
          cat USKOCI-DEV-recovery-attestation.json

      - name: Attest the launcher icon is the one in the artifact
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow
          USKOCI_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')" \
            python3 scripts/ci/attest_launcher_icon.py \
              USKOCI-DEV.apk USKOCI-DEV-icon-attestation.json
          cat USKOCI-DEV-icon-attestation.json

      # RNR-01 / B22: the log marker USKOCI_RNR01 exists only in the patched NativeProxy.kt, so its presence in the dex files of the APK says the
      # patched Reanimated is what was compiled (and its absence in the BEFORE arm says the reverse). The receipt travels with the APK.
      # This step only records a verdict and never fails the job itself: the artifact upload below must happen first, so that a surprise (for
      # example a marker that does not survive into the dex) leaves the APK and the receipt to inspect. The step after the upload enforces it.
      - name: Attest the Reanimated patch state of the artifact (RNR-01)
        id: rnr01_attest
        env:
          USKOCI_RNR01_EXPECT: ${{ inputs.reanimated_patch == 'skip' && 'unpatched' || 'patched' }}
        run: |
          set -uo pipefail
          dex_dir="$(mktemp -d)"
          dex_files=0
          hits=0
          if unzip -q -o USKOCI-DEV.apk 'classes*.dex' -d "${dex_dir}"; then
            for dex in "${dex_dir}"/classes*.dex; do
              if [ -f "${dex}" ]; then dex_files=$((dex_files + 1)); fi
            done
          fi
          if [ "${dex_files}" -ge 1 ]; then
            hits="$( { grep -a -c 'USKOCI_RNR01' "${dex_dir}"/classes*.dex || true; } | awk -F: '{ s += $NF } END { print s + 0 }')" # grep -c exits 1 when nothing matches (the unpatched arm): under GitHub's bash -e plus pipefail that would abort the step before the verdict is recorded
          fi
          verdict=pass
          reason=ok
          if [ "${dex_files}" -lt 1 ]; then
            verdict=fail
            reason='the APK holds no classes*.dex, so the marker scan proves nothing'
          elif [ "${USKOCI_RNR01_EXPECT}" = patched ] && [ "${hits}" -lt 1 ]; then
            verdict=fail
            reason='patched build without the patch marker in classes*.dex'
          elif [ "${USKOCI_RNR01_EXPECT}" = unpatched ] && [ "${hits}" -ne 0 ]; then
            verdict=fail
            reason='unpatched build carries the patch marker in classes*.dex'
          fi
          echo "dex files: ${dex_files}; dex lines carrying the patch log marker: ${hits} (expected state: ${USKOCI_RNR01_EXPECT}) -> ${verdict}: ${reason}"
          { echo "verdict=${verdict}"; echo "reason=${reason}"; } >> "${GITHUB_OUTPUT}"
          USKOCI_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')" USKOCI_DEX_HITS="${hits}" USKOCI_DEX_FILES="${dex_files}" \
            USKOCI_VERDICT="${verdict}" USKOCI_REASON="${reason}" node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const sha = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const lib = 'node_modules/react-native-reanimated';
          const receipt = {
            patchState: process.env.USKOCI_RNR01_EXPECT,
            verdict: process.env.USKOCI_VERDICT,
            reason: process.env.USKOCI_REASON,
            dexFiles: Number(process.env.USKOCI_DEX_FILES),
            dexMarkerLines: Number(process.env.USKOCI_DEX_HITS),
            reanimatedVersion: JSON.parse(fs.readFileSync(`${lib}/package.json`, 'utf8')).version,
            patchFileSha256: sha('patches/react-native-reanimated+4.5.1.patch'),
            installedNativeProxySha256: sha(`${lib}/android/src/main/java/com/swmansion/reanimated/NativeProxy.kt`),
            apkSha256: fs.readFileSync('USKOCI-DEV.apk.sha256', 'utf8').split(/\s+/)[0],
            sourceTree: process.env.USKOCI_SOURCE_TREE,
            workflowRun: process.env.GITHUB_RUN_ID || null,
          };
          fs.writeFileSync('USKOCI-DEV-reanimated-patch-attestation.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE
          cat USKOCI-DEV-reanimated-patch-attestation.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: USKOCI-OTA-PREVIEW-APK${{ inputs.reanimated_patch == 'skip' && '-unpatched' || '' }}
          path: |
            USKOCI-PREVIEW.apk
            USKOCI-PREVIEW.apk.sha256
            USKOCI-OTA-PREVIEW-receipt.json
            USKOCI-DEV-recovery-attestation.json
            USKOCI-DEV-icon-attestation.json
            USKOCI-DEV-reanimated-patch-attestation.json
          retention-days: 14

      # RNR-01 / B22: fails the job (after the upload above, before any publishing) when the attestation verdict is not pass.
      - name: Enforce the Reanimated patch attestation (RNR-01)
        if: ${{ steps.rnr01_attest.outputs.verdict != 'pass' }}
        env:
          RNR01_REASON: ${{ steps.rnr01_attest.outputs.reason }}
        run: |
          echo "::error::The Reanimated patch attestation failed: ${RNR01_REASON}. The APK and the receipt are in the workflow artifact for inspection. Nothing was published."
          exit 1

      - name: Enforce compiled OTA Preview identity and signing
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          receipt = json.loads(Path('USKOCI-OTA-PREVIEW-receipt.json').read_text(encoding='utf-8'))
          if receipt.get('status') != 'APK_ATTESTED_NOT_PHONE_VERIFIED':
              print('::error::Compiled OTA Preview attestation failed after artifact upload: ' + str(receipt.get('error') or receipt), file=sys.stderr)
              raise SystemExit(1)
          print('Compiled OTA Preview APK identity/signing attestation passed.')
          PY

      # A proof run from a working branch must not delete and recreate the published
      # dev-latest release. Publishing stays bound to the canonical branch; the APK and
      # its attestation are still uploaded as workflow artifacts on every run. A BEFORE-arm build (reanimated_patch=skip) is never published.
      # RNR-01 / B22 publish gate: every build carries the Reanimated patch, and a push to the canonical branch that touches this file builds
      # automatically. A patched APK replaces the public dev-latest pre-release only after the owner decided it may, by setting the
      # repository variable RNR01_PUBLISH_PATCHED to yes (docs/implementation/product-v1-closure-20260926/finalization-20260927/B22_REANIMATED_PATCH_20261002.md).
      - name: Refresh dev-latest pre-release
        if: github.ref == 'refs/heads/clean-alpha-backend' && inputs.reanimated_patch != 'skip' && vars.RNR01_PUBLISH_PATCHED == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest \
            USKOCI-DEV.apk \
            USKOCI-DEV.apk.sha256 \
            USKOCI-DEV-recovery-attestation.json \
            USKOCI-DEV-icon-attestation.json \
            USKOCI-DEV-reanimated-patch-attestation.json \
            --target "${GITHUB_SHA}" \
            --title 'USKOČI DEV — Android APK' \
            --notes 'Development APK connected to the live USKOČI Supabase backend. This is not a Play Store release.' \
            --prerelease

      - name: Note that dev-latest was not refreshed (RNR-01 publish gate)
        if: github.ref == 'refs/heads/clean-alpha-backend' && inputs.reanimated_patch != 'skip' && vars.RNR01_PUBLISH_PATCHED != 'yes'
        run: echo "::notice::dev-latest was NOT refreshed. The APK of this run carries the Reanimated patch (B22) and is only in the workflow artifact. Set the repository variable RNR01_PUBLISH_PATCHED to yes once the owner decides that a patched build may replace dev-latest."
