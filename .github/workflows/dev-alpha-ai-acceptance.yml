name: DEV AI acceptance (authenticated)

# Runs the real authenticated product chain against canonical DEV/ALPHA:
# AUTH -> conversation -> real Gemini turns -> review -> confirmation ->
# canonical writers -> authoritative readback.
#
# Manual only. It spends the shared owner-approved AI test budget, so the
# provider call ceiling is an explicit input and the job never runs on push.
#
# The account password lives only in the `dev-alpha-acceptance` environment
# secret DEV_ACCEPTANCE_PASSWORD. It is never printed, never committed and
# never written into the evidence artifact.

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Which acceptance scenarios to run
        type: choice
        default: both
        options: [both, worker, need]
      max_provider_calls:
        description: Hard ceiling of real provider calls for this run
        type: string
        default: '12'

permissions:
  contents: read

concurrency:
  group: dev-alpha-ai-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    environment: dev-alpha-acceptance
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Refuse to start without an acceptance credential
        env:
          DEV_ACCEPTANCE_EMAIL: ${{ vars.DEV_ACCEPTANCE_EMAIL || secrets.DEV_ACCEPTANCE_EMAIL }}
          DEV_ACCEPTANCE_PASSWORD: ${{ secrets.DEV_ACCEPTANCE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DEV_ACCEPTANCE_EMAIL" || { echo 'DEV_ACCEPTANCE_EMAIL variable missing'; exit 1; }
          test -n "$DEV_ACCEPTANCE_PASSWORD" || { echo 'DEV_ACCEPTANCE_PASSWORD secret missing'; exit 1; }
          case "$DEV_ACCEPTANCE_EMAIL" in
            *@*) ;;
            *) echo 'DEV_ACCEPTANCE_EMAIL is not an address'; exit 1 ;;
          esac
      - name: Authenticated AI acceptance on canonical DEV/ALPHA
        env:
          DEV_ACCEPTANCE_EMAIL: ${{ vars.DEV_ACCEPTANCE_EMAIL || secrets.DEV_ACCEPTANCE_EMAIL }}
          DEV_ACCEPTANCE_PASSWORD: ${{ secrets.DEV_ACCEPTANCE_PASSWORD }}
          DEV_ACCEPTANCE_URL: https://leqcwgzvjsxugfgzdmth.supabase.co
          DEV_ACCEPTANCE_SCENARIOS: ${{ inputs.scenarios }}
          DEV_ACCEPTANCE_MAX_PROVIDER_CALLS: ${{ inputs.max_provider_calls }}
          DEV_ACCEPTANCE_OUT: artifacts/dev-acceptance
        run: node scripts/acceptance/dev_ai_acceptance.mjs
      - name: Keep the sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEV-AI-ACCEPTANCE-${{ github.run_id }}
          path: artifacts/dev-acceptance/
          if-no-files-found: warn
          retention-days: 14
