name: Owner-bound AI taxonomy change requests PostgreSQL proof
on:
  push:
    branches: [fix/match-ai-category-fallback-20261010]
    paths:
      - '.github/workflows/taxonomy-owner-change-requests-proof.yml'
      - 'supabase/candidates/dynamic-taxonomy-20261011/dev-owner-bound-taxonomy-change-requests.sql'
      - 'supabase/candidates/dynamic-taxonomy-20261011/disposable-owner-change-*.sql'
  pull_request:
    paths:
      - '.github/workflows/taxonomy-owner-change-requests-proof.yml'
      - 'supabase/candidates/dynamic-taxonomy-20261011/dev-owner-bound-taxonomy-change-requests.sql'
      - 'supabase/candidates/dynamic-taxonomy-20261011/disposable-owner-change-*.sql'
permissions:
  contents: read
jobs:
  owner-confirmed-taxonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: ['16','17']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Create isolated repository-backed catalog and fake requesters
        run: |
          set -euo pipefail
          d=supabase/candidates/dynamic-taxonomy-20261011
          psql -X -v ON_ERROR_STOP=1 -f "$d/disposable-fixture.sql"
          for file in dev-dark-launch-locked.sql dev-seed-legacy-families.sql dev-execution-scopes-two-root.sql; do
            psql -X -v ON_ERROR_STOP=1 -1 -f "$d/$file"
          done
          psql -X -v ON_ERROR_STOP=1 -f "$d/disposable-owner-change-fixture.sql"
      - name: Install owner-locked pending review queue with exact permission checks
        run: |
          psql -X -v ON_ERROR_STOP=1 -1 -f supabase/candidates/dynamic-taxonomy-20261011/dev-owner-bound-taxonomy-change-requests.sql
      - name: Test owner scope revision idempotency blocked and regulated services
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-owner-change-assert.sql
      - name: Prove installation is fail-closed if repeated
        run: |
          set -euo pipefail
          f=supabase/candidates/dynamic-taxonomy-20261011/dev-owner-bound-taxonomy-change-requests.sql
          if psql -X -v ON_ERROR_STOP=1 -1 -f "$f" >/tmp/repeat.log 2>&1; then
            echo 'UNSAFE_DUPLICATE_ACCEPTED'; exit 1
          fi
          grep -q 'USKOCI_TAXONOMY_CHANGE_REQUESTS_ALREADY_INSTALLED' /tmp/repeat.log
          echo 'OWNER_BOUND_PENDING_TAXONOMY_CHANGE_PASS'
