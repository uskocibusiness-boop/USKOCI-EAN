name: Discovery applied-reader 40000-task baseline

# Disposable baseline of the applied DISCOVERY-GRAD reader, with relevant-body fidelity and real Auth/PostgREST.
# 40000 synthetic tasks, two accounts, serial measurements. NOT a 40000-concurrent-user or lifecycle proof. Never touches DEV.
on:
  workflow_dispatch:
  push:
    branches: [proof/discovery-baseline-40k-20261009]
    paths:
      - '.github/workflows/discovery-grad-proof.yml'
      - 'supabase/candidates/discovery-grad-20261008/**'
      - 'supabase/proofs/discovery-grad/**'
      - 'supabase/proofs/match-v1/**'
permissions:
  contents: read
concurrency:
  group: discovery-grad-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-proof:
    # Each run creates and then discards its own database; no remote credentials or workload.
    name: ${{ matrix.part }}
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [load]
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/discovery-grad-private
      WPP01_ARTIFACT_DIR: /tmp/discovery-grad-private/wpp01
      EX06E_R2_DIR: /tmp/discovery-grad-private/ex06e-r2
      EX06E_R3_DIR: /tmp/discovery-grad-private/ex06e-r3
      MATCH_V1_ARTIFACT_DIR: /tmp/discovery-grad-artifacts/chain
      DISCOVERY_GRAD_ARTIFACT_DIR: /tmp/discovery-grad-artifacts
      DG_LOAD_TASKS: '40000'
      DG_LOAD_MODE: deployed-baseline
      DG_AREA_EXPERIMENT: DISPOSABLE_AREA_DEDUP
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Bind exact source and check every generated SQL file offline
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$WPP01_ARTIFACT_DIR" "$EX06E_R2_DIR" "$EX06E_R3_DIR" "$MATCH_V1_ARTIFACT_DIR" "$DISCOVERY_GRAD_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' > "$DISCOVERY_GRAD_ARTIFACT_DIR/source-binding.txt"
          python3 -m pip install --quiet pglast==8.4
          python3 supabase/proofs/discovery-grad/check_source.py | tee "$DISCOVERY_GRAD_ARTIFACT_DIR/source-check.txt"
          python3 supabase/proofs/match-v1/check_source.py > "$DISCOVERY_GRAD_ARTIFACT_DIR/predecessor-source-check.txt"
          python3 supabase/candidates/worker-personal-profile-20261003/check-source.py > "$PRE_V3_ARTIFACT_DIR/wpp01-source-check.txt"
          for f in supabase/proofs/discovery-grad/*.mjs supabase/proofs/match-v1/chain.mjs supabase/proofs/match-v1/fidelity.mjs; do node --check "$f"; done
          node --test supabase/proofs/discovery-grad/read-transport.test.mjs
          find supabase/candidates/discovery-grad-20261008 supabase/proofs/discovery-grad -type f -print0 | sort -z | xargs -0 sha256sum > "$DISCOVERY_GRAD_ARTIFACT_DIR/source-manifest-sha256.txt"
          sha256sum .github/workflows/discovery-grad-proof.yml >> "$DISCOVERY_GRAD_ARTIFACT_DIR/source-manifest-sha256.txt"
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/npm.log" 2>&1
          git diff --exit-code
      - name: Reconstruct the established disposable historical live79
        run: |
          set -euo pipefail
          umask 077
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/live79.log" 2>&1
      - name: Guard loopback targets, replay the chain in DEV order and apply the three DEV predecessors
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          try {
            assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL, process.env.RU5_DEVICE_DB_URL);
            if (process.env.DB_URL !== process.env.RU5_DEVICE_DB_URL) throw new Error();
          } catch { console.error('FAIL DISCOVERY_GRAD_LOCAL_TARGET_ADMISSION'); process.exit(1); }
          NODE
          node supabase/proofs/match-v1/chain.mjs
          node supabase/proofs/match-v1/fidelity.mjs
          node supabase/proofs/discovery-grad/predecessors.mjs
      - name: Measure the applied reader on 40000 isolated tasks
        if: matrix.part == 'load'
        run: |
          set -euo pipefail
          umask 077
          status=0
          node supabase/proofs/discovery-grad/load.proof.mjs 2>&1 | tee "$PRE_V3_ARTIFACT_DIR/load.log" || status=${PIPESTATUS[0]}
          grep -E '^(PASS|FAIL) ' "$PRE_V3_ARTIFACT_DIR/load.log" > "$DISCOVERY_GRAD_ARTIFACT_DIR/load-checks.txt" || true
          if [ -f "$DISCOVERY_GRAD_ARTIFACT_DIR/load-summary.md" ]; then cat "$DISCOVERY_GRAD_ARTIFACT_DIR/load-summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          test "$status" -eq 0
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const dir = process.env.DISCOVERY_GRAD_ARTIFACT_DIR;
          const report = JSON.parse(readFileSync(dir + '/load-report.json', 'utf8'));
          assert.equal(report.sourceSha, process.env.GITHUB_SHA);
          assert.equal(report.result, 'PASS');
          assert.equal(report.failures.length, 0);
          const recoveries = report.httpTransportRecoveries ?? [];
          assert.equal(report.httpTransport, recoveries.length ? 'PASS_WITH_RECORDED_SOCKET_RECOVERY' : 'ALL_FIRST_ATTEMPTS_SUCCEEDED');
          for (const recovery of recoveries) {
            assert.equal(recovery.outcome, 'RECOVERED'); assert.equal(recovery.status, 0); assert.ok(!recovery.code);
            assert.match(recovery.details, /\bUND_ERR_SOCKET\b/);
            assert.ok(recovery.totalElapsedMs >= recovery.initialElapsedMs);
          }
          assert.equal(report.liveAccess, false);
          assert.equal(report.providerCalls, 0);
          assert.equal(report.pushSends, 0);
          assert.equal(report.mode, 'DEPLOYED_BASELINE');
          assert.equal(report.tasks, 40000);
          assert.equal(report.population.simultaneousRequests, 1);
          assert.equal(report.baseline.readerMd5, 'a9b0985991f4ebfe4e95143e5cf57222');
          assert.equal(report.baseline.foldMd5, '41353abe05d434d513495ae5974b9802');
          assert.equal(report.areaExperiment.state, 'SEMANTICS_PASS_PERFORMANCE_REPORTED');
          assert.equal(report.areaExperiment.finalReaderMd5, report.baseline.readerMd5);
          assert.equal(report.areaExperiment.s3Applied, false);
          assert.equal(report.areaExperiment.corpusRows, 27);
          assert.deepEqual(report.areaExperiment.nullKeyCorpus, {cases: 27, distinctKeys: 27, mismatches: 0});
          for (const fixture of ['repeatedLocations', 'uniqueLocations']) {
            const result = report.areaExperiment.fixtures[fixture];
            assert.ok(result.exact.fullResponseComparisons > 0);
            assert.equal(result.exact.timestampMasking, false);
            assert.deepEqual(result.exact.terminalPages, {corpus0: 14, placesCorpus: 3});
            for (const stage of ['baseline', 'candidate', 'revertedBaseline']) assert.equal(Object.keys(result.stages[stage]).length, 16);
          }
          for (const file of ['chain/chain-fidelity.json', 'predecessor-fidelity.json'])
            assert.equal(JSON.parse(readFileSync(dir + '/' + file, 'utf8')).result, 'PASS');
          const required = ['DISCOVERY_GRAD_LOAD_SEEDED', 'DEPLOYED_BASELINE_EXACT_BODY_ACL_DEPENDENCIES_CERTIFICATE',
            'DEPLOYED_BASELINE_COUNTS_FILTERS_RESPONSE_BOUNDS', 'DEPLOYED_BASELINE_AUTHENTICATED_HTTP',
            'DEPLOYED_BASELINE_POSTLOAD_FIDELITY', 'DEPLOYED_BASELINE_RELEVANT_CHAIN_FIDELITY',
            'DEPLOYED_BASELINE_FOUR_REQUEST_PROFILES'];
          for (const name of required) assert.ok(report.checks.some(c => c.name === name && c.result === 'PASS'), name);
          NODE
      - name: Always discard the disposable database
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$DISCOVERY_GRAD_ARTIFACT_DIR"
          code=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || code=$?
          fi
          printf 'teardown exit=%s\n' "$code" >> "$DISCOVERY_GRAD_ARTIFACT_DIR/teardown.txt"
          exit "$code"
      - name: Upload only bounded source and result summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: discovery-grad-${{ matrix.part }}-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/discovery-grad-artifacts/
          if-no-files-found: error
          retention-days: 30
