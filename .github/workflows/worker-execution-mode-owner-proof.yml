name: Worker explicit onsite remote preference and auth proof
on:
  push:
    branches: [fix/match-ai-category-fallback-20261010]
    paths:
      - '.github/workflows/worker-execution-mode-owner-proof.yml'
      - 'supabase/candidates/dynamic-taxonomy-20261011/dev-worker-mode-consent-rpc.sql'
      - 'supabase/candidates/dynamic-taxonomy-20261011/disposable-worker-mode-*.sql'
  pull_request:
    paths:
      - '.github/workflows/worker-execution-mode-owner-proof.yml'
      - 'supabase/candidates/dynamic-taxonomy-20261011/dev-worker-mode-consent-rpc.sql'
      - 'supabase/candidates/dynamic-taxonomy-20261011/disposable-worker-mode-*.sql'
permissions:
  contents: read
jobs:
  owner-mode-choice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: ['16','17']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Prepare synthetic Auth/profile fixtures
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-worker-mode-auth-fixture.sql
      - name: Install owner-bound mode preference schema and RPCs
        run: psql -X -v ON_ERROR_STOP=1 -1 -f supabase/candidates/dynamic-taxonomy-20261011/dev-worker-mode-consent-rpc.sql
      - name: Verify owner-only saves and remote+on-site choice without matching authority
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-worker-mode-owner-assert.sql
      - name: Repeated installation rejects without state changes
        run: |
          set -euo pipefail
          if psql -X -v ON_ERROR_STOP=1 -1 -f supabase/candidates/dynamic-taxonomy-20261011/dev-worker-mode-consent-rpc.sql >/tmp/repeat.log 2>&1; then
            echo 'WRONG_DUPLICATE_MIGRATION_ACCEPTED'; exit 1
          fi
          grep -q 'USKOCI_WORKER_MODE_CHOICES_ALREADY_INSTALLED' /tmp/repeat.log
          echo 'WORKER_EXPLICIT_MODE_CHOICE_PG_PROOF_PASS'
