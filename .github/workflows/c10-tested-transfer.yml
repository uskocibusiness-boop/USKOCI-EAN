name: C10 bounded tested source transfer

on:
  push:
    branches: [work/rev14-review-f17]
    paths: [.github/workflows/c10-tested-transfer.yml]

permissions:
  contents: write

jobs:
  tested-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.5.6
      - name: Admit and apply only the reviewed 19-file source delta
        env:
          C10_DELTA: 
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'uskocibusiness-boop/USKOCI-EAN'
          test "$GITHUB_REF" = 'refs/heads/work/rev14-review-f17'
          test "$(git rev-parse HEAD^)" = '0f4006ae7c2fd962d3705ed18102e81835325cc6'
          python - <<'PYCODE'
          import base64,gzip,hashlib,json,os,subprocess
          from pathlib import Path
          h=lambda data:hashlib.sha256(data).hexdigest()
          raw=gzip.decompress(base64.b64decode(os.environ['C10_DELTA'],validate=True))
          assert h(raw)=='d6f9949b2f9f2eaa24a6337a2bf04c584f51f8b80bc3a66449803cecc9324a83','DELTA_MISMATCH'
          data=json.loads(raw);root=Path.cwd()
          changed=set(subprocess.check_output(['git','diff','--name-only',data['source'],'HEAD'],text=True).splitlines())
          assert changed=={'.github/workflows/c10-source-transfer.yml','.github/workflows/c10-tested-transfer.yml'},'NEWER_SOURCE_PRESENT'
          assert len(data['changes'])==19
          for item in data['changes']:
              path=root/item['path'];assert path.resolve().is_relative_to(root) and not item['path'].startswith('.')
              actual=h(path.read_bytes()) if path.exists() else None
              assert actual==item['before'],'PREIMAGE:'+item['path']
          for item in data['changes']:
              path=root/item['path']
              if item['after'] is None:path.unlink();continue
              if item['before'] is None:content=item['content']
              else:
                  lines=path.read_bytes().decode().splitlines(keepends=True)
                  for start,end,replacement in reversed(item['edits']):
                      assert 0<=start<=end<=len(lines)
                      lines[start:end]=replacement
                  content=''.join(lines)
              value=content.encode();assert h(value)==item['after'],'POSTIMAGE:'+item['path']
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(value)
          evidence=Path(os.environ['RUNNER_TEMP'])/'c10';evidence.mkdir()
          (evidence/'delta.json').write_bytes(raw)
          subprocess.run(['git','add','--',*[v['path'] for v in data['changes']]],check=True)
          print('C10_EXACT_SOURCE_DELTA_ADMITTED',len(data['changes']))
          PYCODE
          git diff --cached --check
      - name: Install the exact existing lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node -e "const a=require('typescript').version,b=require('./package-lock.json').packages['node_modules/typescript'].version;if(a!==b)throw Error('TYPESCRIPT_LOCK_MISMATCH');console.log('PINNED_TYPESCRIPT',a)"
      - name: Current intake and config proofs
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=spec --test-concurrency=1 supabase/proofs/ai/intake_module_boundary.test.mjs supabase/proofs/ai/single_pass_edge.test.mjs supabase/proofs/ai/v5_worker_edge.test.mjs supabase/proofs/ai/taxonomy_runtime_config.test.mjs supabase/proofs/dynamic_taxonomy/classification-gemini-shadow-source.test.mjs | tee "$RUNNER_TEMP/c10/intake.log"
      - name: Current Need context and business safety proofs
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=spec supabase/proofs/ai/ai_edge_context.test.mjs | tee "$RUNNER_TEMP/c10/context.log"
      - name: Current catalog hierarchy and ownership proofs
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=spec --test-concurrency=1 supabase/proofs/ai/background_catalog_completeness.test.mjs supabase/proofs/ai/background_catalog_hierarchy.test.mjs supabase/proofs/ai/background_catalog_lifecycle.test.mjs supabase/proofs/ai/background_taxonomy_scope.test.mjs supabase/proofs/ai/background_taxonomy_failures.test.mjs | tee "$RUNNER_TEMP/c10/catalog.log"
      - name: Continuity and retained accounting negatives
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=spec --test-concurrency=1 supabase/proofs/ai/single_pass_continuity.test.mjs supabase/proofs/ai/classification-full-catalog-edge.test.mjs supabase/proofs/ai/ai_accounting_transport.test.mjs supabase/proofs/ai/gemini_usage.test.mjs | tee "$RUNNER_TEMP/c10/continuity.log"
      - name: TypeScript and paired Edge import checks
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/c10/typescript.log"
          deno check --no-config --no-lock --no-npm --no-remote supabase/functions/uskoci-ai-interview/index.ts supabase/functions/uskoci-worker-interview/index.ts 2>&1 | tee "$RUNNER_TEMP/c10/deno.log"
          node supabase/operations/dev-alpha/r04-single-pass-20261103/edge-package.mjs --check | tee "$RUNNER_TEMP/c10/frozen-package.log"
          git diff --exit-code
      - name: Record measured results and exact source hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          evidence=Path(os.environ['RUNNER_TEMP'])/'c10';data=json.loads((evidence/'delta.json').read_bytes())
          h=lambda value:hashlib.sha256(value).hexdigest()
          results={}
          for name,passed,todo in [('intake',147,0),('context',174,1),('catalog',93,0),('continuity',101,0)]:
              text=(evidence/(name+'.log')).read_text()
              text=re.sub(r'\x1b\[[0-9;]*m','',text)
              get=lambda key:int(re.findall(r'(?:^|\n)[^\n]*?\b'+key+r' (\d+)\s*(?:\n|$)',text)[-1])
              result={key:get(key) for key in ['tests','pass','fail','cancelled','skipped','todo']}
              assert result=={'tests':passed+todo,'pass':passed,'fail':0,'cancelled':0,'skipped':0,'todo':todo},(name,result)
              results[name]=result
          for item in data['changes']:
              path=Path(item['path']);actual=h(path.read_bytes()) if path.exists() else None
              assert actual==item['after'],'TEST_MUTATED_SOURCE:'+item['path']
          receipt={'scope':'C10_TARGETED_SOURCE_NOT_DEV','baseSource':data['source'],'runSource':os.environ['GITHUB_SHA'],
              'runId':os.environ['GITHUB_RUN_ID'],'runUrl':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
              'deltaSha256':h((evidence/'delta.json').read_bytes()),'results':results,'typescript':'PASS','denoTwoHandlers':'PASS','frozenPackage':'PASS',
              'node':subprocess.check_output(['node','--version'],text=True).strip(),
              'typescriptVersion':subprocess.check_output(['node','-p',"require('typescript').version"],text=True).strip(),
              'files':[{k:v[k] for k in ['path','before','after']} for v in data['changes']],
              'limitations':['synthetic IO, not real Auth/provider','not full CI','no DEV write or Edge deployment','no APK/device/E2E','C10 remains partial']}
          path=Path('supabase/proofs/ai/c10_intake_cleanup_ci_receipt.json');assert not path.exists()
          path.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          (evidence/'receipt.json').write_bytes(path.read_bytes())
          subprocess.run(['git','add','--',str(path)],check=True)
          PYCODE
          git diff --cached --check
      - name: Commit tested source without overwriting newer work
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_WRITE_TOKEN" | base64 -w0)"
          remote="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/work/rev14-review-f17 | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(ai): retire inactive catalog exploration and align intake proofs'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/work/rev14-review-f17
          git rev-parse HEAD | tee "$RUNNER_TEMP/c10/published-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c10-tested-source-evidence
          path: ${{ runner.temp }}/c10/
          if-no-files-found: error
          retention-days: 7
