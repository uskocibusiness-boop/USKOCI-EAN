name: USKOCI bounded product restructuring

on:
  push:
    branches: [work/product-cleanup-20261104]
    paths: [.github/workflows/uskoci-product-refactor-once.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uskoci-product-restructure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  accept-and-publish:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/product-cleanup-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
      BASELINE_SHA: a3623973450130fcf0e770f9ed28f315f366d5b2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require exact isolated preparation, never overwrite newer product code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import os, subprocess
          allowed={'.github/workflows/uskoci-product-baseline.yml','.github/workflows/uskoci-product-refactor-once.yml','scripts/product-audit.cjs','scripts/product-audit.test.cjs','scripts/product-refactor-once.cjs'}
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASELINE_SHA'],'HEAD']).decode().splitlines())
          if changed != allowed: raise SystemExit('PREPARATION_SCOPE_CHANGED: '+repr(sorted(changed ^ allowed)))
          PY
          mkdir -p "$RUNNER_TEMP/uskoci-refactor"
          git worktree add --detach "$RUNNER_TEMP/uskoci-before" "$BASELINE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies, preserving existing patch and asset preparation
        run: npm ci
      - name: Apply only the locally verified five-file relocation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '8307edcfafc9b88cb86084872c52d78f909d9b8f2a1fbea87f4a3147c82ae97e  scripts/product-audit.cjs' '7b3e7743e374281a783eed6ed8d22457aacd93773c513f4ccab5cb0b06cf5c31  scripts/product-audit.test.cjs' | sha256sum --check
          node scripts/product-refactor-once.cjs
          git diff --cached --check
      - name: Verify every original file and mapped static dependency before tests
        shell: bash
        run: |
          node - <<'JS'
          const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const {audit}=require('./scripts/product-audit.cjs');
          const out=path.join(process.env.RUNNER_TEMP,'uskoci-refactor');
          const beforeRoot=path.join(process.env.RUNNER_TEMP,'uskoci-before');
          const relocation=JSON.parse(fs.readFileSync(path.join(out,'relocation.json'),'utf8'));
          const move=p=>relocation.moves[p]||p;
          const entries=cp.execFileSync('git',['ls-tree','-rz',process.env.BASELINE_SHA]).toString().split('\0').filter(Boolean).map(row=>{
            const [meta,p]=row.split('\t');const [mode,type,gitBlob]=meta.split(' ');return {path:p,mode,type,gitBlob};
          }).filter(e=>e.type==='blob');
          const before=audit(beforeRoot,entries);
          const after=audit(process.cwd(),entries.map(e=>({...e,path:move(e.path),gitBlob:null})));
          const key=(e,mapping)=>JSON.stringify([mapping(e.from),mapping(e.to),e.kind]);
          assert.deepEqual(after.edges.map(e=>key(e,x=>x)).sort(),before.edges.map(e=>key(e,move)).sort());
          assert.deepEqual(after.unresolved.map(e=>JSON.stringify([e.from,e.specifier,e.kind])).sort(),before.unresolved.map(e=>JSON.stringify([move(e.from),e.specifier,e.kind])).sort());
          let unchanged=0;
          for(const entry of entries){
            const dest=move(entry.path), bytes=fs.readFileSync(dest);
            const expected=relocation.expectedPostimageSha256[dest];
            if(expected)assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),expected);
            else {assert.deepEqual(bytes,fs.readFileSync(path.join(beforeRoot,entry.path)));unchanged++;}
          }
          for(const old of Object.keys(relocation.moves))assert.equal(fs.existsSync(old),false);
          for(const [name,data]of Object.entries({before,after})){
            const dir=path.join(out,'inventory-'+name);fs.mkdirSync(dir,{recursive:true});
            for(const [part,value]of Object.entries(data))fs.writeFileSync(path.join(dir,part+'.json'),JSON.stringify(value,null,2)+'\n');
          }
          const proof={originalTrackedFiles:entries.length,unchangedOriginalFiles:unchanged,changedOrMovedSourceFiles:Object.keys(relocation.expectedPostimageSha256).length,rewrittenReferences:relocation.edits.length,staticLocalEdgesBefore:before.edges.length,staticLocalEdgesAfter:after.edges.length,mappedStaticGraphEqual:true,newUnresolvedReferences:0,semanticReviewComplete:false,scope:'Static imports and exact unchanged bytes, not dynamic/SQL/native reachability or device proof.'};
          fs.writeFileSync(path.join(out,'graph-proof.json'),JSON.stringify(proof,null,2)+'\n');console.log(proof);
          JS
      - name: TypeScript after relocation
        shell: bash
        run: |
          set -o pipefail
          ./node_modules/.bin/tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/uskoci-refactor/typescript.log"
      - name: Existing AI contracts and inventory tool, offline only
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap scripts/product-audit.test.cjs supabase/proofs/ai/worker_mode_short_replies.test.mjs supabase/proofs/ai/worker_mode_declarations.test.mjs supabase/proofs/ai/single_pass_edge.test.mjs supabase/proofs/dynamic_taxonomy/worker-interview-question-policy.test.mjs 2>&1 | tee "$RUNNER_TEMP/uskoci-refactor/node-tests.log"
      - name: Full mobile tests, including the two relocated suites
        shell: bash
        run: |
          set -o pipefail
          npm test -- --maxWorkers=2 --silent --json --outputFile "$RUNNER_TEMP/uskoci-refactor/jest.json" 2>&1 | tee "$RUNNER_TEMP/uskoci-refactor/mobile-tests.log"
      - name: Android Metro export after relocation, not an APK or device test
        shell: bash
        run: |
          set -o pipefail
          node - <<'JS' 2>&1 | tee "$RUNNER_TEMP/uskoci-refactor/android-export.log"
          const {spawnSync}=require('node:child_process');
          const env={...process.env,...require('./eas.json').build.preview.env,EAS_BUILD_PROFILE:'preview',USKOCI_OTA_TARGET:'preview',EXPO_NO_TELEMETRY:'1',EXPO_OFFLINE:'1'};
          const r=spawnSync(process.execPath,['node_modules/expo/bin/cli','export','--platform','android','--output-dir',process.env.RUNNER_TEMP+'/uskoci-refactor-export'],{env,stdio:'inherit'});
          if(r.error)throw r.error;process.exit(r.status ?? 1);
          JS
      - name: Record precise evidence in the existing plan and retire temporary writers
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const out=path.join(process.env.RUNNER_TEMP,'uskoci-refactor');
          const j=JSON.parse(fs.readFileSync(path.join(out,'jest.json'),'utf8'));
          assert.equal(j.success,true);assert.equal(j.numFailedTests,0);assert.equal(j.numFailedTestSuites,0);
          for(const name of ['aiDownLine.test.ts','aiInterviewWelcome.test.ts'])assert.ok(j.testResults.some(r=>r.name.endsWith('/tests/ai/__tests__/'+name)&&r.status==='passed'));
          const text=fs.readFileSync(path.join(out,'node-tests.log'),'utf8');
          const number=key=>{const m=text.match(new RegExp('^# '+key+' (\\d+)','m'));if(!m)throw Error('MISSING_NODE_COUNT '+key);return Number(m[1]);};
          assert.equal(number('fail'),0);assert.equal(number('skipped'),0);
          const relocation=JSON.parse(fs.readFileSync(path.join(out,'relocation.json'),'utf8'));
          for(const [file,hash]of Object.entries(relocation.expectedPostimageSha256))assert.equal(crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'),hash);
          const receipt={kind:'R11_AI_INTAKE_STRUCTURE_ACCEPTANCE',date:'2026-11-04',baselineSource:process.env.BASELINE_SHA,workflowSource:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runUrl:'https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID,branch:'work/product-cleanup-20261104',baselineRun:41743652087,scope:{runtimeLogicChanged:false,sqlChanged:false,edgeDeployment:false,paidModel:false,nativeDevice:false,apk:false,production:false,fullRepositorySemanticReview:false},graph:JSON.parse(fs.readFileSync(path.join(out,'graph-proof.json'),'utf8')),verification:{nodeVersion:process.version,lockedInstall:true,typeScript:true,nodeTests:number('tests'),nodePass:number('pass'),nodeFail:number('fail'),mobileSuites:j.numTotalTestSuites,mobileTests:j.numTotalTests,mobilePassed:j.numPassedTests,mobileFailed:j.numFailedTests,mobilePending:j.numPendingTests,androidMetroExport:true},moves:relocation.moves,runtimeAndTestSha256:relocation.expectedPostimageSha256,remaining:['Full semantic audit of remaining modules','Live AI bundle alignment and real-user acceptance','R01 privacy/parity and R10 lifecycle','Actual two-account/device/push acceptance'],note:'Runtime hashes were verified after tests and export. Final commit adds this evidence and plan entry and removes temporary workflow/recipe only; it is not a new native or live-server proof.'};
          const dest='docs/continuation/product-cleanup-20261104/receipt.json';fs.mkdirSync(path.dirname(dest),{recursive:true});fs.writeFileSync(dest,JSON.stringify(receipt,null,2)+'\n');fs.writeFileSync(path.join(out,'receipt.json'),JSON.stringify(receipt,null,2)+'\n');
          const master='docs/plan/CODEX_PLAN_RADA.md';let source=fs.readFileSync(master,'utf8');
          const anchor='### 11.2a. Aktuelni izvršni status — 28.10.2026.';
          assert.equal(source.split(anchor).length,2);
          const entry='\n\n#### R11 — izdvojena zajednicka AI intake pravila, 04.11.2026.\n\nPosebna grana `work/product-cleanup-20261104`, polazni `a3623973`. Tri modula iz `src/ui/aiFirst/` premestena u `src/features/ai/intake/`, dve postojece provere u `tests/ai/__tests__/`; 21 referenca uskladjena bez promene poslovne logike, UI ponasanja ili ruta. Sva nepromenjena originalna tela proverena bajt-po-bajt; mapirani staticki graf je isti. `scripts/product-audit.cjs` pravi popis svih pracenih fajlova i konzervativnih veza, ali NE proglasava semanticki audit ili odobrava brisanje. Izvestaji idu u ignorisani `artifacts/product-audit/`.\n\nLocked install, TypeScript, '+receipt.verification.nodePass+' Node provera, '+j.numPassedTests+'/'+j.numTotalTests+' mobilnih provera u '+j.numTotalTestSuites+' suite-ova i Android Metro export PASS. Tacan obuhvat, izvor, run i postimage hash-evi: [izvrsni receipt](../continuation/product-cleanup-20261104/receipt.json). Polazni run41743652087 zasebno potvrdjuje originalni kod. Privremeni workflow-i i migraciona skripta povuceni posle ovog prolaza. Nema DEV/SQL/Edge/OTA/model/telefon izmena, R01/R10 i realan AI/dvokorisnicki prihvat nisu zatvoreni. Ovo je strukturni korak istog R11, ne novi master ili zavrsen proizvod.\n';
          source=source.replace(anchor,anchor+entry);fs.writeFileSync(master,source);
          console.log(JSON.stringify(receipt));
          JS
          git rm -- .github/workflows/uskoci-product-baseline.yml .github/workflows/uskoci-product-refactor-once.yml scripts/product-refactor-once.cjs
          git add -- docs/plan/CODEX_PLAN_RADA.md docs/continuation/product-cleanup-20261104/receipt.json
          git diff --cached --check
          node scripts/product-audit.cjs --out "$RUNNER_TEMP/uskoci-refactor/inventory-final"
          git diff --cached --stat > "$RUNNER_TEMP/uskoci-refactor/change-stat.txt"
      - name: Publish only to the isolated branch with an unchanged remote lease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target='refs/heads/work/product-cleanup-20261104'
          test "$GITHUB_REF" = "$target"
          remote=$(git ls-remote origin "$target" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'USKOCI verified restructuring'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(r11): isolate shared AI intake and its tests with full mobile acceptance'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:$target"
          git rev-parse HEAD > "$RUNNER_TEMP/uskoci-refactor/published-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uskoci-product-restructure-evidence
          path: ${{ runner.temp }}/uskoci-refactor/
          if-no-files-found: error
          retention-days: 14
