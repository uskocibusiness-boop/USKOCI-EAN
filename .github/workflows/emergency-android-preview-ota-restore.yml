name: Emergency Android preview OTA restore (fail closed)

# One-shot emergency recovery. Changes to application sources do not trigger this workflow.
# Never modify the installed APK, native runtime, database, or production channel.
on:
  # Explicit operator action only. Source pushes never roll back user's preview app.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uskoci-preview-ota-emergency-restore
  cancel-in-progress: false

jobs:
  restore-previous-update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: '1'
      EAS_BUILD_PROFILE: preview
      USKOCI_OTA_TARGET: preview
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact preview application identity and login
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo "::error::EXPO_TOKEN is not configured in GitHub Actions. No update was published."; exit 1; }
          node - <<'NODE'
          const app=require('./app.json').expo, eas=require('./eas.json');
          if(app.extra?.eas?.projectId!=='1e6cc490-9851-4741-9226-128612122db6' ||
             app.android?.package!=='rs.uskoci.preview' || app.runtimeVersion!=='uskoci-v1-preview-r1' ||
             app.updates?.requestHeaders?.['expo-channel-name']!=='preview' || eas.build?.preview?.channel!=='preview') {
            throw new Error('PREVIEW_IDENTITY_MISMATCH: no rollback performed');
          }
          console.log('Preview identity and runtime verified; production untouched.');
          NODE
      - name: Read currently published Android preview groups
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@23.2.0 update:list --branch preview --platform android --runtime-version uskoci-v1-preview-r1 --limit 5 --json --non-interactive > /tmp/preview-ota-groups.json
      - name: Require EXACT screenshot order and known-good previous update
        id: select
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('/tmp/preview-ota-groups.json','utf8'));
          const rows=report.currentPage;
          if (!Array.isArray(rows) || rows.length<2) throw new Error('EXPECTED_TWO_UPDATES_NOT_FOUND: aborting safely');
          const [latest,previous]=rows;
          function requirePreview(x) {
            return x.branch==='preview' && x.runtimeVersion==='uskoci-v1-preview-r1' &&
              /android/i.test(String(x.platforms)) && x.isRollBackToEmbedded!==true &&
              /^[0-9a-f]{8}-[0-9a-f-]{20,}$/i.test(String(x.group));
          }
          if(!requirePreview(latest)||!requirePreview(previous)) throw new Error('PREVIEW_RUNTIME_OR_PLATFORM_DRIFT: aborting safely');
          if(!/Clean Airbnb review, student casual helper/i.test(String(latest.message)))
            throw new Error('LATEST_UPDATE_CHANGED: aborting safely; do not overwrite a newer repair');
          if(!/b06a3711/i.test(String(previous.message)))
            throw new Error('KNOWN_GOOD_UPDATE_MISSING: aborting safely');
          if(latest.group===previous.group) throw new Error('SAME_GROUP: aborting');
          console.log('Latest suspected update:',latest.group,'; previous candidate:',previous.group);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'good_group='+previous.group+'\n');
          NODE
      - name: Restore already-published previous Android bundle (no rebuild)
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@23.2.0 update:republish \
            --group "${{ steps.select.outputs.good_group }}" \
            --destination-branch preview \
            --platform android \
            --message "EMERGENCY preview Android rollback to b06a3711 (boot-loop recovery)" \
            --non-interactive
      - name: Confirm new OTA is the Android preview restoration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@23.2.0 update:list --branch preview --platform android --runtime-version uskoci-v1-preview-r1 --limit 1 --json --non-interactive > /tmp/preview-ota-after.json
          node - <<'NODE'
          const report=require('/tmp/preview-ota-after.json'), top=report.currentPage?.[0];
          if (!top || top.branch!=='preview' || top.runtimeVersion!=='uskoci-v1-preview-r1' ||
              !/EMERGENCY preview Android rollback to b06a3711/.test(String(top.message)))
            throw new Error('ROLLBACK_READBACK_NOT_CONFIRMED');
          console.log('CONFIRMED: preview/Android/runtime received rollback group',top.group);
          NODE
