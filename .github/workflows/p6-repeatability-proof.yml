name: P6 repeatability and authorized scan controls
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p6-repeatability-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-proof:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/p6-discovery-private
      P6_PUBLIC_ARTIFACT_DIR: /tmp/p6-discovery-evidence
      P6_HISTORICAL_PKG045_REPLAY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Exact source, locked dependencies and measurement tests
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$P6_PUBLIC_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git rev-parse HEAD 'HEAD^{tree}' > "$P6_PUBLIC_ARTIFACT_DIR/source-binding.txt"
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/dependencies.log" 2>&1
          python3 supabase/migrations/check_migration_integrity.py > "$PRE_V3_ARTIFACT_DIR/integrity.log" 2>&1
          python3 -B -m unittest discover -s supabase/proofs/discovery -p test_p6_repeatability.py -v > "$P6_PUBLIC_ARTIFACT_DIR/parser-checks.txt" 2>&1
          PYTHONPATH=supabase/proofs/discovery python3 -B - <<'PY'
          from pathlib import Path
          from p6_repeatability import compose
          compose(Path.cwd())
          print('PASS P6_EXACT_STACK_AND_PROOF_COMPOSITION')
          PY
          supabase --version > "$PRE_V3_ARTIFACT_DIR/cli-version.txt"
          supabase stop --help > "$PRE_V3_ARTIFACT_DIR/stop-help.txt"
          git diff --quiet
      - name: Reconstruct the approved disposable historical baseline
        run: |
          set -euo pipefail
          umask 077
          status=0
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/live79.log" 2>&1 || status=$?
          printf 'live79 exit=%s\n' "$status" | tee "$P6_PUBLIC_ARTIFACT_DIR/stages.txt"
          exit "$status"
      - name: Guard loopback and replay the same frozen predecessor
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL,process.env.RU5_DEVICE_DB_URL);
          if(process.env.DB_URL!==process.env.RU5_DEVICE_DB_URL) throw Error('P6_LOCAL_TARGET_ADMISSION');
          NODE
          run_stage() {
            local label="$1" status=0
            shift
            "$@" > "$PRE_V3_ARTIFACT_DIR/$label.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$label" "$status" | tee -a "$P6_PUBLIC_ARTIFACT_DIR/stages.txt"
            return "$status"
          }
          run_stage source147 python3 supabase/proofs/pkg023j/replay_source147.py
          for pkg in 027 028 029 030 031 032 033 034 035 037 038 039 040 042; do
            run_stage "pkg$pkg" node "supabase/proofs/pkg$pkg/pkg${pkg}_proof.mjs" replay
          done
          run_stage historical045 node supabase/proofs/discovery/p6_discovery_prepare.mjs
      - name: Three measured blocks with RLS and payload guards intact
        run: |
          set -euo pipefail
          umask 077
          status=0
          python3 -B supabase/proofs/discovery/p6_repeatability.py run > "$PRE_V3_ARTIFACT_DIR/repeat-proof.log" 2>&1 || status=$?
          printf 'repeat-proof exit=%s\n' "$status" | tee -a "$P6_PUBLIC_ARTIFACT_DIR/stages.txt"
          exit "$status"
      - name: Destroy disposable stack without backup
        if: always()
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$P6_PUBLIC_ARTIFACT_DIR"
          status=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || status=$?
          fi
          printf 'teardown exit=%s\n' "$status" | tee -a "$P6_PUBLIC_ARTIFACT_DIR/stages.txt"
          exit "$status"
      - name: Evidence and existing control generation, never P6 completion
        if: success()
        run: |
          python3 -B supabase/proofs/discovery/p6_repeatability.py record
          node scripts/control/osvezi.mjs > "$PRE_V3_ARTIFACT_DIR/control.log" 2>&1
          git diff --check
          python3 -B - <<'PY'
          import os, subprocess
          allowed={'docs/control/redovi.json','docs/control/stanje.json','docs/control/FINALIZATION_MATRIX.md','docs/control/out/tabla.html'}
          prefix='docs/implementation/product-v1-closure-20260926/finalization-20260927/'
          allowed|={prefix+'ROUND_49_P6_REPEATABILITY.md',prefix+'ROUND_49_P6_CHECKS.json',prefix+'round49/p6-repeat-samples.json'}
          changed=subprocess.check_output(['git','diff','--name-only',os.environ['GITHUB_SHA']],text=True).splitlines()
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          assert all(p in allowed for p in changed+untracked),'Outside bounded evidence package'
          for p in ['src/app','src/data/supabaseIzvor.ts','src/data/ports.ts']:
              assert subprocess.run(['grep','-R','-n','-F','rpc_discovery_v1',p],capture_output=True).returncode==1,'P6 production wiring forbidden'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/control/redovi.json docs/control/stanje.json docs/control/FINALIZATION_MATRIX.md docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_49_P6_REPEATABILITY.md docs/implementation/product-v1-closure-20260926/finalization-20260927/ROUND_49_P6_CHECKS.json docs/implementation/product-v1-closure-20260926/finalization-20260927/round49/
          git add -f docs/control/out/tabla.html
          git commit -m 'docs(control): record repeated P6 cost and owner stop condition'
      - name: Fast-forward only on unchanged canonical HEAD
        if: success()
        run: |
          branch='work/uskoci-ui-unification-20260924'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > "$P6_PUBLIC_ARTIFACT_DIR/published-head.txt"
      - name: Preserve scoped evidence and unpublished patch on failure too
        if: always()
        run: |
          mkdir -p "$P6_PUBLIC_ARTIFACT_DIR"
          git diff "$GITHUB_SHA" --binary > "$P6_PUBLIC_ARTIFACT_DIR/candidate.patch"
          git log -3 --format='%H %s' > "$P6_PUBLIC_ARTIFACT_DIR/commits.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p6-repeatability-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/p6-discovery-evidence/
          if-no-files-found: error
          retention-days: 30
