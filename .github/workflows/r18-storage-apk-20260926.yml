name: Request verified R18 storage Android APK
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths: ['.github/workflows/r18-storage-apk-20260926.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: r18-storage-apk-20260926
  cancel-in-progress: false
jobs:
  request-one-phone-build:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APPROVED_SOURCE: '33d86b45a06883af8524130a3e6cf2ee1b69e61b'
      PROOF_RUN: '36241718929'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify exact passed source and unchanged development build workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r18-storage-apk
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN" > /tmp/r18-storage-apk/proof.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const git = (...args) => execFileSync('git',args,{encoding:'utf8'}).trim();
          assert.equal(git('rev-parse','HEAD'),process.env.GITHUB_SHA);
          assert.equal(git('rev-parse','HEAD^'),process.env.APPROVED_SOURCE);
          assert.equal(git('diff','--name-only',process.env.APPROVED_SOURCE,'HEAD'),'.github/workflows/r18-storage-apk-20260926.yml');
          assert.equal(git('hash-object','.github/workflows/build-android-dev-apk.yml'),'9a2eab961d04f6e95d65c06cb47aa2d5165500cf');
          const e = JSON.parse(readFileSync('docs/implementation/release-hardening-20260926/STORAGE_INTEGRITY_CHECKS.json','utf8'));
          const proof = JSON.parse(readFileSync('/tmp/r18-storage-apk/proof.json','utf8'));
          assert.equal(proof.id,Number(process.env.PROOF_RUN));
          assert.equal(proof.head_sha,e.candidateBase);
          assert.equal(proof.status,'completed'); assert.equal(proof.conclusion,'success');
          assert.equal(e.types,'PASS'); assert.equal(e.full.failed,0); assert.equal(e.focused.failed,0);
          for (const [path,blob] of Object.entries(e.runtimeBlobs)) assert.equal(git('hash-object',path),blob);
          writeFileSync('/tmp/r18-storage-apk/request.json',JSON.stringify({ref:'work/uskoci-ui-unification-20260924',inputs:{target:'phone'}}));
          writeFileSync('/tmp/r18-storage-apk/binding.json',JSON.stringify({source:process.env.GITHUB_SHA,verifiedRuntime:process.env.APPROVED_SOURCE,proofRun:Number(process.env.PROOF_RUN),target:'phone',applicationId:'rs.uskoci.dev',devMutation:false,edgeDeployment:false,pushTest:false,deviceTest:false},null,2));
          NODE
      - name: Dispatch at most one development phone APK for this exact source
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=work%2Fuskoci-ui-unification-20260924&per_page=1" --jq '.[0].sha')
          test "$current" = "$GITHUB_SHA" || { echo 'Branch moved; no build requested.'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20" > /tmp/r18-storage-apk/existing.json
          existing=$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const r=JSON.parse(readFileSync('/tmp/r18-storage-apk/existing.json','utf8'));
          const found=r.workflow_runs.find(x=>x.head_sha===process.env.GITHUB_SHA && x.path==='.github/workflows/build-android-dev-apk.yml' && x.event==='workflow_dispatch');
          process.stdout.write(found ? String(found.id) : '');
          NODE
          )
          if test -n "$existing"; then
            printf '{"existingWorkflowRunId":%s,"newDispatch":false}\n' "$existing" > /tmp/r18-storage-apk/dispatch.json
          else
            gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/actions/workflows/build-android-dev-apk.yml/dispatches" \
              --input /tmp/r18-storage-apk/request.json > /tmp/r18-storage-apk/dispatch.json
          fi
          cat /tmp/r18-storage-apk/dispatch.json
      - name: Preserve the request, not a claim that a device was tested
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r18-storage-apk-request-${{ github.run_id }}
          path: |
            /tmp/r18-storage-apk/binding.json
            /tmp/r18-storage-apk/dispatch.json
          if-no-files-found: warn
