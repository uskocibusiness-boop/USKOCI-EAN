name: P6 client contract quarantine
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/p6-client-contract-proof.yml'
      - 'src/data/discoveryV1Contract.ts'
      - 'src/data/__tests__/discovery-v1-contract.test.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json
      - name: Strict response contract
        run: npx jest --runInBand --testTimeout=30000 --runTestsByPath src/data/__tests__/discovery-v1-contract.test.ts
      - name: Guard production from premature P6 wiring
        run: |
          if grep -R --line-number --fixed-strings "rpc_discovery_v1" src/app src/data/supabaseIzvor.ts src/data/ports.ts; then
            echo "Partial P6 must remain unwired until MAP/PLACES and runtime proof are complete"
            exit 1
          fi
