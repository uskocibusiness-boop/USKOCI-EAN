name: Owner-reviewed taxonomy admission PostgreSQL proof
on:
  pull_request:
    paths:
      - 'supabase/candidates/dynamic-taxonomy-20261011/owner-reviewed-admission-v1.sql'
      - 'supabase/candidates/dynamic-taxonomy-20261011/disposable-owner-admission-*.sql'
      - 'supabase/candidates/dynamic-taxonomy-20261011/owner-reviewed-batch-admission-v1.sql'
      - 'supabase/candidates/dynamic-taxonomy-20261011/disposable-owner-batch-*.sql'
      - '.github/workflows/taxonomy-owner-reviewed-admission-pg-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16','17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Install isolated catalog schema and owner-review fixture
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/catalog-foundation.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-owner-admission-fixture.sql
      - name: Install owner-reviewed transaction candidate
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/owner-reviewed-admission-v1.sql
      - name: Prove approval, identity reuse and no dispatch authority
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-owner-admission-assert.sql
      - name: Prove stale legacy writes, Cyrillic normalization and strict mode
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-owner-admission-negative-assert.sql

      - name: Install disposable-only atomic multi-service catalog RPC
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/owner-reviewed-batch-admission-v1.sql
      - name: Prepare synthetic worker/need signed review batch envelopes
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-owner-batch-fixture.sql
      - name: Prove atomic multi-service save, reverse identity, rollback and replay
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-owner-batch-assert.sql
