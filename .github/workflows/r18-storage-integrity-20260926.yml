name: R18 storage integrity red-green proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r18-storage-integrity-20260926
  cancel-in-progress: false
jobs:
  prove-and-record:
    if: github.repository == 'uskocibusiness-boop/USKOCI-EAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CI: 'true'
      DO_NOT_TRACK: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Prepare exact dependencies and failing regression cases
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check scripts/proofs/r18-storage-integrity-20260926.mjs
          npm ci
          mkdir -p /tmp/r18-storage
          node scripts/proofs/r18-storage-integrity-20260926.mjs tests
      - name: Prove the defects against unchanged application source
        shell: bash
        run: |
          set +e
          npm test -- --runInBand --json --outputFile=/tmp/r18-storage/baseline.json src/data/__tests__/application-composer-read.test.tsx src/data/__tests__/application-command-journal.test.ts
          code=$?
          set -e
          test "$code" = 1
          node scripts/proofs/r18-storage-integrity-20260926.mjs baseline
      - name: Prepare the source repair in this disposable checkout only
        run: node scripts/proofs/r18-storage-integrity-20260926.mjs patch
      - name: Check TypeScript
        run: |
          npx tsc --noEmit
          echo PASS > /tmp/r18-storage/types.ok
      - name: Check application, selection and journal regressions
        run: >-
          npm test -- --runInBand --json --outputFile=/tmp/r18-storage/focused.json
          src/data/__tests__/application-composer-read.test.tsx
          src/data/__tests__/application-selection-native.test.tsx
          src/data/__tests__/application-selection-client.test.ts
          src/data/__tests__/application-command-journal.test.ts
      - name: Full unchanged regression gate
        run: npm test -- --runInBand --json --outputFile=/tmp/r18-storage/full.json
      - name: Record exact evidence and regenerate the existing control table
        run: |
          node scripts/proofs/r18-storage-integrity-20260926.mjs record
          node scripts/control/osvezi.mjs
          git diff --check
      - name: Save only tested source and evidence without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          git add -- 'src/app/(app)/prilike/[id]/prijava.tsx' src/data/applicationCommandJournal.ts \
            src/data/__tests__/application-composer-read.test.tsx src/data/__tests__/application-command-journal.test.ts \
            docs/control/redovi.json docs/control/stanje.json \
            docs/implementation/design-system/r19-task-agreement-20260925/NEXT.md \
            docs/implementation/release-hardening-20260926/STORAGE_INTEGRITY.md \
            docs/implementation/release-hardening-20260926/STORAGE_INTEGRITY_CHECKS.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const git = (...args) => execFileSync('git', args, {encoding:'utf8'}).trim();
          const allowed = new Set(['src/app/(app)/prilike/[id]/prijava.tsx','src/data/applicationCommandJournal.ts',
            'src/data/__tests__/application-composer-read.test.tsx','src/data/__tests__/application-command-journal.test.ts',
            'docs/control/redovi.json','docs/control/stanje.json',
            'docs/implementation/design-system/r19-task-agreement-20260925/NEXT.md',
            'docs/implementation/release-hardening-20260926/STORAGE_INTEGRITY.md',
            'docs/implementation/release-hardening-20260926/STORAGE_INTEGRITY_CHECKS.json']);
          const changed = git('diff','--cached','--name-only').split('\n');
          assert.equal(changed.length, allowed.size);
          assert.ok(changed.every(path => allowed.has(path)), 'Unexpected staged file');
          const e = JSON.parse(readFileSync('docs/implementation/release-hardening-20260926/STORAGE_INTEGRITY_CHECKS.json','utf8'));
          for (const [path, blob] of Object.entries(e.runtimeBlobs)) assert.equal(git('hash-object',path),blob,'Source changed after tests');
          NODE
          remote_head=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA" || { echo 'Branch moved. Preserve evidence; do not force push.'; exit 1; }
          git config user.name 'USKOCI evidence bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix and prove durable application reset and exact journal identity'
          git push origin "HEAD:$GITHUB_REF"
          git rev-parse HEAD > /tmp/r18-storage/commit.txt
      - name: Collect source, report and actual generated table
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/r18-storage/package
          for file in 'src/app/(app)/prilike/[id]/prijava.tsx' src/data/applicationCommandJournal.ts \
            src/data/__tests__/application-composer-read.test.tsx src/data/__tests__/application-command-journal.test.ts \
            docs/control/redovi.json docs/control/stanje.json docs/control/out/tabla.html \
            docs/implementation/design-system/r19-task-agreement-20260925/NEXT.md \
            docs/implementation/release-hardening-20260926/STORAGE_INTEGRITY.md \
            docs/implementation/release-hardening-20260926/STORAGE_INTEGRITY_CHECKS.json; do
            if test -f "$file"; then cp --parents "$file" /tmp/r18-storage/package; fi
          done
          git diff > /tmp/r18-storage/candidate.diff
      - name: Preserve red and green evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r18-storage-integrity-${{ github.run_id }}
          if-no-files-found: warn
          path: /tmp/r18-storage
