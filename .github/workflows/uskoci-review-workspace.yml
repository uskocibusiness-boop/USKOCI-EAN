name: USKOCI temporary read-only review workspace

# Temporary acquisition bridge for this review, not a source writer or deploy.
# It reads the already-approved commit, never accesses application secrets,
# and is removed with the tested implementation batch.
on:
  push:
    branches: [work/rev14-review-f17]
    paths: [.github/workflows/uskoci-review-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: '1'
      SOURCE_SHA: 4e6f5c05579d0151a3aefe791738634120ad6bb4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4e6f5c05579d0151a3aefe791738634120ad6bb4
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Capture tracked source and locked JavaScript test dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/uskoci-source" "$RUNNER_TEMP/uskoci-workspace"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/uskoci-source"
          npm ci --ignore-scripts --no-audit --no-fund
          tar -czf "$RUNNER_TEMP/uskoci-workspace/source.tgz" --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff' --exclude='*.woff2' --exclude='*.eot' -C "$RUNNER_TEMP/uskoci-source" .
          tar -czf "$RUNNER_TEMP/uskoci-workspace/test-dependencies.tgz" --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff' --exclude='*.woff2' --exclude='*.eot' node_modules
          git ls-tree -r HEAD > "$RUNNER_TEMP/uskoci-workspace/tracked-tree.txt"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/uskoci-workspace/source-sha.txt"
          printf '%s\n' 'Tracked source only; no .git or secrets. Font bytes excluded. Dependencies installed with --ignore-scripts: project postinstall patches must be applied before claiming ordinary project-test parity. No DEV, model or native execution.' > "$RUNNER_TEMP/uskoci-workspace/SCOPE.txt"
          cd "$RUNNER_TEMP/uskoci-workspace"
          sha256sum source.tgz test-dependencies.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uskoci-review-workspace-4e6f5c0
          path: ${{ runner.temp }}/uskoci-workspace/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
