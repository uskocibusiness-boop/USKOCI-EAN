name: Gemini owner-turn hint capture (disposable PostgreSQL)
on:
  pull_request:
    paths:
      - 'supabase/candidates/dynamic-taxonomy-20261011/gemini-turn-review-hints-v1.sql'
      - 'supabase/candidates/dynamic-taxonomy-20261011/disposable-gemini-hints-*.sql'
      - '.github/workflows/taxonomy-gemini-hints-pg-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  durable-turn-fencing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16','17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Prepare isolated owner and turn tables
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-gemini-hints-fixture.sql
      - name: Install isolated non-authoritative hint capture
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/gemini-turn-review-hints-v1.sql
      - name: Prove success fencing, owner auth, idempotency, privacy and mode rejection
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/candidates/dynamic-taxonomy-20261011/disposable-gemini-hints-assert.sql
