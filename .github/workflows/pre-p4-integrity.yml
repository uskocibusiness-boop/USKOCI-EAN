name: PRE-P4 integrity

on:
  push:
    branches:
      - clean-alpha-backend
      - work/uskoci-ui-unification-20260924
      - integration/spoj-20261006
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - clean-alpha-backend
      - work/uskoci-ui-unification-20260924
      - integration/spoj-20261006

  workflow_dispatch:
    inputs:
      level:
        description: Fast source checks, changed domains, or all integrated domains
        type: choice
        options: [fast, domain, release]
        default: release

permissions:
  contents: read

concurrency:
  group: pre-p4-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-p4-integrity:
    name: pre-p4-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      push: ${{ steps.scope.outputs.push }}
      w03: ${{ steps.scope.outputs.w03 }}
      auth: ${{ steps.scope.outputs.auth }}
      export: ${{ steps.scope.outputs.export }}
      retention: ${{ steps.scope.outputs.retention }}
      consent: ${{ steps.scope.outputs.consent }}
      processors: ${{ steps.scope.outputs.processors }}
      policy: ${{ steps.scope.outputs.policy }}
      w02: ${{ steps.scope.outputs.w02 }}
      w02_scope: ${{ steps.scope.outputs.w02_scope }}
    steps:
      - name: Checkout canonical tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Capture the exact checked-out source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uskoci-source"
          git rev-parse HEAD > "$RUNNER_TEMP/uskoci-source/source-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/uskoci-source/source-tree.txt"
          git archive --format=zip --output="$RUNNER_TEMP/uskoci-source/source.zip" HEAD
          (cd "$RUNNER_TEMP/uskoci-source" && sha256sum source.zip > SHA256SUMS)

      - name: Retain source independently of test outcome
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uskoci-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uskoci-source/
          if-no-files-found: error
          retention-days: 7

      - name: Determine the exact changed-source scope
        id: scope
        env:
          CI_LEVEL: ${{ inputs.level || 'fast' }}
        run: node scripts/ci/scope.cjs plan

      - name: Verify CI routing and source admission invariants
        run: |
          node --test scripts/ci/*.test.cjs
          node --test supabase/proofs/legal/pending_source_plan.test.mjs supabase/proofs/legal/pending_domain_replay.test.mjs scripts/ci/owned-intake-source.test.mjs

      - name: Verify migration bytes and provenance
        id: migration
        if: steps.scope.outputs.migration == 'true'
        run: sh supabase/migrations/check_md5.sh

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        id: dependencies
        run: npm ci

      - name: Verify dashboard snapshot rendering boundaries
        id: dashboard
        run: node --test scripts/control/tabla-rendering.test.cjs

      - name: Verify Windows Metro cache bound and installed Expo disk compatibility
        id: metro
        run: node --test scripts/metro-cache-concurrency.test.cjs

      - name: Verify public build identity projection
        id: build_identity
        run: node --test scripts/build-identity.test.cjs

      - name: TypeScript contract check
        id: typescript
        run: npx tsc --noEmit

      - name: Selected regressions; full suite only at the full-source boundary
        id: regression
        env:
          CI_LEVEL: ${{ inputs.level || 'fast' }}
        run: node scripts/ci/scope.cjs test

      - name: Record observed gates, not production activation
        if: always()
        shell: bash
        env:
          SCOPE_RESULT: ${{ steps.scope.outcome }}
          TEST_MODE: ${{ steps.scope.outputs.mode }}
          MIGRATION_REQUIRED: ${{ steps.scope.outputs.migration }}
          MIGRATION_RESULT: ${{ steps.migration.outcome }}
          DEPENDENCIES_RESULT: ${{ steps.dependencies.outcome }}
          DASHBOARD_RESULT: ${{ steps.dashboard.outcome }}
          METRO_RESULT: ${{ steps.metro.outcome }}
          BUILD_IDENTITY_RESULT: ${{ steps.build_identity.outcome }}
          TYPESCRIPT_RESULT: ${{ steps.typescript.outcome }}
          REGRESSION_RESULT: ${{ steps.regression.outcome }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          names = ('scope', 'migration', 'dependencies', 'dashboard', 'metro', 'build_identity', 'typescript', 'regression')
          results = {name: os.environ.get(name.upper() + '_RESULT') or 'not_run' for name in names}
          checked_out = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          receipt = {
              'schemaVersion': 1,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'checkedOutCommit': checked_out,
              'workflowCommit': os.environ['GITHUB_SHA'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'gates': results,
              'allRecordedGatesPassed': all(value == 'success' or
                  (name == 'migration' and value == 'skipped' and os.environ['MIGRATION_REQUIRED'] == 'false')
                  for name, value in results.items()),
              'testMode': os.environ['TEST_MODE'],
              'migrationRequired': os.environ['MIGRATION_REQUIRED'] == 'true',
              'fullReleaseProven': False,
              'environment': 'github-actions-source-checks',
              'productionApplied': False,
              'deviceE2eVerified': False,
              'providerVerified': False,
          }
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'uskoci-build-evidence'
          out.mkdir(exist_ok=True)
          (out / 'build-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - name: Retain build receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uskoci-build-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uskoci-build-evidence/build-receipt.json
          if-no-files-found: error
          retention-days: 7

  domain-push:
    needs: pre-p4-integrity
    if: needs.pre-p4-integrity.outputs.push == 'true'
    uses: ./.github/workflows/notifications-n06-push-registry-proof.yml
    with:
      scope: transport

  domain-auth:
    needs: pre-p4-integrity
    if: needs.pre-p4-integrity.outputs.auth == 'true'
    uses: ./.github/workflows/w01-auth-recovery-proof.yml

  domain-export:
    needs: pre-p4-integrity
    if: needs.pre-p4-integrity.outputs.export == 'true'
    uses: ./.github/workflows/p2-data-export-proof.yml

  domain-retention:
    needs: pre-p4-integrity
    if: needs.pre-p4-integrity.outputs.retention == 'true'
    uses: ./.github/workflows/p3-retention-schedule-proof.yml

  domain-consent:
    needs: pre-p4-integrity
    if: needs.pre-p4-integrity.outputs.consent == 'true'
    uses: ./.github/workflows/p1-legal-consent-proof.yml

  domain-processors:
    needs: pre-p4-integrity
    if: needs.pre-p4-integrity.outputs.processors == 'true'
    uses: ./.github/workflows/p4-processor-map-proof.yml

  domain-policy:
    needs: pre-p4-integrity
    if: needs.pre-p4-integrity.outputs.policy == 'true'
    uses: ./.github/workflows/d0140a-bundle-registration-proof.yml

  domain-w02:
    needs: pre-p4-integrity
    if: needs.pre-p4-integrity.outputs.w02 == 'true'
    uses: ./.github/workflows/w02-calendar-authority-proof.yml
    with:
      scope: ${{ needs.pre-p4-integrity.outputs.w02_scope }}

  domain-w03:
    needs: pre-p4-integrity
    if: needs.pre-p4-integrity.outputs.w03 == 'true'
    uses: ./.github/workflows/ai-edge-context-proof.yml
    with:
      scope: intake
