# Send one offer on somebody else's Zadatak (B09), the two-device run of 2026-09-23.
#
# THIS FLOW WRITES. It sends a real Prijava from the signed-in account to a real task. It runs only
# on the owner's explicit word for that one run, on the device and task he named, and never as part
# of any routine pass. Price and task come in as env so nothing is baked in.
#
#   maestro --device emulator-5554 test -e TASK=".*krečenja stana.*" -e PRICE=3000 -e EXPECT=".*3.000.*" .maestro/send-offer.yaml
#
# The one action at the foot of the task is "Pošalji ponudu" on a task with no fixed price and "Pošalji prijavu" on one with a fixed price (8 Oct 2026); the flow takes either
# (LABEL is a pattern), and a run that knows the kind of price of its task may pin it: -e LABEL="Pošalji ponudu".
#
# The compose screen already opens an explicit review before sending (F10); this flow goes through it
# the way a person does: compose → Pregledaj ponudu → Pošalji ovu Prijavu → the "Tvoja prijava" landing.

appId: rs.uskoci.dev
env:
  TASK: ".*krečenja stana.*"
  PRICE: "3000"
  EXPECT: ".*3.000.*"
  LABEL: "Pošalji (ponudu|prijavu)"
---
- launchApp:
    clearState: false
- tapOn:
    text: "Mapa"
- tapOn:
    text: "Lista"
    optional: true
- scrollUntilVisible:
    element:
      text: ${TASK}
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ${TASK}
- takeScreenshot: 01-tudji-zadatak

# The card marked "Tvoj zadatak" belongs to this account and must not be here.
- assertNotVisible: "Ovo je tvoj zadatak"
- scrollUntilVisible:
    element:
      text: ${LABEL}
    direction: DOWN
    timeout: 15000
- extendedWaitUntil:
    visible: ${LABEL}
    timeout: 10000
- tapOn:
    text: ${LABEL}
# The compose screen is a separate route. Nothing below may run against the task detail by mistake,
# so the flow waits for the compose screen's own price field and fails here if it never opens.
- extendedWaitUntil:
    visible: "Ukupna cena za ljude koje dovodiš (RSD)"
    timeout: 15000
- takeScreenshot: 02-sastavi-prijavu

# On a task priced by its requester ("Moja cena") the amount is locked: the worker can accept that price,
# not name one. These three steps therefore do nothing on such a task and are optional; on an
# "OFFERS" task they set the amount.
- tapOn:
    text: "Ukupna cena za ljude koje dovodiš (RSD)"
    optional: true
- eraseText:
    optional: true
- inputText:
    text: ${PRICE}
    optional: true
# No hideKeyboard here: when the amount is locked no keyboard opens, and on Android that command then
# acts as Back and quietly leaves the compose screen — which is exactly what happened on the first two runs.
- takeScreenshot: 03-cena

- scrollUntilVisible:
    element:
      text: "Pregledaj ponudu"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "Pregledaj ponudu"
- assertVisible:
    text: ${EXPECT}
- takeScreenshot: 04-pregled-pre-slanja

# The one write. Everything before this point could be walked away from.
- tapOn:
    text: "Pošalji ovu Prijavu"
# F10: after sending, the app lands on the named receipt screen "Tvoja prijava" with "Otvori moje prijave"
# as its one action — that, not an inline sentence, is the confirmation a person sees.
- extendedWaitUntil:
    visible: "Otvori moje prijave"
    timeout: 20000
- assertVisible:
    text: ${EXPECT}
- takeScreenshot: 05-tvoja-prijava
