# Profile sub-screens, read-only: opens a few of the thirteen and photographs them. Nothing is saved,
# toggled or sent; every tap is an "open" and every step is optional so a missing row only costs a picture.

appId: rs.uskoci.dev
---
- launchApp:
    clearState: false
- tapOn:
    text: "Početna"
    optional: true
- tapOn:
    text: "Moj profil"
    optional: true
- takeScreenshot: 01-profil

- tapOn:
    text: "Privatnost i podaci"
    optional: true
- takeScreenshot: 02-privatnost
- back

- scrollUntilVisible:
    element:
      text: "Pravila i saglasnosti"
    direction: DOWN
    timeout: 10000
    optional: true
- tapOn:
    text: "Pravila i saglasnosti"
    optional: true
- takeScreenshot: 03-pravna
- back

- scrollUntilVisible:
    element:
      text: "Izvoz podataka"
    direction: DOWN
    timeout: 10000
    optional: true
- tapOn:
    text: "Izvoz podataka"
    optional: true
- takeScreenshot: 04-izvoz
- back

- scrollUntilVisible:
    element:
      text: "Podrška"
    direction: DOWN
    timeout: 10000
    optional: true
- tapOn:
    text: "Podrška"
    optional: true
- takeScreenshot: 05-podrska
- back

- scrollUntilVisible:
    element:
      text: "Radni profil"
    direction: UP
    timeout: 10000
    optional: true
- tapOn:
    text: "Radni profil"
    optional: true
- takeScreenshot: 06-radni-profil
- back
