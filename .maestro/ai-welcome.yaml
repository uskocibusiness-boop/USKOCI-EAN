# The AI conversation's welcome, read-only: opens "Objavi zadatak" from Početna, photographs the welcome
# with the assistant present and the hold-to-talk bar, and leaves. Nothing is said, typed or sent, so no
# conversation is opened on the server (the screen opens one only at the first word).

appId: rs.uskoci.dev
---
- launchApp:
    clearState: false
- tapOn:
    text: "Početna"
    optional: true
- tapOn:
    text: "Objavi zadatak.*"
- extendedWaitUntil:
    visible: "Reci šta ti treba."
    timeout: 15000
- takeScreenshot: 01-ai-uvod
# The composer is one pill (text, microphone, voice) since the AI chat of 2026-09-23: there is no "Piši umesto da govoriš" switch any more.
- takeScreenshot: 02-ai-kucanje
- back
- back
