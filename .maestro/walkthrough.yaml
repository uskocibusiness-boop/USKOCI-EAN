# USKOČI read-only device walkthrough
#
# Walks the app on a real, already signed-in phone and photographs each screen. It never writes:
# no offer is sent, no Dogovor is changed, nobody is blocked or reported, no message leaves, and the
# inbox is only read — "Označi sve kao pročitano" is a button this flow does not press.
# A signed-out phone stops at the entry screen, which is a legitimate outcome, not a failure.
#
# Selectors are the accessibility labels the screens already carry. On Android those arrive as the
# view's content description, which Maestro matches with "text" and not with "id", because the header
# is icons and a card is named by what it opens rather than by whose Dogovor it is.
#
# Prerequisites: rs.uskoci.dev installed from the commit under test; adb sees the device.

appId: rs.uskoci.dev
---
- launchApp:
    clearState: false
- takeScreenshot: 01-start

- runFlow:
    when:
      visible: "Prijavi se"
    commands:
      - takeScreenshot: 01a-entry-signed-out

# ── Početna ────────────────────────────────────────────────────────────────────────────────────
- tapOn:
    text: "Početna"
    optional: true
- takeScreenshot: 02-pocetna
- scroll
- takeScreenshot: 03-pocetna-nize

# ── Zadaci: the map, and the list as its sheet ─────────────────────────────────────────────────
- tapOn:
    text: "Zadaci"
    optional: true
- takeScreenshot: 04-mapa
# The list rests at its top line and the bottom navigation is away there (the owner's phone of 8 Oct 2026); the count is the sheet's handle, a tap raises the list to half
# and the navigation comes back with it, so the next tab can be reached.
- tapOn:
    id: "list-count"
    optional: true
- takeScreenshot: 05-lista-prilika

# ── Dogovori ───────────────────────────────────────────────────────────────────────────────────
- tapOn:
    text: "Dogovori"
    optional: true
- takeScreenshot: 06-dogovori-aktivni
# Aktivni and Istorija only since owner step 8 (round-1 critique A11); "Svi" is gone.
- tapOn:
    text: "Istorija"
    optional: true
- takeScreenshot: 07-dogovori-istorija
- tapOn:
    text: "Aktivni"
    optional: true

# A card names the Dogovor it opens ("Otvori Dogovor <naslov>"), so the first one can be opened
# without knowing whose account this is. Opening it changes nothing.
- tapOn:
    text: "Otvori Dogovor.*"
    optional: true
- takeScreenshot: 08-dogovor-pregled
# What can be done in a Dogovor is on the page, as rows (J15), not in a menu: "Izmeni uslove", "Prijavi problem", then in red
# "Otkaži Dogovor" and "Prijavi ili blokiraj osobu". Only a Dogovor that is still agreed has the first three; the picture is the
# evidence, so nothing here is pressed.
- scrollUntilVisible:
    element:
      text: "Prijavi ili blokiraj osobu"
    direction: DOWN
    timeout: 8000
    optional: true
- takeScreenshot: 09-dogovor-radnje

# PKG-048: the rows that say where this Dogovor came from ("Otvori zadatak", and "Tvoja prijava" for the worker).
# Present only on a build whose server carries the links, so the assertion is optional and the picture is the
# evidence either way.
- assertVisible:
    text: "Otvori zadatak"
    optional: true
- takeScreenshot: 10-dogovor-izvor

- tapOn:
    text: "Poruke"
    optional: true
- takeScreenshot: 11-dogovor-poruke
- back
- back

# ── Obaveštenja (zvono u zaglavlju) ────────────────────────────────────────────────────────────
- tapOn:
    text: "Obaveštenja,.*"
    optional: true
- takeScreenshot: 12-obavestenja
- back

# ── Profil (nalog u zaglavlju) ─────────────────────────────────────────────────────────────────
- tapOn:
    text: "Početna"
    optional: true
- tapOn:
    text: "Moj profil"
    optional: true
- takeScreenshot: 13-profil
- scroll
- takeScreenshot: 14-profil-nize
