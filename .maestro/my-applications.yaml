# The offer you sent, as your own side of it (B09 → B10 → B11).
#
# Read-only. It opens the list of your applications and photographs the one you sent; it does not
# send, edit or withdraw anything. "Povuci prijavu" is a button this flow never presses.
#
# Prerequisites: rs.uskoci.dev from the commit under test, signed in, and at least one sent offer.

appId: rs.uskoci.dev
---
- launchApp:
    clearState: false
- tapOn:
    text: "Početna"
    optional: true
- takeScreenshot: 01-pocetna

# Home has the row "Moje prijave" (with its count) since the wave of 2026-10-08; it opens the list of the offers you sent.
- tapOn:
    text: "Moje prijave.*"
    optional: true
- takeScreenshot: 02-moje-aktivnosti
- scrollUntilVisible:
    element:
      text: ".*troseda.*"
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    text: ".*troseda.*"
    optional: true
- takeScreenshot: 03-moje-prijave

# The offer's own card: price, state and what can still be done with it.
- assertVisible:
    text: ".*2.000.*"
    optional: true
- takeScreenshot: 04-prijava-2000
- scroll
- takeScreenshot: 05-prijava-nize
