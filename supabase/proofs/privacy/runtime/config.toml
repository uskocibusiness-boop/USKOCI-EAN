# Disposable CI only. No hosted project reference, providers, migrations or seeds.
project_id = "uskoci-r01-schema-ci"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# Reproduce the captured existing project's baseline; the generator restores
# captured application ACLs explicitly and the strict comparator verifies them.
auto_expose_new_tables = true

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[db.pooler]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true

[auth.email]
enable_signup = true
enable_confirmations = true

[local_smtp]
enabled = false

# Keep these services to initialize the managed relations referenced by the
# application. This schema test does not claim Storage/Realtime behavior proof.
[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
